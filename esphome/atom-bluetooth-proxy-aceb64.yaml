substitutions:
  name: atom-bluetooth-proxy-aceb64
  friendly_name: Bluetooth Proxy - Family Room
packages:
  esphome.bluetooth-proxy: github://esphome/bluetooth-proxies/m5stack/m5stack-atom-lite.yaml@main
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
api:
  encryption:
    key: !secret atom_bluetooth_proxy_aceb64_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


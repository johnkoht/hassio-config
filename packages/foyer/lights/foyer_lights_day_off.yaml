# Turn the foyer lights off during
# the day because of weather
#
automation:
  - id: "foyer_lights_days_off"
    initial_state: on
    alias: "Foyer Lights Day Off"
    triggers:
      # Bad weather boolean is activate for 5 mins
      - trigger: state
        entity_id: input_boolean.bad_weather
        to: "off"
        for:
          minutes: 5
      # It's lighter outside
      - trigger: numeric_state
        entity_id: sensor.tempest_illuminance
        above: 250
        for:
          minutes: 3
      # It's very bright outside
      - trigger: numeric_state
        entity_id: sensor.tempest_illuminance
        above: 500
        for:
          minutes: 3
      # Entertainment mode ends: re-check
      - trigger: state
        entity_id: input_boolean.entertainment_mode
        from: "on"
        to: "off"
        id: "entertainment_off"
    conditions:
      # Make sure lighting automations are on
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      # Make sure the house is occupied
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
      # Foyer is in Auto mode
      - condition: state
        entity_id: input_select.foyer
        state: "Auto"
      # Entertainment mode is off
      - condition: state
        entity_id: input_boolean.entertainment_mode
        state: "off"
      # When entertainment mode ends, only if the weather is not bad
      - condition: or
        conditions:
          - condition: not
            conditions:
              - condition: trigger
                id: "entertainment_off"
          - condition: state
            entity_id: input_boolean.bad_weather
            state: "off"
      # Sun is above the horizon
      - condition: state
        entity_id: sun.sun
        state: "above_horizon"
      # Before 6pm: this is because we turn the foyer nightlight on
      # at 6pm and don't want to turn it off even if the weather improves
      - condition: time
        before: "18:00:00"
      # If either the ceiling lights or chandelier are off
      - condition: or
        conditions:
          # - condition: state
          #   entity_id: light.foyer_ceiling_lights
          #   state: "off"
          - condition: state
            entity_id: light.foyer_chandelier
            state: "on"
    actions:
      - action: light.turn_off
        entity_id: light.foyer_chandelier

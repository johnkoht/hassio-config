automation:
  - id: "foyer_lights_to_off"
    initial_state: on
    alias: "Foyer lights to off"
    triggers:
      # If foyer is turned to off
      - trigger: state
        entity_id: input_select.foyer
        to: "Off"
      # Or foyer is turned to away
      - trigger: state
        entity_id: input_select.foyer
        to: "Away"
    conditions:
      # Lighting automations are enabled
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      # Foyer is Off or Away
      - condition: or
        conditions:
          - condition: state
            entity_id: input_select.foyer
            state: "Off"
          - condition: state
            entity_id: input_select.foyer
            state: "Away"
      # Lights are ON
      - condition: state
        entity_id: light.foyer_lights
        state: "on"
    actions:
      - action: light.turn_off
        entity_id: light.foyer_lights
        data:
          transition: 1

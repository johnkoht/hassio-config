# Foyer Entertainment Mode On
#
# Entertainment mode turns on: pause Adaptive Lighting.
# The room's other automations that would undo this check the mode themselves.
#

automation:
  - id: "foyer_entertainment_mode_on"
    initial_state: on
    alias: "Foyer - Entertainment Mode On"
    triggers:
      # Entertainment mode turns on
      - trigger: state
        entity_id: input_boolean.entertainment_mode
        from: "off"
        to: "on"
    conditions:
      # House is occupied
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
    actions:
      # Pause Adaptive Lighting
      - action: switch.turn_off
        target:
          entity_id: switch.adaptive_lighting_foyer
      # Turn the lights on at full brightness, whatever the daylight
      - action: light.turn_on
        target:
          entity_id: light.foyer_lights
        data:
          brightness_pct: 100

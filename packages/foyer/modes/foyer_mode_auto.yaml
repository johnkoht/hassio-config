# Foyer Mode AUto
#
automation:
  - id: "foyer_mode_auto"
    initial_state: on
    alias: "Foyer mode auto"
    triggers:
      # House turn to Auto mode
      - trigger: state
        entity_id: input_select.house
        to: "Auto"
    conditions:
      # House is occupied
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
      # Foyer is not already Auto
      - condition: template
        value_template: "{{ not is_state('input_select.foyer','Auto') }}"
      # It's not bedtime mode
      - condition: state
        entity_id: input_boolean.bedtime
        state: "off"
    actions:
      # Turn the foyer to dime.
      - action: input_select.select_option
        data:
          entity_id: input_select.foyer
          option: "Auto"

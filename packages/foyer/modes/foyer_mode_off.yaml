automation:
  - id: "foyer_mode_off"
    initial_state: on
    alias: "Foyer mode off"
    triggers:
      - trigger: state
        entity_id: input_select.house
        to: "Bedtime"
      # Bedtime is turned on
      - trigger: state
        entity_id: input_boolean.bedtime
        to: "on"
    conditions:
      # Foyer isn't already set to off
      - condition: template
        value_template: "{{ not is_state('input_select.foyer','Off') }}"
    actions:
      # Turn the foyer to off.
      - action: input_select.select_option
        data:
          entity_id: input_select.foyer
          option: "Off"
      # Mark the Foyer as unoccupied
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.foyer_occupied

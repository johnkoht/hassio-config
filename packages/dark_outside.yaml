input_boolean:
  dark_outside:
    name: Dark Outside
    icon: mdi:weather-night
    initial: off

automation:
  # Turn ON dark outside boolean
  - id: "turn_on_dark_outside"
    alias: "Turn on Dark Outside"
    mode: "single"
    triggers:
      # Sun has set
      - trigger: sun
        event: sunset
      # 10 minutes after sunset
      - trigger: sun
        event: sunset
        offset: "00:10:00"
      # Sun elevation below 4
      - trigger: numeric_state
        entity_id: sun.sun
        attribute: elevation
        below: 4.0
      # It's getting dark outside
      - trigger: numeric_state
        entity_id: sensor.tempest_illuminance
        below: 15
      # Hassio reloads/starts
      - trigger: event
        event_type: automation_reloaded
      - trigger: homeassistant
        event: start
    conditions:
      # The input boolean is OFF
      - condition: state
        entity_id: input_boolean.dark_outside
        state: "off"
      # Sun is low
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        below: 4.0
      # Lux is low in the yard
      - condition: numeric_state
        entity_id: sensor.tempest_illuminance
        below: 20
    actions:
      - action: input_boolean.turn_on
        entity_id: input_boolean.dark_outside

  # Turn OFF dark outside boolean
  - id: "turn_off_dark_outside"
    alias: "Turn off Dark Outside"
    mode: "single"
    triggers:
      # Sun is up
      - trigger: sun
        event: sunrise
      # 10 before after sunset
      - trigger: sun
        event: sunrise
        offset: "-00:10:00"
      # Sun elevation above 4
      - trigger: numeric_state
        entity_id: sun.sun
        attribute: elevation
        above: -4.0
      # It's getting light outside
      - trigger: numeric_state
        entity_id: sensor.tempest_illuminance
        above: 15
      # Hassio reloads/starts
      - trigger: event
        event_type: automation_reloaded
      - trigger: homeassistant
        event: start
    conditions:
      # The input boolean is ON
      - condition: state
        entity_id: input_boolean.dark_outside
        state: "on"
      # Sund is above -4
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        above: -4.0
      # Lux is not low in the yard
      - condition: numeric_state
        entity_id: sensor.tempest_illuminance
        above: 15
    actions:
      - action: input_boolean.turn_off
        entity_id: input_boolean.dark_outside

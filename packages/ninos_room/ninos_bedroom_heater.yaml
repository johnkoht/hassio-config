automation:
  # Nino's bedroom heater on
  #
  - id: "nino_bedroom_heater_on"
    alias: "Nino bedroom heater on"
    initial_state: on
    triggers:
      # Nino's room is occupied (e.g. door is closed)
      - trigger: state
        entity_id: input_boolean.ninos_bedroom_occupied
        to: "on"
        for:
          minutes: 1
      # Temperature is below 70 degrees
      - trigger: numeric_state
        entity_id: sensor.nino_room_temperature
        below: 70
        for:
          minutes: 5
      # Less than 69.5 for redundancy
      - trigger: template
        value_template: >
          {{ is_number(states('sensor.nino_room_temperature'))
             and states('sensor.nino_room_temperature') | float < 69.5 }}
      # Temperature is below 69 degrees
      - trigger: numeric_state
        entity_id: sensor.nino_room_temperature
        below: 69
        for:
          minutes: 5
      # After 6:30 pm
      - trigger: time
        at: "18:30:00"
    conditions:
      # The house is occupied
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
      - condition: or
        conditions:
          # Room is occupied
          - condition: state
            entity_id: input_boolean.ninos_bedroom_occupied
            state: "on"
          - condition: time
            after: "18:30:00"
      # Less than 71.3 degrees
      - condition: template
        value_template: >
          {{ is_number(states('sensor.nino_room_temperature'))
             and states('sensor.nino_room_temperature') | float < 71.3 }}
    actions:
      # Switch the power plug on
      - action: switch.turn_on
        entity_id: switch.smart_plug_2_switch

  - id: "nino_bedroom_heater_off"
    alias: "Nino bedroom heater off"
    initial_state: on
    triggers:
      # Nino's door is open for 10 minutes
      - trigger: state
        entity_id: binary_sensor.ninos_door_sensor_status
        to: "on"
        for:
          minutes: 10
      # Temperature is above 70.5
      - trigger: template
        value_template: >
          {{ is_number(states('sensor.nino_room_temperature'))
             and states('sensor.nino_room_temperature') | float > 70.15 }}
      # Temperature is above 71 degrees
      - trigger: numeric_state
        entity_id: sensor.nino_room_temperature
        above: 71
      # Temperature is above 72 degrees
      - trigger: numeric_state
        entity_id: sensor.nino_room_temperature
        above: 72
      # Temperature is above 72.5
      - trigger: template
        value_template: >
          {{ is_number(states('sensor.nino_room_temperature'))
             and states('sensor.nino_room_temperature') | float > 72.5 }}
      # Temperature is above 73 degrees
      - trigger: numeric_state
        entity_id: sensor.nino_room_temperature
        above: 73
      # Temperature is above 74 degrees
      - trigger: numeric_state
        entity_id: sensor.nino_room_temperature
        above: 74
      # Temperature is above 75 degrees
      - trigger: numeric_state
        entity_id: sensor.nino_room_temperature
        above: 75
      # If the house is not occupied
      - trigger: state
        entity_id: input_boolean.house_occupied
        to: "off"
      # Room is no longer occupied
      - trigger: state
        entity_id: input_boolean.ninos_bedroom_occupied
        to: "off"
    conditions:
      - condition: or
        conditions:
          - condition: template
            value_template: >
              {{ is_number(states('sensor.nino_room_temperature'))
                 and states('sensor.nino_room_temperature') | float >= 72.0 }}
          # OR house is not occupied
          - condition: state
            entity_id: input_boolean.house_occupied
            state: "off"
          # OR the room is not occupied
          - condition: state
            entity_id: input_boolean.ninos_bedroom_occupied
            state: "off"
      # Plug is currently on
      - condition: state
        entity_id: switch.smart_plug_2_switch
        state: "on"
    actions:
      # Switch the power plug of
      - action: switch.turn_off
        entity_id: switch.smart_plug_2_switch

  # Either parent arriving after 18:30 turns the heater on, even if the
  # house is already occupied.
  - id: "ninos_bedroom_heater_turn_on_upon_arrival"
    alias: "Nino Bedroom Heater - Turn On Upon Arrival"
    initial_state: on
    triggers:
      - trigger: state
        id: john_arrived
        entity_id: input_select.john_status
        to: "Just Arrived"
      - trigger: state
        id: cristina_arrived
        entity_id: input_select.cristina_status_dropdown
        to: "Just Arrived"
      - trigger: state
        id: house_occupied
        entity_id: input_boolean.house_occupied
        to: "on"
    conditions:
      - alias: "A parent just arrived, or the house just became occupied"
        condition: or
        conditions:
          - condition: trigger
            id:
              - john_arrived
              - cristina_arrived
          - condition: template
            value_template: >
              {{ (now() - states.input_boolean.house_occupied.last_changed).total_seconds() < 300 }}
      - alias: "Not that warm in his room (false if unavailable)"
        condition: numeric_state
        entity_id: sensor.nino_room_temperature
        below: 71.5
      - condition: time
        after: "18:30:00"
      - condition: state
        entity_id: switch.smart_plug_2_switch
        state: "off"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.smart_plug_2_switch

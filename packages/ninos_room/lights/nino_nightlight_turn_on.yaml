# Nino's nightlight
#
automation:
  - id: "nino_nightlight_turn_on"
    initial_state: on
    alias: "Nino Nightlight - Turn On"
    triggers:
      # Room is occupied for an hour
      - trigger: state
        entity_id: input_boolean.ninos_bedroom_occupied
        to: "on"
        for:
          hours: 1
      # At 10pm
      - trigger: time
        at: "22:00:00"
    conditions:
      # House is occupied
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
      # Nino's lamp is currently ON
      - condition: state
        entity_id: light.nino_bedroom_lamp
        state: "on"
      # After 7pm
      - condition: time
        after: "19:00:00"
    actions:
      - action: scene.turn_on
        target:
          entity_id: scene.ninos_room_nino_nightlight

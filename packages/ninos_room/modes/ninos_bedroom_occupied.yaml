automation:
  - id: "ninos_bedroom_occupied"
    initial_state: on
    alias: "Nino's Bedroom - Occupied"
    triggers:
      # Nino's door is closed
      - trigger: state
        entity_id: binary_sensor.ninos_door_sensor_status
        to: "off"
      # Lights turned ON
      - trigger: state
        entity_id: light.ninos_bedroom_main_lights
        to: "on"
      # Bed occupied
      - trigger: state
        entity_id: binary_sensor.nino_bed_occupied
        to: "on"
    conditions:
      # Not currently occupied
      - condition: state
        entity_id: input_boolean.ninos_bedroom_occupied
        state: "off"
      - condition: or
        conditions:
          # Nino's door is closed
          - condition: state
            entity_id: binary_sensor.ninos_door_sensor_status
            state: "off"
          # Lights are ON
          - condition: state
            entity_id: light.ninos_bedroom_main_lights
            state: "on"
          # Bed occupied
          - condition: state
            entity_id: binary_sensor.nino_bed_occupied
            state: "on"
    actions:
      - action: input_boolean.turn_on
        entity_id: input_boolean.ninos_bedroom_occupied

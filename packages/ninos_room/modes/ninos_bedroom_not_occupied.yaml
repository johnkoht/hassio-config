# Nino's Bedroom - Not Occupied
#
# Clear occupancy once the lights and bed are off. An empty house clears
# it outright (bed permitting) so Mode Auto can resume on return.
#

automation:
  - id: "ninos_bedroom_not_occupied"
    initial_state: on
    alias: "Nino's Bedroom - Not Occupied"
    triggers:
      # Nino's door is open for 5 minutes
      - trigger: state
        entity_id: binary_sensor.ninos_door_sensor_status
        to: "on"
        for:
          minutes: 5
      # Lights turned OFF
      - trigger: state
        entity_id: light.ninos_bedroom_main_lights
        to: "off"
        for:
          minutes: 5
      # Bed occupied
      - trigger: state
        entity_id: binary_sensor.nino_bed_occupied
        to: "off"
        for:
          minutes: 5
      # House is empty
      - trigger: state
        entity_id: input_boolean.house_occupied
        to: "off"
        for:
          minutes: 2
    conditions:
      # Currently occupied
      - condition: state
        entity_id: input_boolean.ninos_bedroom_occupied
        state: "on"
      # Bed NOT occupied
      - condition: state
        entity_id: binary_sensor.nino_bed_occupied
        state: "off"
      - condition: or
        conditions:
          - alias: "House is empty"
            condition: state
            entity_id: input_boolean.house_occupied
            state: "off"
          - alias: "Lights are off"
            condition: state
            entity_id: light.ninos_bedroom_main_lights
            state: "off"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ninos_bedroom_occupied

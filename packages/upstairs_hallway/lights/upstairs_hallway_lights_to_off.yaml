# Upstairs Hallway Lights to Off
#
# Room Off always turns the lights off. Vacancy only does so while the hand flag is on.
#

automation:
  - id: "upstairs_hallway_lights_to_off"
    initial_state: on
    alias: "Upstairs Hallway Lights to Off"
    triggers:
      # If the upstairs hallway turns to Off mode
      - trigger: state
        entity_id: input_select.upstairs_hallway
        to: "Off"
        id: "room_off"
      # Lighting automations turn on
      - trigger: state
        entity_id: input_boolean.lighting_automations
        to: "on"
        id: "house_flag_on"
      # Hallway is not occupied
      - trigger: state
        entity_id: input_boolean.upstairs_hallway_occupied
        to: "off"
        id: "vacancy"
    conditions:
      # Lighting automations enabled
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      # Lights are currently on
      - condition: state
        entity_id: light.upstairs_hallway
        state: "on"
      - condition: or
        conditions:
          # Room Off always wins
          - condition: trigger
            id: "room_off"
          - condition: state
            entity_id: input_boolean.upstairs_hallway_lighting_automations
            state: "on"
    actions:
      - action: light.turn_off
        target:
          entity_id: light.upstairs_hallway
      # Lights are no longer auto-on
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.upstairs_hallway_lights_auto

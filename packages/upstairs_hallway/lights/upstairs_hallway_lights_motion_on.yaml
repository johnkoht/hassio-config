automation:
  - id: "upstairs_hallway_lights_motion_on"
    initial_state: on
    alias: "Upstairs Hallway Lights - Motion On"
    triggers:
      # Motion detected
      - trigger: state
        entity_id: binary_sensor.upstairs_hallway_motion
        to: "on"
    conditions:
      # Lighting automations must be enabled
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      # And lighting automations for the hallway are enabled
      - condition: state
        entity_id: input_boolean.upstairs_hallway_lighting_automations
        state: "on"
      # Nobody has taken the lights by hand
      - condition: state
        entity_id: input_boolean.upstairs_hallway_lights_manually_toggled
        state: "off"
      # Light is low
      - condition: numeric_state
        entity_id: sensor.upstairs_hallway_nightlight_illuminance
        below: 30
      # Lights are currently off
      - condition: state
        entity_id: light.upstairs_hallway
        state: "off"
      # Quiet mode is NOT enabled
      - condition: state
        entity_id: input_boolean.quiet_mode
        state: "off"
    actions:
      - if:
          # If either of the kids rooms are occupied
          # then don't turn them up 100%
          - condition: or
            conditions:
              - condition: state
                entity_id: input_boolean.gianlucas_room_occupied
                state: "on"
              - condition: state
                entity_id: input_boolean.ninos_bedroom_occupied
                state: "on"
              # Quiet mode was recently changed
              - condition: template
                value_template: "{{ (as_timestamp(now()) - as_timestamp(states.input_boolean.quiet_mode.last_changed)) | int < 180 }}"
        then:
          # Turn them on 10%
          - action: light.turn_on
            entity_id: light.upstairs_hallway
            data:
              brightness_pct: 10
              transition: 0.5

        else:
          # Turn the lights on normal
          - action: light.turn_on
            entity_id: light.upstairs_hallway

      # Toggle the boolean to flag it was auto
      - action: input_boolean.turn_on
        entity_id: input_boolean.upstairs_hallway_lights_auto

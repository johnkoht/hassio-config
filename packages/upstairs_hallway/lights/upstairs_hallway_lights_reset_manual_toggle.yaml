# Upstairs Hallway Lights Reset Manual Toggle
#
# Clears the manual latch when the room empties or goes Off, or the house empties.
#

automation:
  - id: "upstairs_hallway_lights_reset_manual_toggle"
    alias: "Upstairs Hallway Lights - Reset Manual Toggle"
    triggers:
      - trigger: state
        entity_id: input_boolean.upstairs_hallway_occupied
        to: "off"
        for:
          seconds: 30
      - trigger: state
        entity_id: input_select.upstairs_hallway
        to: "Off"
      - trigger: state
        entity_id: input_boolean.house_occupied
        to: "off"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.upstairs_hallway_lights_manually_toggled

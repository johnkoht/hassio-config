# Network Status
#
# Health of the radios and meshes the key sensors report through: Zigbee, Z-Wave, Hue, BLE.
# Mesh sensors are counts with a `total` attribute; `summary` is the dashboard row label.
# Zigbee routers are every device labelled `zigbee_router`, scanned every 5 minutes.
#

template:
  - binary_sensor:
      # ZHA has no coordinator entity; read the config entry state (same entry as zigbee_coordinator_offline).
      # now() re-renders each minute, since config entry changes fire no state event.
      - name: Zigbee Coordinator Online
        unique_id: zigbee_coordinator_online
        default_entity_id: binary_sensor.zigbee_coordinator_online
        device_class: connectivity
        state: >-
          {% set s = config_entry_attr('aca4c70dc280edb389f2148461676c66', 'state') %}
          {{ now() is not none and s is not none and s == 'loaded' }}
        attributes:
          summary: UZG-01

      - name: Z-Wave Controller Online
        unique_id: zwave_controller_online
        default_entity_id: binary_sensor.zwave_controller_online
        device_class: connectivity
        state: "{{ is_state('sensor.home_assistant_connect_zwa_2_status', 'ready') }}"
        attributes:
          summary: "{{ states('sensor.home_assistant_connect_zwa_2_status') | replace('_', ' ') | capitalize }}"

  - sensor:
      # No Hue config entry check: when the bridge drops, every spot goes unavailable, so the count covers it.
      - name: Hue Spots Online
        unique_id: hue_spots_online
        default_entity_id: sensor.hue_spots_online
        icon: mdi:spotlight-beam
        state: >-
          {{ expand('group.key_sensors_hue_spots')
             | rejectattr('state', 'in', ['unavailable', 'unknown']) | list | count }}
        attributes:
          total: "{{ state_attr('group.key_sensors_hue_spots', 'entity_id') | default([], true) | count }}"
          summary: >-
            {% set all = expand('group.key_sensors_hue_spots') %}
            {{ all | rejectattr('state', 'in', ['unavailable', 'unknown']) | list | count }} of {{ all | count }} online

      - name: BLE Proxies Online
        unique_id: ble_proxies_online
        default_entity_id: sensor.ble_proxies_online
        icon: mdi:bluetooth
        state: "{{ states('sensor.bermuda_global_active_proxy_count') }}"
        availability: "{{ states('sensor.bermuda_global_active_proxy_count') | is_number }}"
        attributes:
          total: "{{ states('sensor.bermuda_global_total_proxy_count') | int(0) }}"
          summary: >-
            {{ states('sensor.bermuda_global_active_proxy_count') | int(0) }} of
            {{ states('sensor.bermuda_global_total_proxy_count') | int(0) }} active

  # One pass every 5 minutes over label_devices('zigbee_router'): each device's primary entity
  # (first enabled switch/light/fan/sensor that isn't a config or diagnostic one, else its LQI
  # sensor, else number/select/update) and an "<Area> <Device>" name for the routers popup.
  - triggers:
      - trigger: time_pattern
        minutes: /5
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    actions:
      - variables:
          scan: >-
            {% set skip = '_(lqi|rssi|identify|firmware|disable_led|child_lock|led_mode|bulb_mode|local_protection|invert_switch|progress_led|tap_up_enabled|tap_down_enabled|on_off_mode|clear_notifications|sync_level|switch_scenes)(_[0-9]+)?$' %}
            {% set lqi = '_lqi(_[0-9]+)?$' %}
            {% set ns = namespace(rows=[], offline=[]) %}
            {% for d in label_devices('zigbee_router') %}
              {% set ents = device_entities(d) %}
              {% set p = namespace(e=none) %}
              {% for pattern in ['^switch[.]', '^light[.]', '^fan[.]', '^sensor[.]', lqi, '^number[.]', '^select[.]', '^update[.]'] %}
                {% for e in ents %}
                  {% if p.e is none and e is search(pattern) and (pattern == lqi or e is not search(skip))
                        and expand(e) | count > 0 %}
                    {% set p.e = e %}
                  {% endif %}
                {% endfor %}
              {% endfor %}
              {# area_name(device_id) raises on a device whose area was deleted, so resolve the area_id #}
              {% set device = device_attr(d, 'name_by_user') or device_attr(d, 'name') or d %}
              {% set area_id = device_attr(d, 'area_id') %}
              {% set area = (area_name(area_id) if area_id else none) or '' %}
              {% set dn = device | lower | regex_replace('[^a-z0-9]', '') %}
              {% set an = area | lower | regex_replace('[^a-z0-9]', '') %}
              {% set first = area.split(' ')[0] | lower | regex_replace("['’]s$", '') | regex_replace('[^a-z0-9]', '') %}
              {% set name = device if not area or an in dn or (first | length >= 4 and dn.startswith(first))
                            else area ~ ' ' ~ device %}
              {# only unavailable: an LQI-only router (range extender) reads unknown until ZHA pushes a value #}
              {% if p.e is none or states(p.e) == 'unavailable' %}
                {% set ns.offline = ns.offline + [name] %}
              {% endif %}
              {% if p.e is not none %}
                {% set ns.rows = ns.rows + [(p.e, name)] %}
              {% endif %}
            {% endfor %}
            {{ {'routers': dict(ns.rows), 'offline': ns.offline | sort,
                'total': label_devices('zigbee_router') | count} }}
    sensor:
      - name: Zigbee Routers Online
        unique_id: zigbee_routers_online
        default_entity_id: sensor.zigbee_routers_online
        icon: mdi:power-socket-us
        state: "{{ scan.total - scan.offline | count }}"
        attributes:
          total: "{{ scan.total }}"
          summary: "{{ scan.total - scan.offline | count }} of {{ scan.total }} online"
          offline: "{{ scan.offline }}"
          # {primary entity_id: "<Area> <Device>"}; the routers popup lists these.
          routers: "{{ scan.routers }}"

# Zigbee Coordinator Offline
#
# Push when the ZHA integration (UZG-01 coordinator) has not been loaded for 3 minutes.
# ZHA exposes no coordinator entity, so this reads the config entry state; now() re-checks it each minute.
#

automation:
  - id: "zigbee_coordinator_offline"
    alias: "Zigbee - Coordinator Offline"
    mode: single
    triggers:
      - trigger: template
        value_template: >
          {{ now() is not none and
             config_entry_attr('aca4c70dc280edb389f2148461676c66', 'state').value != 'loaded' }}
        for:
          minutes: 3
    actions:
      - action: script.general_notification
        data:
          title: "Zigbee Offline"
          message: "The Zigbee coordinator is offline. Power-cycle the UZG (192.168.1.91), then reload ZHA."
          devices: "jk"
          priority: "time-sensitive"
          tag: "zigbee-coordinator-offline"

# Zigbee Router Unavailable
#
# Push when a zigbee_router-labelled device has been unavailable for 15 minutes.
# Routers come from sensor.zigbee_routers_online (label-driven); no entity list here.
#

automation:
  - id: "zigbee_router_unavailable"
    initial_state: on
    alias: "Zigbee Router Unavailable"
    # queued, one push per router, so routers dropping together all push
    mode: queued
    max: 64
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    # Rendered at trigger time, so the run only fires when a router is due.
    # The automation's own last_changed is when it was loaded (HA start or reload).
    # A router already down then restarts its clock at boot, so only routers that went
    # down 5+ minutes after load count; the rest are skipped, not re-pushed per restart.
    # (`this` is a dict with string timestamps, so read the live state object.)
    variables:
      due: >-
        {% set routers = state_attr('sensor.zigbee_routers_online', 'routers') or {} %}
        {% set loaded = states[this.entity_id].last_changed + timedelta(minutes=5) %}
        {% set ns = namespace(due=[]) %}
        {% for e in routers %}
          {% set s = states[e] %}
          {% if s is not none and s.state == 'unavailable' and s.last_changed > loaded %}
            {% set age = (now() - s.last_changed).total_seconds() %}
            {% if 900 <= age < 960 %}
              {% set ns.due = ns.due + [e] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.due }}
    conditions:
      - alias: "Coordinator is up (zigbee_coordinator_offline covers a whole-radio outage)"
        condition: template
        value_template: "{{ config_entry_attr('aca4c70dc280edb389f2148461676c66', 'state') == 'loaded' }}"
      - alias: "A router crossed 15 minutes unavailable this minute"
        condition: template
        value_template: "{{ due | count > 0 }}"
    actions:
      - repeat:
          for_each: "{{ due }}"
          sequence:
            - action: script.general_notification
              data:
                title: "Zigbee System Issue"
                message: >-
                  {{ (state_attr('sensor.zigbee_routers_online', 'routers') or {}).get(repeat.item, repeat.item) }} has been offline for 15 minutes.
                devices: "jk"
                priority: "passive"
                important: true
                tag: "zigbee-router-{{ repeat.item }}"
                url: /dashboard-kohbo/sensors#zigbee_routers_popup

# UPS Battery Power Activated
#
# Critical push when the UPS switches to battery (raw NUT code OB, e.g. "OB DISCHRG").
#

automation:
  - id: "ups_battery_power_activated"
    alias: "UPS - Battery Power Activated"
    mode: single
    triggers:
      - trigger: template
        value_template: "{{ 'OB' in states('sensor.apc_ups_status_data').split() }}"
    actions:
      - action: script.general_notification
        data:
          title: "Power Outage!"
          message: "🚨 Power outage! UPS is now on battery."
          devices: "jk"
          priority: "critical"
          tag: "ups-power-outage"

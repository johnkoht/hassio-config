# UPS Offline
#
# Push when HA loses contact with the UPS, since power-outage alerts can't fire.
#

automation:
  - id: "ups_offline"
    alias: "UPS - Offline"
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.apc_ups_status
        to: "unavailable"
        for:
          minutes: 3
    actions:
      - action: script.general_notification
        data:
          title: "UPS Offline"
          message: "HA lost contact with the UPS, so power-outage alerts won't fire. Check the NUT connection."
          devices: "jk"
          priority: "time-sensitive"
          tag: "ups-offline"

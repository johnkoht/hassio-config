# Garage Door Remote Lock Automation
#
# For additional security, we lock the garage door remotes
# so that nobody can open the garage door from the outside.
#
automation:
  #
  # Lock the garage door remotes
  #
  - id: "garage_doors_lock_remotes"
    alias: "Garage Doors - Lock Remotes"
    initial_state: on
    triggers:
      # When bedtime is active for 15 minutes
      - trigger: state
        entity_id: input_boolean.bedtime
        to: "on"
        for:
          minutes: 5
      # Hassio restart/relaod
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    conditions:
      # Make sure it's bedtime in case
      # restart is the trigger
      - condition: state
        entity_id: input_boolean.bedtime
        state: "on"
    actions:
      # Lock the garage remotes
      - action: lock.lock
        entity_id:
          - lock.garage_door_1_lock_remotes
          - lock.garage_door_2_lock_remotes
          - lock.garage_door_3_lock_remotes

  #
  # Unlock the garage door remotes
  #
  - id: "garage_doors_unlock_remotes"
    alias: "Garage Doors - Unlock Remotes"
    initial_state: on
    triggers:
      # When bedtime mode is disabled
      - trigger: state
        entity_id: input_boolean.bedtime
        to: "off"
        for:
          minutes: 5
      # Somebody arrives at the house
      - trigger: state
        entity_id:
          - person.john_koht
          - person.cristina_falbo
          - person.celi
        to: "home"
      # Parents, Katia, Nonna and Joe: hold so iPhone detect can confirm (a UniFi
      # blip alone must not unlock the remotes)
      - trigger: state
        entity_id:
          - person.antoun_koht
          - person.sonia_koht
          - person.katia
          - person.mary_falbo
          - person.joe_falbo
        to: "home"
        for:
          minutes: 1
      # Hassio restart/relaod
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    conditions:
      # Only unlock if any of the remotes are locked
      - condition: state
        entity_id:
          - lock.garage_door_1_lock_remotes
          - lock.garage_door_2_lock_remotes
          - lock.garage_door_3_lock_remotes
        match: any
        state: "locked"
      # A parent's, Katia's, Nonna's or Joe's arrival needs their iPhone detect to agree
      - condition: template
        value_template: >-
          {% set detect = {
            'person.antoun_koht': 'device_tracker.antoun_iphone_detect',
            'person.sonia_koht': 'device_tracker.sonia_iphone_detect',
            'person.katia': 'device_tracker.katia_iphone_detect',
            'person.mary_falbo': 'device_tracker.mary_iphone_detect',
            'person.joe_falbo': 'device_tracker.joe_iphone_detect'} %}
          {% set who = trigger.entity_id | default('', true) %}
          {{ who not in detect or is_state(detect[who], 'home') }}
    actions:
      # Unlock the garage remotes
      - action: lock.unlock
        entity_id:
          - lock.garage_door_1_lock_remotes
          - lock.garage_door_2_lock_remotes
          - lock.garage_door_3_lock_remotes

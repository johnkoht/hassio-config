# Garage Lights Off
#
# Room Off or Away always turns the lights off. Vacancy only does so while the hand flag is on.
#
automation:
  - id: "garage_lights_off"
    initial_state: on
    alias: "Garage lights off"
    triggers:
      # Garage is Off
      - trigger: state
        entity_id: input_select.garage
        to: "Off"
        id: "room_off"
      # Garage is Away (same as Off)
      - trigger: state
        entity_id: input_select.garage
        to: "Away"
        id: "room_off"
      # Garage is not occupied
      - trigger: state
        entity_id: input_boolean.garage_occupied
        to: "off"
        id: "vacancy"
      # Lighting automations turn on
      - trigger: state
        entity_id: input_boolean.lighting_automations
        to: "on"
        id: "house_flag_on"
    conditions:
      # Lighting automations enabled
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      - condition: or
        conditions:
          # Room Off or Away always wins
          - condition: trigger
            id: "room_off"
          - condition: and
            conditions:
              - condition: state
                entity_id: input_boolean.garage_lighting_automations
                state: "on"
              - condition: state
                entity_id: input_boolean.garage_occupied
                state: "off"
    actions:
      - action: light.turn_off
        target:
          entity_id: light.garage_lights

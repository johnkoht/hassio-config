# Garage Lights Off
#
automation:
  - id: "garage_lights_off"
    initial_state: on
    alias: "Garage lights off"
    triggers:
      # Garage is Off
      - trigger: state
        entity_id: input_select.garage
        to: "Off"
      # Garage is Away
      - trigger: state
        entity_id: input_select.garage
        to: "Away"
      # Garage is not occupied
      - trigger: state
        entity_id: input_boolean.garage_occupied
        to: "off"
      # Lighting automations turn on
      - trigger: state
        entity_id: input_boolean.lighting_automations
        to: "on"
    conditions:
      # Garage is not occupied
      - condition: state
        entity_id: input_boolean.garage_occupied
        state: "off"
      # Garage is Off or not occupied
      - condition: or
        conditions:
          # Garage is Off
          - condition: state
            entity_id: input_select.garage
            state: "Off"
          # Garage is Away
          - condition: state
            entity_id: input_select.garage
            state: "Away"
          # Garage is not occupied
          - condition: state
            entity_id: input_boolean.garage_occupied
            state: "off"
    actions:
      - action: light.turn_off
        entity_id: light.garage_lights

# Pool Mode Auto
#
automation:
  - id: "pool_mode_auto"
    initial_state: on
    alias: "Pool Mode Auto"
    triggers:
      # House turn to Auto mode
      - trigger: state
        entity_id: input_select.house
        to: "Auto"
      # House becomes occupied
      - trigger: state
        entity_id: input_boolean.house_occupied
        to: "on"
    conditions:
      # House is occupied
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
      # Pool is not already Auto
      - condition: template
        value_template: "{{ not is_state('input_select.pool','Auto') }}"
      # It's not bedtime mode
      - condition: state
        entity_id: input_boolean.bedtime
        state: "off"
      # House is in Auto mode
      - condition: state
        entity_id: input_select.house
        state: "Auto"
    actions:
      - action: input_select.select_option
        data:
          entity_id: input_select.pool
          option: "Auto"

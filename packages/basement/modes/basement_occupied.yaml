# Basement Occupied
#
automation:
  - id: "basement_occupied"
    initial_state: on
    alias: "Basement occupied"
    triggers:
      # Motion detected
      - trigger: state
        entity_id: binary_sensor.basement_motion_sensor
        to: "on"
      # Occupancy detected
      - trigger: state
        entity_id: binary_sensor.basement_occupancy_sensor
        to: "on"
    conditions:
      # House is occupied
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
      # Basement is not occupied
      - condition: state
        entity_id: input_boolean.basement_occupied
        state: "off"
      # Either Bluetooth detects people or occupancy detected
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ expand('group.room_presence_devices')|selectattr('state', 'in', ['basement_main', 'basement_hub'])|map(attribute='name')|list | length > 0 }}"
          - condition: state
            entity_id: binary_sensor.basement_occupancy_sensor
            state: "on"
    actions:
      - action: input_boolean.turn_on
        entity_id: input_boolean.basement_occupied

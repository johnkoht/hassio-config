template:
  - binary_sensor:
      - name: "Kids Activity Tomorrow"
        unique_id: kids_activity_tomorrow
        default_entity_id: binary_sensor.kids_activity_tomorrow
        state: >-
          {% set t = now() %}
          {% set midnight = today_at() %}
          {% set event = state_attr("calendar.kohbocal", "start_time") | as_datetime | as_local %}
          {% set delta = event - midnight %}
          {{ delta.days == 1 }}

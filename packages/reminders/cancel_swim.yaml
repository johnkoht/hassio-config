script:
  cancel_swim:
    alias: "Cancel Swim"
    mode: "single"
    sequence:
      - action: rest_command.cancel_swim_class
        data:
          phone_number: !secret cancel_swim_phone
          task: !secret cancel_swim_task

rest_command:
  cancel_swim_class:
    url: https://us.api.bland.ai/v1/calls
    method: POST
    content_type: "application/json; charset=utf-8"
    headers:
      authorization: !secret bland_api_key
      accept: "application/json"
    payload: >-
      {"phone_number": {{ phone_number | string | to_json }}, "task": {{ task | to_json }}}

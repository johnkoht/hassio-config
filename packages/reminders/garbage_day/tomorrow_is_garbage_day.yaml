template:
  - binary_sensor:
      - name: "Tomorrow is Garbage Day"
        unique_id: tomorrow_is_garbage_day
        default_entity_id: binary_sensor.tomorrow_is_garbage_day
        state: >-
          {% set start = state_attr('calendar.house_chores', 'start_time') %}
          {% set msg = state_attr('calendar.house_chores', 'message') %}
          {{
            start is string
            and 'garbage' in ((msg or '') | lower)
            and start[:10] == (now().date() + timedelta(days=1)).isoformat()
          }}

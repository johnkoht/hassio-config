automation:
  - id: "garbage_day_off"
    alias: "Garbage Day Off"
    mode: "single"
    triggers:
      # Garbage calendar turned OFF
      - trigger: calendar
        event: end
        entity_id: calendar.house_chores
    conditions:
      # Only garbage events (not other chores)
      - condition: template
        value_template: "{{ 'garbage' in (trigger.calendar_event.summary | default('', true) | lower) }}"
      # Garbage day boolean is current ON
      - condition: state
        entity_id: input_boolean.garbage_day
        state: "on"
    actions:
      # Turn OFF the boolean
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.garbage_day

      # Turn the automation reminder off
      - action: automation.turn_off
        target:
          entity_id: automation.garbage_day_is_today_reminder

automation:
  - id: "garbage_day_on"
    alias: "Garbage Day On"
    mode: "single"
    triggers:
      # Garbage calendar turned ON
      - trigger: calendar
        event: start
        entity_id: calendar.house_chores
    conditions:
      # Only garbage events (not other chores)
      - condition: template
        value_template: "{{ 'garbage' in (trigger.calendar_event.summary | default('', true) | lower) }}"
      # Garbage day boolean is current OFF
      - condition: state
        entity_id: input_boolean.garbage_day
        state: "off"
    actions:
      # Turn on the boolean
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.garbage_day

      # Turn the automation reminder on
      - action: automation.turn_on
        target:
          entity_id: automation.garbage_day_is_today_reminder

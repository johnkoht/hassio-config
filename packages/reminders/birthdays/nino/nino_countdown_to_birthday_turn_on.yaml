# Nino Countdown to Birthday - Turn On
#
# Turn the countdown boolean on once we're inside the 15 day window.
# Driven directly off sensor.nino_days_to_birthday, plus a re-check
# on start/reload so it self-corrects instead of relying on a one-shot.
#
# initial_state is required: this automation used to disable itself as
# part of the old choreography, so without it HA restores that stale
# disabled state and the countdown never starts.
#
automation:
  - id: "nino_countdown_to_birthday_turn_on"
    alias: "Nino Countdown to Birthday - Turn On"
    mode: "single"
    initial_state: on
    triggers:
      # The days sensor re-renders daily, so re-evaluate on every change.
      # A plain state trigger also catches unknown -> value at startup,
      # which a numeric_state crossing would miss.
      - trigger: state
        entity_id: sensor.nino_days_to_birthday
      # Re-evaluate on start / reload
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    conditions:
      - alias: "Inside the 15 day countdown window"
        condition: numeric_state
        entity_id: sensor.nino_days_to_birthday
        below: 16
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.nino_countdown_to_birthday

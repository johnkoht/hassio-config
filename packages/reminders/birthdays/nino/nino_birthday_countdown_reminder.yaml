# Nino Birthday Countdown Reminder
#
# Announce how many days are left until Nino's birthday,
# once per day while the countdown boolean is on.
#
automation:
  - id: "nino_birthday_countdown_reminder"
    alias: "Nino Birthday Countdown Reminder"
    mode: "single"
    triggers:
      # At 7am
      - trigger: time
        at: "07:05:00"
      # At 8:35am
      - trigger: time
        at: "08:35:00"
      # At 6pm
      - trigger: time
        at: "18:05:00"
      - trigger: state
        entity_id: input_select.nino_sleep_state
        to: "Awake"
        for:
          minutes: 15
    conditions:
      # House is occupied
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
      # Countdown is active
      - condition: state
        entity_id: input_boolean.nino_countdown_to_birthday
        state: "on"
      # Not already announced
      - condition: state
        entity_id: input_boolean.nino_countdown_announced
        state: "off"
      # After 7am
      - condition: time
        after: "07:00:00"
      - condition: state
        entity_id: input_select.nino_sleep_state
        state: "Awake"
    actions:
      # Wait for motion in the kitchen, family room or playroom
      - wait_template: >-
          {{
            is_state('binary_sensor.kitchen_motion_sensor_status', 'on')
            or
            is_state('binary_sensor.family_room_motion_sensor', 'on')
            or
            is_state('binary_sensor.playroom_motion', 'on')
          }}
        timeout: "00:05:00"

      - alias: "Wait 2 seconds"
        delay: 2

      # Mark announced so we don't repeat all day
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.nino_countdown_announced

      - choose:
          # IF today's the day then let's announce it!!!
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.nino_days_to_birthday') | int(-1) == 0 }}"
            sequence:
              # Call the announcement engine
              - action: script.voice_announcement
                data:
                  speech_message: "Hey, Nino! Guess what? Today's your birthday! Happy Birthday!!!"
                  media_players: "auto"
                  sound: "success-trumpets"
                  priority: high

          # ELIF 1 more day
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.nino_days_to_birthday') | int(-1) == 1 }}"
            sequence:
              # Call the announcement engine
              - action: script.voice_announcement
                data:
                  speech_message: "Nino! Guess what tomorrow is? Your birthday!!! Are you super excited to celebrate?"
                  media_players: "auto"
                  sound: "games-sfx"
                  priority: high

        # ELSE more than 1 day
        default:
          # Call the announcement engine
          - action: script.voice_announcement
            data:
              speech_message: >-
                {% set days = states('sensor.nino_days_to_birthday') %}
                {{
                  [
                    "Hey Nino! Guess what? There's " ~ days ~ " days until your birthday!",
                    "Nino! I'm so excited! Your birthday is in " ~ days ~ " days! How exciting is that?"
                  ] | random
                }}
              media_players: "auto"
              sound: "games-sfx"
              priority: high

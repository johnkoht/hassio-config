# Gianluca - Days to Birthday
#
# How many days until Gianluca's next birthday?
#
# Calculated from sensor.gianlucas_birthday (sourced from secrets.yaml)
# so this doesn't depend on a calendar entity. Rolls over to next year
# the day after the birthday.
#
template:
  - sensor:
      - name: Gianluca - Days to Birthday
        unique_id: gianluca_days_to_birthday
        default_entity_id: sensor.gianluca_days_to_birthday
        icon: mdi:cake-variant
        unit_of_measurement: days
        availability: >
          {{ states('sensor.gianlucas_birthday') not in
             ['unknown', 'unavailable', 'none', ''] }}
        state: >
          {% set born = strptime(states('sensor.gianlucas_birthday'), '%Y-%m-%d').date() %}
          {% set today = now().date() %}
          {% set this_year = born.replace(year=today.year) %}
          {% if this_year >= today %}
            {{ (this_year - today).days }}
          {% else %}
            {{ (born.replace(year=today.year + 1) - today).days }}
          {% endif %}

# Gianluca Countdown to Birthday - Turn On
#
# Turn the countdown boolean on once we're inside the 15 day window.
# Driven directly off sensor.gianluca_days_to_birthday, plus a re-check
# on start/reload so it self-corrects instead of relying on a one-shot.
#
automation:
  - id: "gianluca_countdown_to_birthday_turn_on"
    alias: "Gianluca Countdown to Birthday - Turn On"
    mode: "single"
    initial_state: on
    triggers:
      # Crossed into the countdown window
      - trigger: numeric_state
        entity_id: sensor.gianluca_days_to_birthday
        below: 16
      # Daily re-evaluation so a missed crossing self-corrects within a day
      - trigger: time
        at: "00:01:00"
      # Re-evaluate on start / reload
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    conditions:
      - alias: "Inside the 15 day countdown window"
        condition: numeric_state
        entity_id: sensor.gianluca_days_to_birthday
        below: 16
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.gianluca_countdown_to_birthday

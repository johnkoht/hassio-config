# Gianluca Countdown to Birthday - Turn Off
#
# Turn the countdown boolean off once the birthday has passed and the
# sensor rolls over to next year (i.e. more than 15 days out).
#
automation:
  - id: "gianluca_countdown_to_birthday_turn_off"
    alias: "Gianluca Countdown to Birthday - Turn Off"
    mode: "single"
    initial_state: on
    triggers:
      # Rolled over past the countdown window
      - trigger: numeric_state
        entity_id: sensor.gianluca_days_to_birthday
        above: 15
      # Daily re-evaluation so a stale boolean self-corrects within a day
      # even if the numeric crossing was missed
      - trigger: time
        at: "00:01:00"
      # Re-evaluate on start / reload
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    conditions:
      - alias: "Outside the 15 day countdown window"
        condition: numeric_state
        entity_id: sensor.gianluca_days_to_birthday
        above: 15
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.gianluca_countdown_to_birthday

      # Reset the announced flag so next year starts clean
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.gianluca_countdown_announced

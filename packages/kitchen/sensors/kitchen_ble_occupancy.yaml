# Kitchen BLE Occupancy
#
# The Kitchen has two BLE base stations. This sensor
# combines them into one to check if anybody is present.
#
template:
  - binary_sensor:
      - name: "Kitchen BLE occupancy"
        unique_id: "kitchen_ble_occupancy"
        default_entity_id: binary_sensor.kitchen_ble_occupancy
        device_class: occupancy
        state: >-
          {{ expand('group.room_presence_devices')|selectattr('state', 'in', ['kitchen'])|map(attribute='name')|list | length > 0 }}

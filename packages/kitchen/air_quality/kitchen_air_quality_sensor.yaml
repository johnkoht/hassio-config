# Kitchen Air Quality
#
# Worst of PM2.5, TVOC and CO2 against the shared thresholds. Steps up at a
# threshold, steps down only below 80% of it (packages/air_quality/README.md).
#
template:
  - sensor:
      - name: "Kitchen Air Quality"
        unique_id: sensor.kitchen_air_quality
        availability: >
          {{ has_value('sensor.kitchen_awair_pm2_5')
             and has_value('sensor.kitchen_awair_vocs')
             and has_value('sensor.kitchen_awair_carbon_dioxide') }}
        state: >
          {% set r = [states('sensor.kitchen_awair_pm2_5') | float(0),
                      states('sensor.kitchen_awair_vocs') | float(0),
                      states('sensor.kitchen_awair_carbon_dioxide') | float(0)] %}
          {% set t = [
            [states('input_number.pm25_moderate') | float(0), states('input_number.tvoc_moderate') | float(0), states('input_number.co2_moderate') | float(0)],
            [states('input_number.pm25_poor') | float(0), states('input_number.tvoc_poor') | float(0), states('input_number.co2_poor') | float(0)],
            [states('input_number.pm25_hazardous') | float(0), states('input_number.tvoc_hazardous') | float(0), states('input_number.co2_hazardous') | float(0)]
          ] %}
          {% set ns = namespace(up=0, hold=0) %}
          {% for band in range(3) %}
            {% for i in range(3) %}
              {% if t[band][i] > 0 and r[i] > t[band][i] %}{% set ns.up = band + 1 %}{% endif %}
              {% if t[band][i] > 0 and r[i] > t[band][i] * 0.8 %}{% set ns.hold = band + 1 %}{% endif %}
            {% endfor %}
          {% endfor %}
          {% set levels = ['Acceptable', 'Moderate', 'Unhealthy', 'Hazardous'] %}
          {% set cur = levels.index(this.state) if this.state in levels else 0 %}
          {{ levels[ns.up] if ns.up >= cur else levels[[cur, ns.hold] | min] }}

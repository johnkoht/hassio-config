# Kitchen Entertainment Mode Off
#
# Entertainment mode turns off (or the house empties): resume Adaptive Lighting and, if the room is in use, its speech notifications.
#

automation:
  - id: "kitchen_entertainment_mode_off"
    initial_state: on
    alias: "Kitchen - Entertainment Mode Off"
    triggers:
      # Entertainment mode turns off
      - trigger: state
        entity_id: input_boolean.entertainment_mode
        from: "on"
        to: "off"
    actions:
      # Resume Adaptive Lighting
      - action: switch.turn_on
        target:
          entity_id: switch.adaptive_lighting_kitchen
      # Same test as kitchen_speech_notifications_on: only when the room is in use
      - if:
          - alias: "Kitchen is occupied"
            condition: state
            entity_id: input_boolean.kitchen_occupied
            state: "on"
          - alias: "Kitchen is in Auto or Dim mode"
            condition: or
            conditions:
              - condition: state
                entity_id: input_select.kitchen
                state: "Auto"
              - condition: state
                entity_id: input_select.kitchen
                state: "Dim"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.kitchen_speech_notifications

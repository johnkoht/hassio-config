# Kitchen Lights Sleep Mode Off
#
automation:
  - id: "kitchen_lights_sleep_mode_off"
    initial_state: off
    alias: "Kitchen Lights Sleep Mode Off"
    triggers:
      # 15 minutes after sunrise
      - trigger: sun
        event: sunrise
        offset: "00:15:00"
      # Or at 7am
      - trigger: time
        at: "07:00:00"
      # Or when someone's up (bedtime mode ends)
      - trigger: state
        entity_id: input_boolean.bedtime
        to: "off"
        id: "bedtime_off"
    conditions:
      # Lighting automations must be enabled
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      - condition: or
        conditions:
          # Bedtime mode ended in the morning
          - condition: and
            conditions:
              - condition: trigger
                id: "bedtime_off"
              - condition: time
                after: "05:00:00"
                before: "12:00:00"
          # OR sun is up / it's after 7am (not for a night-time bedtime off)
          - condition: and
            conditions:
              - condition: not
                conditions:
                  - condition: trigger
                    id: "bedtime_off"
              - condition: or
                conditions:
                  - condition: sun
                    after: sunrise
                  - condition: time
                    after: "07:00:00"
    actions:
      # Turn off sleep mode
      - action: switch.turn_off
        entity_id: switch.adaptive_lighting_sleep_mode_kitchen
      # Turn off this automation
      - action: automation.turn_off
        entity_id: automation.kitchen_lights_sleep_mode_off

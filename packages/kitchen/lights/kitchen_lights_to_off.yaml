# Kitchen Lights to Off
#
# Room Off always turns the lights off. Vacancy only does so while the hand flag is on.
#

automation:
  - id: "kitchen_lights_to_off"
    initial_state: on
    alias: "Kitchen Lights to off"
    triggers:
      # Kitchen turns to Off mode
      - trigger: state
        entity_id: input_select.kitchen
        to: "Off"
        id: "room_off"
      # Kitchen is not occupied
      - trigger: state
        entity_id: input_boolean.kitchen_occupied
        to: "off"
        id: "vacancy"
      # Not occupied for 2 mins; covers lag when the flag changes
      - trigger: state
        entity_id: input_boolean.kitchen_occupied
        to: "off"
        for:
          minutes: 2
        id: "vacancy_2min"
      # House lighting automations turn on
      - trigger: state
        entity_id: input_boolean.lighting_automations
        to: "on"
        id: "house_flag_on"
    conditions:
      # Lighting automations enabled
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      # Lights are currently on
      - condition: state
        entity_id: light.kitchen_lights
        state: "on"
      - condition: or
        conditions:
          # Room Off always wins
          - condition: trigger
            id: "room_off"
          - condition: and
            conditions:
              - condition: state
                entity_id: input_boolean.kitchen_lighting_automations
                state: "on"
              - condition: state
                entity_id: input_boolean.kitchen_occupied
                state: "off"
    actions:
      - action: light.turn_off
        target:
          entity_id: light.kitchen_lights
      # Lights are no longer auto-on
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.kitchen_lights_auto

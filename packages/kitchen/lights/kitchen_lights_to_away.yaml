automation:
  - id: "kitchen_lights_to_away"
    initial_state: on
    alias: "Kitchen lights to away"
    triggers:
      - trigger: state
        entity_id: input_select.kitchen
        to: "Away"
      - trigger: state
        entity_id: input_select.house
        to: "Away"
    conditions:
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      - condition: or
        conditions:
          - condition: state
            entity_id: input_select.kitchen
            state: "Away"
          - condition: and
            conditions:
              - condition: state
                entity_id: input_select.kitchen
                state: "Auto"
              - condition: state
                entity_id: input_select.house
                state: "Away"
      - condition: state
        entity_id: light.kitchen_lights
        state: "on"
    actions:
      - action: light.turn_off
        entity_id: light.kitchen_lights

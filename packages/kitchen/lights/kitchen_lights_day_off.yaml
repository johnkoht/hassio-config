# Kitchen Lights Day Off
#
# Turn the lights off when daylight alone is bright enough. The sensors read
# with the lights on, so the thresholds include their own glow (LEARNINGS.md).
#
automation:
  - id: "kitchen_lights_day_off"
    initial_state: on
    alias: "Kitchen Lights Day Off"
    triggers:
      # The main end of the kitchen is bright
      - trigger: numeric_state
        entity_id: sensor.kitchen_motion_sensor_main_illuminance
        above: 700
        for:
          minutes: 10
      # The table end of the kitchen is bright
      - trigger: numeric_state
        entity_id: sensor.kitchen_motion_sensor_table_illuminance
        above: 550
        for:
          minutes: 10
      # The weather is not bad outside anymore
      - trigger: state
        entity_id: input_boolean.bad_weather
        to: "off"
      # Entertainment mode ends: re-check
      - trigger: state
        entity_id: input_boolean.entertainment_mode
        from: "on"
        to: "off"
    conditions:
      # Lighting automation is enabled
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      # Kitchen lighting automation is enabled
      - condition: state
        entity_id: input_boolean.kitchen_lighting_automations
        state: "on"
      # Entertainment mode is off
      - condition: state
        entity_id: input_boolean.entertainment_mode
        state: "off"
      # Kitchen is Auto
      - condition: state
        entity_id: input_select.kitchen
        state: "Auto"
      # The weather not bad anymore
      - condition: state
        entity_id: input_boolean.bad_weather
        state: "off"
      # Ensure lights were turned on automatically
      - condition: state
        entity_id: input_boolean.kitchen_lights_auto
        state: "on"
      # Sun is above horizon
      - condition: state
        entity_id: sun.sun
        state: "above_horizon"
      # Light is high on both sensors
      - condition: and
        conditions:
          - condition: numeric_state
            entity_id: sensor.kitchen_motion_sensor_main_illuminance
            above: 700
          - condition: numeric_state
            entity_id: sensor.kitchen_motion_sensor_table_illuminance
            above: 550
      # Lights are currently on
      - condition: state
        entity_id: light.kitchen_lights
        state: "on"
    actions:
      # Turn OFF the lights
      - action: light.turn_off
        target:
          entity_id: light.kitchen_lights
      # Turn off the boolean that identifies if the
      # lights were automatically turned on
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.kitchen_lights_auto

# Kitchen Lights Day On
#
# Turn the ceiling lights on when the darker end of the kitchen drops
# below 250 lux (kitchen-specific; see LEARNINGS.md).
#
automation:
  - id: "kitchen_lights_day_on"
    initial_state: on
    alias: "Kitchen Lights Day On"
    triggers:
      # Light is low at either end of the kitchen
      - trigger: numeric_state
        entity_id:
          - sensor.kitchen_motion_sensor_main_illuminance
          - sensor.kitchen_motion_sensor_table_illuminance
        below: 250
        for:
          minutes: 2
      - trigger: numeric_state
        entity_id:
          - sensor.kitchen_motion_sensor_main_illuminance
          - sensor.kitchen_motion_sensor_table_illuminance
        below: 225
        for:
          minutes: 5
      - trigger: numeric_state
        entity_id:
          - sensor.kitchen_motion_sensor_main_illuminance
          - sensor.kitchen_motion_sensor_table_illuminance
        below: 200
        for:
          minutes: 10
      # The weather is bad outside
      - trigger: state
        entity_id: input_boolean.bad_weather
        to: "on"
      # Light automations is enabled
      - trigger: state
        entity_id: input_boolean.lighting_automations
        to: "on"
      # Light automations is enabled
      - trigger: state
        entity_id: input_boolean.kitchen_lighting_automations
        to: "on"
    conditions:
      # Lighting automation is enabled
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      # Kitchen lighting automation is enabled
      - condition: state
        entity_id: input_boolean.kitchen_lighting_automations
        state: "on"
      # No hand override in effect
      - condition: state
        entity_id: input_boolean.kitchen_lights_manually_toggled
        state: "off"
      # Kitchen is Auto
      - condition: state
        entity_id: input_select.kitchen
        state: "Auto"
      # Kitchen is occupied
      - condition: state
        entity_id: input_boolean.kitchen_occupied
        state: "on"
      # Sun is above horizon
      - condition: state
        entity_id: sun.sun
        state: "above_horizon"
      # Light is low at either end of the kitchen
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: sensor.kitchen_motion_sensor_main_illuminance
            below: 250
          - condition: numeric_state
            entity_id: sensor.kitchen_motion_sensor_table_illuminance
            below: 250
      # Lights are currently off
      - condition: state
        entity_id: light.kitchen_ceiling_lights
        state: "off"
    actions:
      # Turn the lights on
      - action: light.turn_on
        target:
          entity_id: light.kitchen_ceiling_lights
        data:
          transition: 5
      # Toggle the boolean to flag it was auto
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.kitchen_lights_auto

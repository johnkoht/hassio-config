# Jr. Suite Air Quality Detections
#
# If PM2.5, CO2, or TVOCs breach thresholds
# then turn on the air purifier.
#
automation:
  - id: "jr_suite_air_quality_detections"
    alias: Jr. Suite Air Quality Sensor Detections
    mode: single
    initial_state: on
    triggers:
      # Triggered by any change to the air quality state
      - trigger: state
        entity_id: sensor.jr_suite_air_quality
    conditions:
      - or:
          # House is occupied
          - condition: state
            entity_id: input_boolean.house_occupied
            state: "on"
          # Or we're almost home
          - condition: state
            entity_id: input_boolean.nearly_home
            state: "on"
    variables:
      purifier: fan.jr_suite_air_purifier
      aqi_state: "{{ states.sensor.jr_suite_air_quality.state }}"
      room_state: "{{ states.input_select.jr_suite.state }}"
    actions:
      # Call the air quality set purifier mode script
      # and let it handle the logic for speed and mode
      - action: script.air_quality_set_air_purifier_mode
        data:
          purifier: "{{ purifier }}"
          aqi_state: "{{ aqi_state }}"
          room_state: "{{ room_state }}"

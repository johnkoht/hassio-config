# Climate - Apply Main Floor
#
# Queues runs for this zone so they never interleave, then runs the shared
# apply script and waits for it.

script:
  climate_apply_main_floor:
    alias: "Climate - Apply Main Floor"
    icon: mdi:thermostat-auto
    mode: queued
    max: 3
    fields:
      source:
        description: "decision, drift, hold or start"
    sequence:
      - action: script.climate_apply_zone
        data:
          zone: "main_floor"
          source: "{{ source | default('start') }}"

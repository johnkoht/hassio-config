# Smart Climate Profiles
#
# Comfort, Sleep and Away setpoints. Radiant maxima stay at or below 71.
# Defaults live in script.climate_seed_defaults. No `initial:`.

input_number:
  climate_main_floor_comfort_heat:
    name: Climate - Main Floor Comfort Heat
    min: 60
    max: 78
    step: 0.5
    mode: box
    unit_of_measurement: °F
    icon: mdi:fire

  climate_main_floor_comfort_cool:
    name: Climate - Main Floor Comfort Cool
    min: 68
    max: 82
    step: 0.5
    mode: box
    unit_of_measurement: °F

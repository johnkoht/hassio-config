# Smart Climate Zone Modes
#
# One mode select per zone (not the garage) plus the season select.
# Written by the mode resolver; Override means hands off. No `initial:`.

input_select:
  climate_mode_main_floor:
    name: Climate - Main Floor Mode
    options:
      - "Comfort"
      - "Sleep"
      - "Away"
      - "Off"
      - "Override"
    icon: mdi:home-thermometer

  climate_mode_second_floor:
    name: Climate - 2nd Floor Mode
    options:
      - "Comfort"

# Climate Decisions
#
# One decision sensor per zone. State is the target temperature; the logic
# lives in custom_templates/climate_control.jinja.
#
template:
  - sensor:
      - name: "Climate Decision Main Floor"
        unique_id: climate_decision_main_floor
        default_entity_id: sensor.climate_decision_main_floor
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        state: >-
          {% from 'climate_control.jinja' import climate_decision %}
          {% set t = (climate_decision('main_floor') | trim | from_json).temperature %}
          {{ none if t is none else t }}
        attributes:
          hvac_mode: >-
            {% from 'climate_control.jinja' import climate_decision %}
            {{ (climate_decision('main_floor') | trim | from_json).hvac_mode }}
          zone_mode: >-
            {% from 'climate_control.jinja' import climate_decision %}
            {{ (climate_decision('main_floor') | trim | from_json).zone_mode }}
          reason: >-
            {% from 'climate_control.jinja' import climate_decision %}
            {{ (climate_decision('main_floor') | trim | from_json).reason }}

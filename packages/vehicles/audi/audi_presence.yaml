sensor:
  - platform: mqtt_room
    device_id: !secret audi_device_id
    name: "Audi Presence"
    state_topic: !secret audi_state_topic
    timeout: 10
    away_timeout: 60

template:
  - sensor:
      - name: "Audi Location"
        unique_id: audi_location
        default_entity_id: sensor.audi_location
        state: >-
          {% set state = states.sensor.audi_presence.state %}

          {% if state == "not_home" %}
            Not Home
          {% else %}
            {% set dist = states.sensor.audi_presence.attributes.distance %}
            {% if dist > 8 %}
              Driveway
            {% else %}
              Garage
            {% endif %}
          {% endif %}

automation:
  - id: "audi_is_home"
    initial_state: on
    alias: "Audi is Home"
    triggers:
      - trigger: state
        entity_id: sensor.audi_presence
        from: "not_home"
      - trigger: state
        entity_id: sensor.audi_presence
        to: "garage"
      - trigger: event
        event_type: automation_reloaded
      - trigger: homeassistant
        event: start
    conditions:
      - condition: or
        conditions:
          - condition: state
            entity_id: sensor.audi_presence
            state: "garage"
          - condition: template
            value_template: "{{ states.sensor.audi_presence.state != 'not_home'}}"
    actions:
      - action: input_boolean.turn_on
        entity_id: input_boolean.audi_home

automation:
  - id: "audi_is_away"
    alias: "Audi is Away"
    initial_state: on
    triggers:
      # BLE detected not_home
      - trigger: state
        entity_id: sensor.audi_presence
        to: "not_home"
      # Handle restarts and reloads of HA
      - trigger: event
        event_type: automation_reloaded
      - trigger: homeassistant
        event: start
    conditions:
      # Not detected home
      - condition: state
        entity_id: sensor.audi_presence
        state: "not_home"
    actions:
      - action: input_boolean.turn_off
        entity_id: input_boolean.audi_home

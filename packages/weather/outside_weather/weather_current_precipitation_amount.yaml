template:
  - sensor:
      - name: "Weather - Current Precipitation Amount"
        unique_id: weather_current_precipitation_amount
        default_entity_id: sensor.weather_current_precipitation_amount
        state: >
          {{ states('sensor.pirateweather_precip_intensity_0h') | float | round(1, default=0) }}
        state_class: measurement
        unit_of_measurement: "in"
        icon: mdi:water-percent
        device_class: precipitation


  #
  # Binary Sensor if rain probability is > 0
  #
  - binary_sensor:
      - name: "Weather Incoming Rain"
        unique_id: weather_incoming_rain
        default_entity_id: binary_sensor.weather_incoming_rain
        state: >
          {{ states.sensor.pirateweather_precip_probability.state | float(2) > 0 }}

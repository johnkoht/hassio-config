template:
  - fan:
      - name: "Mudroom Bathroom Fan"
        unique_id: mudroom_bathroom_fan
        default_entity_id: fan.mudroom_bathroom_fan
        state: "{{ states('light.mudroom_bathroom_fan') }}"
        turn_on:
          - action: light.turn_on
            target:
              entity_id: light.mudroom_bathroom_fan
        turn_off:
          - action: light.turn_off
            target:
              entity_id: light.mudroom_bathroom_fan

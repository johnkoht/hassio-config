# Mudroom Bathroom Not Occupied
#
# Clear occupancy when the Aqara occupancy sensor goes off, or after
# 5 minutes without motion once the room looks empty. The door sensor is
# optional: only a closed door ("off") holds the room occupied, so an
# unavailable door sensor can't stick occupancy on.
#

automation:
  - id: "mudroom_bathroom_not_occupied"
    alias: "Mudroom Bathroom Not Occupied"
    triggers:
      # No motion for 5 mins
      - trigger: state
        entity_id: binary_sensor.mudroom_bathroom_motion
        to: "off"
        for:
          minutes: 5
      # No aqara occupancy
      - trigger: state
        entity_id: binary_sensor.mudroom_bathroom_occupancy
        to: "off"
    conditions:
      # Mudroom Bathroom is occupied
      - condition: state
        entity_id: input_boolean.mudroom_bathroom_occupied
        state: "on"
      - condition: or
        conditions:
          # Aqara occupancy is OFF
          - condition: state
            entity_id: binary_sensor.mudroom_bathroom_occupancy
            state: "off"
          # No motion AND the door was opened in the past 3 mins
          - condition: and
            conditions:
              - condition: state
                entity_id: binary_sensor.mudroom_bathroom_motion
                state: "off"
              - condition: template
                value_template: "{{ (as_timestamp(now()) - as_timestamp(states.binary_sensor.mudroom_bathroom_door.last_changed)) | int < 180 }}"
          # No motion for 5 minutes AND the door is not closed
          # (open, or unavailable while the sensor is offline)
          - condition: and
            conditions:
              - condition: state
                entity_id: binary_sensor.mudroom_bathroom_motion
                state: "off"
                for:
                  minutes: 5
              - condition: not
                conditions:
                  - condition: state
                    entity_id: binary_sensor.mudroom_bathroom_door
                    state: "off"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mudroom_bathroom_occupied

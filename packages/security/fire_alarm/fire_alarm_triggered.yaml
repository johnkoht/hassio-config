automation:
  - id: "fire_alarm_trigger"
    alias: "Fire Alarm - Triggered"
    mode: "single"
    triggers:
      # Smoke detector detects smoke
      - trigger: state
        entity_id: binary_sensor.smoke_detector
        from: "off"
        to: "on"
    actions:
      - action: script.fire_alarm_alert
        data: {}

script:
  fire_alarm_alert:
    alias: "Fire Alarm - Alert"
    mode: "single"
    icon: mdi:alert
    sequence:
      #
      # Branches run in parallel so a slow or failing Nest call
      # can't hold up the alert. script.turn_on doesn't wait for
      # the called script to finish.
      # see https://www.home-assistant.io/docs/scripts/#parallelizing-actions
      #
      - parallel:
          # Trigger a critical announcement
          - action: script.turn_on
            target:
              entity_id: script.critical_announcement
            data:
              variables:
                media_players: all
                sound: "nuclear"
                speech_message: Alert! The smoke detector has been trigger. Get to safety immediately!

          # Notify Noonlight, unless alarm test mode is explicitly on.
          # Only an `on` state skips it: off, unknown, unavailable or a
          # missing helper all dispatch. State conditions never raise.
          - if:
              - condition: state
                entity_id: input_boolean.alarm_test_mode
                state: "on"
            then:
              - action: system_log.write
                data:
                  level: warning
                  message: "Alarm test mode is on: Noonlight was NOT notified"
            else:
              - action: switch.turn_on
                continue_on_error: true
                target:
                  entity_id: switch.noonlight_alarm

          # Flash the lights
          - action: script.turn_on
            target:
              entity_id: script.alarm_flash_lights
            data: {}

          # Send a push notification
          - action: script.turn_on
            target:
              entity_id: script.general_notification
            data:
              variables:
                message: >-
                  The smoke detector has activated, I'm turning off the HVAC. Please get to safety!
                  {% if is_state('input_boolean.alarm_test_mode', 'on') -%}
                  Alarm test mode is on: Noonlight was NOT notified.
                  {%- else -%}
                  Noonlight has been notified. If it is a false alarm, cancel it in the Noonlight app
                  or tell the dispatcher when they call. Home Assistant cannot cancel it.
                  {%- endif %}
                title: Fire & Smoke Alarm
                devices: "all"
                priority: "critical"
                tag: "home-fire-alarm"

          # Turn OFF the HVAC
          - action: climate.turn_off
            continue_on_error: true
            target:
              entity_id:
                - climate.nest_main_floor
                - climate.nest_2nd_floor

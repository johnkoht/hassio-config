light:
  - platform: group
    name: Emergency Light Group
    unique_id: emergency_light_group
    entities:
      - light.kitchen_ceiling_lights
      - light.family_room_main_lights
      # Must be the bulbs — the Inovelli is in Smart Bulb Mode and
      # flashing it would not change the room at all.
      - light.office_ceiling_bulbs
      - light.dining_room_lights
      - light.playroom_lights
      - light.main_bedroom_lights
      - light.foyer_lights
      - light.stairs_light
      - light.laundry_room_main_lights
      - light.main_bathroom_lights
      - light.upstairs_hallway
      - light.exterior_lights

script:
  alarm_flash_lights:
    alias: "Alarm - Flash Lights"
    # single: a second call mid-flash would snapshot the flashing lights.
    mode: "single"
    icon: mdi:alert
    sequence:
      # Snapshot each leaf light; a group snapshot restores every member on
      - action: scene.create
        data:
          scene_id: alarm_flash_lights_initial_state
          snapshot_entities: >-
            {{ expand('light.emergency_light_group')
               | map(attribute='entity_id') | list }}
      # Turn ON the lights
      - action: light.turn_on
        target:
          entity_id: light.emergency_light_group
      # Flash the lights
      - alias: "Flash the lights 10 times"
        repeat:
          count: 10
          sequence:
            - delay: 1
            - action: light.toggle
              target:
                entity_id: light.emergency_light_group
      # Restore lights to original state. An intruder alarm passes
      # keep_lights_on: the lights stay on until disarm, which restores them.
      - if:
          - condition: template
            value_template: "{{ not (keep_lights_on | default(false)) }}"
        then:
          - scene: scene.alarm_flash_lights_initial_state

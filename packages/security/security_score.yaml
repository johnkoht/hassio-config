template:
  - sensor:
      - name: "House Security Score"
        unique_id: house_security_score
        state: >
          {% set score = 0 %}

          {# ------------------------------------------------------------------- #}
          {# CONTEXT VARIABLES                                                  #}
          {# ------------------------------------------------------------------- #}

          {% set hour = now().hour %}
          {% set dark_outside = is_state('input_boolean.dark_outside', 'on') %}
          {% set occupied = is_state('input_boolean.house_occupied', 'on') %}
          {% set vacation = is_state('input_boolean.vacation_mode', 'on') %}
          {% set alarm_state = states('alarm_control_panel.kohbo') %}
          {% set ups_status = states('sensor.apc_ups_status_data') %}
          {% set runtime = states('sensor.apc_ups_battery_runtime') | int(9999) %}
          {% set bad_weather = is_state('input_boolean.bad_weather', 'on') %}

          {# ------------------------------------------------------------------- #}
          {# RISK LEVEL CALCULATION                                             #}
          {# Higher risk = security matters more (both rewards and penalties)   #}
          {# ------------------------------------------------------------------- #}

          {% set risk_factors = namespace(level=0) %}

          {# Time-based risk #}
          {% if dark_outside %}
            {% set risk_factors.level = risk_factors.level + 2 %}
          {% elif hour >= 22 or hour < 5 %}
            {% set risk_factors.level = risk_factors.level + 2 %}
          {% elif hour >= 18 or hour < 7 %}
            {% set risk_factors.level = risk_factors.level + 1 %}
          {% endif %}

          {# Occupancy-based risk #}
          {% if vacation %}
            {% set risk_factors.level = risk_factors.level + 3 %}
          {% elif not occupied %}
            {% set risk_factors.level = risk_factors.level + 2 %}
          {% endif %}

          {# Weather risk #}
          {% if bad_weather %}
            {% set risk_factors.level = risk_factors.level + 1 %}
          {% endif %}

          {# Normalize risk level: low (0-1), medium (2-3), high (4+) #}
          {% if risk_factors.level >= 4 %}
            {% set risk_level = 'high' %}
            {% set penalty_multiplier = 1.5 %}
            {% set bonus_multiplier = 1.3 %}
          {% elif risk_factors.level >= 2 %}
            {% set risk_level = 'medium' %}
            {% set penalty_multiplier = 1.25 %}
            {% set bonus_multiplier = 1.15 %}
          {% else %}
            {% set risk_level = 'low' %}
            {% set penalty_multiplier = 1.0 %}
            {% set bonus_multiplier = 1.0 %}
          {% endif %}

          {# ------------------------------------------------------------------- #}
          {# ALARM STATE (0-25 base points)                                     #}
          {# Proper alarm state is the most important security factor           #}
          {# ------------------------------------------------------------------- #}

          {% if alarm_state == 'armed_away' %}
            {% set score = score + (25 * bonus_multiplier) %}
          {% elif alarm_state == 'armed_home' %}
            {% set score = score + (20 * bonus_multiplier) %}
          {% elif alarm_state == 'disarmed' %}
            {% if occupied %}
              {% set score = score + 8 %}
            {% elif vacation %}
              {% set score = score - (30 * penalty_multiplier) %}
            {% else %}
              {% set score = score - (20 * penalty_multiplier) %}
            {% endif %}
          {% elif alarm_state == 'triggered' %}
            {% set score = score - (50 * penalty_multiplier) %}
          {% endif %}

          {# ------------------------------------------------------------------- #}
          {# PHYSICAL BARRIERS (0-40 base points)                               #}
          {# Locks, doors, windows, garage                                      #}
          {# ------------------------------------------------------------------- #}

          {# Front door lock (most important entry point) #}
          {% if is_state('lock.front_door', 'locked') %}
            {% set score = score + (12 * bonus_multiplier) %}
          {% else %}
            {% set score = score - (15 * penalty_multiplier) %}
          {% endif %}

          {# Garage entry door lock #}
          {% if is_state('lock.garage_entry_door', 'locked') %}
            {% set score = score + (8 * bonus_multiplier) %}
          {% else %}
            {% set score = score - (10 * penalty_multiplier) %}
          {% endif %}

          {# Exterior doors closed #}
          {% if is_state('binary_sensor.exterior_doors', 'off') %}
            {% set score = score + (8 * bonus_multiplier) %}
          {% else %}
            {% set score = score - (15 * penalty_multiplier) %}
          {% endif %}

          {# Garage doors #}
          {% if is_state('cover.garage_doors', 'closed') %}
            {% set score = score + (8 * bonus_multiplier) %}
          {% else %}
            {% set score = score - (18 * penalty_multiplier) %}
          {% endif %}

          {# Windows #}
          {% if is_state('binary_sensor.windows', 'off') %}
            {% set score = score + (4 * bonus_multiplier) %}
          {% else %}
            {% if occupied and not dark_outside %}
              {% set score = score - 2 %}
            {% else %}
              {% set score = score - (10 * penalty_multiplier) %}
            {% endif %}
          {% endif %}

          {# ------------------------------------------------------------------- #}
          {# MONITORING & AWARENESS (0-12 base points)                          #}
          {# Camera notifications and system status                             #}
          {# ------------------------------------------------------------------- #}

          {# Camera notifications #}
          {% if is_state('input_boolean.camera_notifications', 'on') %}
            {% set score = score + (8 * bonus_multiplier) %}
          {% else %}
            {% if occupied %}
              {% set score = score + 0 %}
            {% else %}
              {% set score = score - (12 * penalty_multiplier) %}
            {% endif %}
          {% endif %}

          {# UPS / Power status #}
          {% if ups_status == 'OL' %}
            {% set score = score + (4 * bonus_multiplier) %}
          {% elif ups_status == 'OB' %}
            {% set score = score - (12 * penalty_multiplier) %}
          {% elif ups_status == 'LB' %}
            {% set score = score - (25 * penalty_multiplier) %}
          {% elif runtime < 600 %}
            {% set score = score - (18 * penalty_multiplier) %}
          {% endif %}

          {# ------------------------------------------------------------------- #}
          {# CONTEXT BONUSES                                                    #}
          {# Reward appropriate security posture for the situation              #}
          {# ------------------------------------------------------------------- #}

          {# Bonus: Proper alarm state for occupancy context #}
          {% if not occupied and alarm_state == 'armed_away' %}
            {% set score = score + (5 * bonus_multiplier) %}
          {% elif not occupied and alarm_state == 'armed_home' %}
            {% set score = score + (3 * bonus_multiplier) %}
          {% elif occupied and alarm_state in ['armed_home', 'disarmed'] %}
            {% set score = score + 2 %}
          {% endif %}

          {# Bonus: Exterior lights on at night (deterrence) #}
          {% if dark_outside and is_state('group.exterior_lights', 'on') %}
            {% set score = score + (5 * bonus_multiplier) %}
          {% endif %}

          {# Penalty: Late night without appropriate alarm when empty #}
          {% if (22 <= hour or hour < 5) and not occupied %}
            {% if alarm_state not in ['armed_away', 'armed_home'] %}
              {% set score = score - (20 * penalty_multiplier) %}
            {% endif %}
          {% endif %}

          {# ------------------------------------------------------------------- #}
          {# FINAL SCORE (clamped 0-100)                                        #}
          {# ------------------------------------------------------------------- #}
          {% if score < 0 %}
            0
          {% elif score > 100 %}
            100
          {% else %}
            {{ score | round(0) }}
          {% endif %}

        attributes:
          friendly_name: "House Security Score"
          last_updated: "{{ now().isoformat() }}"
          alarm_state: "{{ states('alarm_control_panel.kohbo') }}"
          occupancy: "{{ states('input_boolean.house_occupied') }}"
          ups_status: "{{ states('sensor.apc_ups_status_data') }}"
          ups_runtime: "{{ states('sensor.apc_ups_battery_runtime') }}"
          dark_outside: "{{ states('input_boolean.dark_outside') }}"
          windows: "{{ states('binary_sensor.windows') }}"
          exterior_doors: "{{ states('binary_sensor.exterior_doors') }}"
          garage_doors: "{{ states('cover.garage_doors') }}"
          front_door: "{{ states('lock.front_door') }}"
          garage_entry_door: "{{ states('lock.garage_entry_door') }}"
          camera_notifications: "{{ states('input_boolean.camera_notifications') }}"
          risk_level: >
            {% set hour = now().hour %}
            {% set dark = is_state('input_boolean.dark_outside', 'on') %}
            {% set occupied = is_state('input_boolean.house_occupied', 'on') %}
            {% set vacation = is_state('input_boolean.vacation_mode', 'on') %}
            {% set bad_weather = is_state('input_boolean.bad_weather', 'on') %}
            {% set level = 0 %}
            {% if dark or hour >= 22 or hour < 5 %}
              {% set level = level + 2 %}
            {% elif hour >= 18 or hour < 7 %}
              {% set level = level + 1 %}
            {% endif %}
            {% if vacation %}
              {% set level = level + 3 %}
            {% elif not occupied %}
              {% set level = level + 2 %}
            {% endif %}
            {% if bad_weather %}
              {% set level = level + 1 %}
            {% endif %}
            {% if level >= 4 %}
              high
            {% elif level >= 2 %}
              medium
            {% else %}
              low
            {% endif %}


automation:
  #
  # Security Alarm Triggered
  #
  - id: "security_alarm_trigger"
    alias: "Security Alarm - Triggered"
    mode: "single"
    triggers:
      # Security alarm is triggered
      - trigger: state
        entity_id: alarm_control_panel.alarmo
        to: "triggered"
    actions:
      - action: script.security_alarm_alert
        data: {}

  #
  # Security Alarm Disabled
  #
  - id: "security_alarm_disabled"
    alias: "Security Alarm - Disabled"
    mode: "single"
    triggers:
      # Security alarm leaves triggered: disarmed, or the trigger time ran
      # out and alarmo went back to an armed state (or a panic from disarmed)
      - trigger: state
        entity_id: alarm_control_panel.alarmo
        from: "triggered"
        not_to:
          - "unavailable"
          - "unknown"
    actions:
      - action: script.security_alarm_disabled
        data: {}



script:
  security_alarm_alert:
    alias: "Security Alarm - Alert"
    mode: "single"
    icon: mdi:alert
    sequence:
      #
      # Branches run in parallel so the Noonlight cloud call can't
      # hold up or abort the sirens. script.turn_on doesn't wait for
      # the called script to finish.
      # see https://www.home-assistant.io/docs/scripts/#parallelizing-actions
      #
      - parallel:
          # Notify Noonlight, unless alarm test mode is explicitly on.
          # Only an `on` state skips it: off, unknown, unavailable or a
          # missing helper all dispatch. State conditions never raise.
          - if:
              - condition: state
                entity_id: input_boolean.alarm_test_mode
                state: "on"
            then:
              - action: system_log.write
                data:
                  level: warning
                  message: "Alarm test mode is on: Noonlight was NOT notified"
            else:
              - action: switch.turn_on
                continue_on_error: true
                target:
                  entity_id: switch.noonlight_alarm

          # Sound the sirens!
          - action: switch.turn_on
            target:
              entity_id:
                - switch.alarm_siren_1
                - switch.alarm_siren_2

          # Trigger a critical announcement
          - action: script.turn_on
            target:
              entity_id: script.critical_announcement
            data:
              variables:
                media_players: all
                sound: "nuclear"
                speech_message: Alert! The security alarm has been triggered. Get to safety immediately!

          # Flash the lights
          - action: script.turn_on
            target:
              entity_id: script.alarm_flash_lights
            data:
              variables:
                keep_lights_on: true

          # Send a push notification
          - action: script.turn_on
            target:
              entity_id: script.general_notification
            data:
              variables:
                message: The security alarm has been triggered. Please get to safety immediately!
                title: Security Alarm
                devices: "all"
                priority: "critical"
                tag: "home-security-alarm"
                url: /dashboard-kohbo/security


  security_alarm_disabled:
    alias: "Security Alarm - Disabled"
    mode: "single"
    icon: mdi:security-home
    sequence:
      # Turn off Noonlight
      - action: switch.turn_off
        target:
          entity_id: switch.noonlight_alarm

      # Turn off the sirens! Not while the smoke detector is still on: a fire
      # during the intruder alarm keeps its sirens until fire_alarm_cleared.
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: binary_sensor.smoke_detector
                state: "on"
        then:
          - action: switch.turn_off
            target:
              entity_id:
                - switch.alarm_siren_1
                - switch.alarm_siren_2

      # Stop the flash if it is still running
      - if:
          - condition: state
            entity_id: script.alarm_flash_lights
            state: "on"
        then:
          - action: script.turn_off
            target:
              entity_id: script.alarm_flash_lights

      # Lights stayed on for the intruder alarm: put them back. The flash
      # snapshots at its start, so this is this alarm's snapshot. It may not
      # exist (restart, flash never ran); never block the notification.
      - action: scene.turn_on
        continue_on_error: true
        target:
          entity_id: scene.alarm_flash_lights_initial_state

      # Notify us
      - action: script.general_notification
        data:
          message: The security alarm has stopped (disarmed, or its trigger time ended).
          title: Security Alarm
          devices: "all"
          priority: "time-sensitive"
          tag: "home-security-alarm"
          url: /dashboard-kohbo/security

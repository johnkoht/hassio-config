# Cameras Available
#
# Online only when all 7 Protect uptime sensors have a state (checked by state, not ID).
#
template:
  - binary_sensor:
      - name: "Cameras Available"
        unique_id: cameras_available
        state: >
          {% set cameras = [
            'sensor.g4_bullet_uptime',
            'sensor.g4_bullet_uptime_2',
            'sensor.backyard_pool_uptime',
            'sensor.backyard_northwest_uptime',
            'sensor.driveway_front_camera_uptime',
            'sensor.front_door_camera_uptime',
            'sensor.g5_turret_ultra_uptime_2'
          ] %}

          {% set offline = cameras
            | reject('has_value')
            | list
            | length %}
          {{ offline == 0 }}
        attributes:
          unavailable_count: >
            {% set cameras = [
              'sensor.g4_bullet_uptime',
              'sensor.g4_bullet_uptime_2',
              'sensor.backyard_pool_uptime',
              'sensor.backyard_northwest_uptime',
              'sensor.driveway_front_camera_uptime',
              'sensor.front_door_camera_uptime',
              'sensor.g5_turret_ultra_uptime_2'
            ] %}

            {% set offline = cameras
              | reject('has_value')
              | list
              | length %}
            {{ offline }}
          unavailable_list: >
            {% set cameras = [
              'sensor.g4_bullet_uptime',
              'sensor.g4_bullet_uptime_2',
              'sensor.backyard_pool_uptime',
              'sensor.backyard_northwest_uptime',
              'sensor.driveway_front_camera_uptime',
              'sensor.front_door_camera_uptime',
              'sensor.g5_turret_ultra_uptime_2'
            ] %}

            {% set offline = cameras
              | reject('has_value')
              | list %}
            {{ offline }}
          total_cameras: 7
          friendly_name: "Cameras Available (Uptime)"

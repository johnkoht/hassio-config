# Family Room Entertainment Mode Off
#
# Entertainment mode turns off (or the house empties): resume Adaptive Lighting and, if the room is in use, its speech notifications.
#

automation:
  - id: "family_room_entertainment_mode_off"
    initial_state: on
    alias: "Family Room - Entertainment Mode Off"
    triggers:
      # Entertainment mode turns off
      - trigger: state
        entity_id: input_boolean.entertainment_mode
        from: "on"
        to: "off"
    actions:
      # Resume Adaptive Lighting
      - action: switch.turn_on
        target:
          entity_id: switch.adaptive_lighting_family_room
      # Same test as family_room_speech_notifications_on: only when the room is in use
      - if:
          - alias: "Family Room is occupied"
            condition: state
            entity_id: input_boolean.family_room_occupied
            state: "on"
          - alias: "Family Room is in Auto mode"
            condition: state
            entity_id: input_select.family_room
            state: "Auto"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.family_room_speech_notifications

# Family Room Mode On
#
# Selects the room mode when the room becomes occupied or the lights are switched on.
# Disabled; the select has no "On" option, so it now selects "Auto".
#

automation:
  - id: "family_room_mode_on"
    initial_state: "off"
    alias: "Family room mode on"
    triggers:
      - trigger: state
        entity_id: input_boolean.family_room_occupied
        to: "on"
      # Lights are manually turned on
      - trigger: state
        entity_id: light.family_room_main_lights
        to: "on"
    conditions:
      # Family room is occupied
      - condition: state
        entity_id: input_boolean.family_room_occupied
        state: "on"
      # Not currently On
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.family_room
            state: "On"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.family_room
        data:
          option: "Auto"

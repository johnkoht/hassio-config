# Family Room BLE Occupancy
#
# The Family Room has two BLE base stations. This sensor
# combines them into one to check if anybody is present.
#
template:
  - binary_sensor:
      - name: "Family Room BLE occupancy"
        unique_id: family_room_ble_occupancy
        default_entity_id: binary_sensor.family_room_ble_occupancy
        device_class: occupancy
        state: >-
          {{ expand('group.room_presence_devices')|selectattr('state', 'in', ['family_room'])|map(attribute='name')|list | length > 0 }}

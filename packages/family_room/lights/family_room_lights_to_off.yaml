# Family Room Lights To Off
#
# Turns the main lights off when the room or house is Off, or the room empties.
#

automation:
  - id: "family_room_lights_to_off"
    initial_state: "on"
    alias: "Family room lights to off"
    triggers:
      # Family room is Off
      - trigger: state
        entity_id: input_select.family_room
        to: "Off"
      # House is Off
      - trigger: state
        entity_id: input_select.house
        to: "Off"
      # Fmaily room is not occupied
      - trigger: state
        entity_id: input_boolean.family_room_occupied
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      - condition: or
        conditions:
          - condition: state
            entity_id: input_select.family_room
            state: "Off"
          # Family Room is no longer occupied
          - condition: state
            entity_id: input_boolean.family_room_occupied
            state: "off"
          - condition: and
            conditions:
              - condition: state
                entity_id: input_select.family_room
                state: "Auto"
              - condition: state
                entity_id: input_select.house
                state: "Off"
      - condition: state
        entity_id: light.family_room_main_lights
        state: "on"
    actions:
      - action: light.turn_off
        target:
          entity_id: light.family_room_main_lights

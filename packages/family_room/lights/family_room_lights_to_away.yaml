# Family Room Lights To Away
#
# Turns the main lights off when the room or house goes Away.
#

automation:
  - id: "family_room_lights_to_away"
    initial_state: "on"
    alias: "Family room lights to away"
    triggers:
      - trigger: state
        entity_id: input_select.family_room
        to: "Away"
      - trigger: state
        entity_id: input_select.house
        to: "Away"
    conditions:
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      - condition: or
        conditions:
          - condition: state
            entity_id: input_select.family_room
            state: "Away"
          - condition: and
            conditions:
              - condition: state
                entity_id: input_select.family_room
                state: "Auto"
              - condition: state
                entity_id: input_select.house
                state: "Away"
      - condition: state
        entity_id: light.family_room_main_lights
        state: "on"
    actions:
      - action: light.turn_off
        target:
          entity_id: light.family_room_main_lights

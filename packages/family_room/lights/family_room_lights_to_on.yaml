# Family Room Lights To On
#
# Turns the main lights on when the room or house is On.
# Disabled; the select has no "On" option, so the room trigger never fires.
#

automation:
  - id: "family_room_lights_to_on"
    initial_state: "off"
    alias: "Family room lights to On"
    triggers:
      # Famiily room is in On mode
      - trigger: state
        entity_id: input_select.family_room
        to: "On"
      # House is in the On mode
      - trigger: state
        entity_id: input_select.house
        to: "On"
    conditions:
      # Lighting automations are enabled
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      - condition: or
        conditions:
          # Family room is On
          - condition: state
            entity_id: input_select.family_room
            state: "On"
          # OR family room is in Auto mode or the house is On
          - condition: and
            conditions:
              - condition: state
                entity_id: input_select.family_room
                state: "Auto"
              - condition: state
                entity_id: input_select.house
                state: "On"
      # Light are currently off
      - condition: state
        entity_id: light.family_room_main_lights
        state: "off"
    actions:
      # Disabled: was switch.turn_on on a light entity, which would not work
      - action: light.turn_on
        target:
          entity_id: light.family_room_main_lights

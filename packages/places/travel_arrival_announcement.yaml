automation:
  - id: "travel_arrival_announcement"
    alias: "Travel - Arrival Announcement"
    mode: "single"
    triggers:
      # Arrive to a location
      - trigger: state
        entity_id:
          - person.john_koht
          - person.cristina_falbo
        to:
          - "Waldorf Astoria Hotel"
        for:
          minutes: 1
    # condition:
    actions:
      # Voice announcement
      - action: script.voice_announcement
        data:
          media_players: auto
          sound: musical-flute
          speech_message: >
            {% set person = "" %}
            {% set ent = trigger.entity_id %}

            {% if ent == "person.john_koht" %}
              {% set person = "Baba" %}
            {% else %}
              {% set person = "Mama" %}
            {% endif %}

            {% set store = trigger.to_state.state %}

            "Just wanted to let you know that {{person}} safely arrived at {{store}}!"

# Announceable Rooms
#
# Ensure there are announceable rooms. This is mostly
# true, but sometimes it's possible that the only rooms
# occupied don't have a speakers, so there's no reason
# to broadcast the message.
#
#
template:
  - binary_sensor:
      - name: "Announceable Rooms Occupied"
        unique_id: announceable_rooms_occupied
        default_entity_id: binary_sensor.announceable_rooms_occupied
        state: >-
          {{
            states.input_boolean.kitchen_occupied.state == "on"
            or states.input_boolean.family_room_occupied.state == "on"
            or states.input_boolean.playroom_occupied.state == "on"
            or states.input_boolean.office_occupied.state == "on"
            or states.input_boolean.dining_room_occupied.state == "on"
            or states.input_boolean.main_bedroom_occupied.state == "on"
          }}

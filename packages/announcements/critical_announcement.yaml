# Critical Announcements
#
# Sometimes, we need to really make sure that an
# announcement is heard. This script starts the
# announcement engine directly (not through the MQTT
# queue, so house_occupied and quiet-before-9 never
# hold it) and broadcasts to all rooms, regardless of
# occupancy. It is louder and has a "nuclear" sound.
# While an emergency is active the volume isn't halved.
#
script:
  critical_announcement:
    alias: Critical Announcement
    mode: "queued"
    # Fields for dynamic attributes
    fields:
      #
      #
      # Sound
      #
      sound:
        name: Sound
        description: The chime sound to play prior to the notification
        example: "nuclear"
        default: "default"
        selector:
          select:
            options:
              - default
              - nuclear
      #
      #
      # Speech Message Details
      #
      speech_message:
        name: Speech Message
        description: The TTS message that will be broadcast
        example: "Hello, world!"
        selector:
          text:
            type: text
      #
      #
      # Media Player
      media_players:
        name: Media Players
        description: The media players that should broadcast the announcement
        example: "media_player.sonos_office"
        selector:
          entity:
            include_entities:
              - media_player.sonos_office
              - media_player.sonos_family_room
              - media_player.sonos_kitchen
              - media_player.sonos_playroom
              - media_player.sonos_living_room

    # Variables
    variables:
      sound_file: >-
        {% if sound == "default" %}
          /local/sounds/nuclear-alarm.mp3
        {% else %}
          /local/sounds/nuclear-alarm.mp3
        {% endif %}
      # Sound file length
      sound_file_length: >-
        {% if sound == "nuclear" %}
          2
        {% else %}
          2
        {% endif %}
      # Sound file volume
      sound_file_volume: >-
        {% set vol = 40 %}

        {# Adjust the volume based on house mode #}
        {% if states.input_boolean.quiet_mode.state == "on" and not is_state('binary_sensor.emergency_active', 'on') %}
          {% set vol = vol * 0.5 %}
        {% endif %}

        {{ vol }}
      # Sound file volume
      speech_volume: >-
        {# Sound volumes vary so this is a way to compensate #}
        {% set vol = 40 %}

        {# Adjust the volume based on house mode #}
        {% if states.input_boolean.quiet_mode.state == "on" and not is_state('binary_sensor.emergency_active', 'on') %}
          {% set vol = vol * 0.50%}
        {% endif %}

        {{ vol }}
      # Rooms to broadcast to
      target_players: >-
        {% if media_players == "all" %}
          {% set media_players = [
              "media_player.sonos_office",
              "media_player.sonos_family_room",
              "media_player.sonos_kitchen",
              "media_player.sonos_playroom",
              "media_player.sonos_basement",
              "media_player.sonos_living_room",
              "media_player.sonos_main_bedroom",
              "media_player.ninos_room"
            ]
          %}
        {% elif media_players == "auto" %}
          {% set media_players = [] %}
          {# Check which rooms are occupied and if speech notifications are turned #}
          {# on for them. If so, add them to an array of announceable rooms #}
          {% if states.input_boolean.office_occupied.state == "on" %}
            {% set media_players = media_players + ["media_player.sonos_office"] %}
          {% endif %}{% if states.input_boolean.family_room_occupied.state == "on" %}
            {% set media_players = media_players + ["media_player.sonos_family_room"] %}
          {% endif %}{% if states.input_boolean.kitchen_occupied.state == "on" %}
            {% set media_players = media_players + ["media_player.sonos_kitchen"] %}
          {% endif %}{% if states.input_boolean.playroom_occupied.state == "on" %}
            {% set media_players = media_players + ["media_player.sonos_playroom"] %}
          {% endif %}{% if states.input_boolean.main_bedroom_occupied.state == "on" %}
            {% set media_players = media_players + ["media_player.sonos_main_bedroom"] %}
          {% endif %}
        {% endif %}

        {{ media_players}}

    sequence:
      # Save the latest message first so an engine error can't skip it
      - action: input_text.set_value
        target:
          entity_id: input_text.latest_voice_announcement
        data:
          value: "{{ speech_message }}"

      # Start the engine without waiting: the engine is mode queued so
      # playback stays in order, and a REST caller (the leak notifier,
      # 10 s timeout) gets its answer straight away.
      - alias: "Broadcast the critical announcement"
        action: script.turn_on
        target:
          entity_id: script.announcement_engine
        data:
          variables:
            priority: "critical"
            speech_message: "{{ speech_message }}"
            sound_file: "{{ sound_file }}"
            sound_length: "{{ sound_file_length }}"
            sound_volume: "{{ sound_file_volume }}"
            speech_volume: "{{ speech_volume }}"
            media_players: "{{ target_players }}"

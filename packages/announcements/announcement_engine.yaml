# Announcement Engine
#
# This is the actual script that broadcasts the
# chime and TTS message. It's used by the voice
# announcement script and others.
#
# This can be run with either a chime and/or a
# speech message. For example the door bell automation
# uses this with only a chime, no speech message is
# included.
#
#
# Sound (optional)
# Sound length (optional)
# Speech message (optional)
# Rooms (required)
# Priority (optional, default normal)
#
# While binary_sensor.emergency_active is on, only priority
# critical plays. Everything else is dropped at the first step.
#

script:
  announcement_engine:
    alias: "Announcement Engine"
    mode: "queued"
    # A burst (doorbell loop, dong, queue) must not drop a critical call
    max: 25

    fields:
      #
      #
      # Priority (fields have no runtime default; the gate defaults it)
      #
      priority:
        name: Priority
        description: Only "critical" plays while an emergency is active
        example: "critical"
        default: "normal"
        selector:
          select:
            options:
              - "critical"
              - "high"
              - "normal"
              - "low"
      #
      #
      # Sound File Details
      #
      sound_file:
        name: Sound File
        description: A URL to a sound file to play
        example: "/local/sounds/Notification-sound.mp3"
        selector:
          text:
            type: url
      # Sound file length
      sound_length:
        name: Sound Length
        description: The lengths of the sound file in seconds
        example: "2"
        selector:
          number:
            min: 1
            max: 10
            mode: box
      # Sound volume
      sound_volume:
        name: Sound Volume
        description: The volume of the chime sound
        example: "30"
        default: 30
        selector:
          number:
            min: 10
            max: 75
      #
      #
      # Speech Message Details
      #
      speech_message:
        name: Speech Message
        description: The TTS message that will be broadcast
        example: "Hello, world!"
        selector:
          text:
            type: text
      # Speech notification volume
      speech_volume:
        name: Speech Message Volume
        description: The volume of the speech notification
        example: "30"
        default: 30
        selector:
          number:
            min: 10
            max: 75
      #
      #
      # Media Player
      media_players:
        name: Media Players
        description: The media players that should broadcast the announcement
        selector:
          entity:
            include_entities:
              - media_player.sonos_living_room
              - media_player.sonos_office
              - media_player.sonos_family_room
              - media_player.sonos_kitchen
              - media_player.sonos_playroom

    sequence:
      # Emergency gate: fails open if the sensor is missing or unavailable
      - alias: "Skip non-critical announcements during an emergency"
        condition: template
        value_template: >-
          {{ not is_state('binary_sensor.emergency_active', 'on')
             or (priority | default('normal')) == 'critical' }}

      # Play a chime
      - action: media_player.play_media
        continue_on_error: true
        data:
          # entity_id: media_player.sonos_office
          entity_id: "{{ media_players }}"
          media_content_id: "{{sound_file}}"
          media_content_type: music
          announce: true
          extra:
            # Hard clamp to 0..75 whatever a caller passes; NaN or junk gives 30
            volume: >-
              {% set v = sound_volume | default(30) | float(30) %}
              {{ 30 if v != v else [[v, 0] | max, 75] | min | int }}

      # Wait for the chime to complete
      - alias: "Wait for chime to complete"
        delay: "{{sound_length}}"

      # This engine can be used as simply a chime without a message, so
      # let's make sure there's a message to cotinue, otherwise abort.
      - alias: "Check if there's a TTS message"
        condition: template
        value_template: "{{true if speech_message is defined else false}}"

        # {{ quiet_time_volume if quiet_time_volume is defined and quiet_time_volume != none else 0 }}

      # Play the TTS message
      - action: media_player.play_media
        data:
          entity_id: "{{ media_players }}"
          media_content_id: "media-source://tts/cloud?message={{speech_message}}&language=en-GB&gender=female"
          media_content_type: music
          announce: true
          extra:
            # Hard clamp to 0..75 whatever a caller passes; NaN or junk gives 30
            volume: >-
              {% set v = speech_volume | default(30) | float(30) %}
              {{ 30 if v != v else [[v, 0] | max, 75] | min | int }}

      # Conservative: cloud TTS fetch time isn't in the estimate, and a short
      # wait let the next item start over the tail of a critical message.
      - alias: "Wait for TTS to finish (approx)"
        delay: >
          {% set length = (speech_message|length) | float(0) %}
          {{ ((length / 14) | round(0, 'ceil') + 3) | int(3) }}

template:
  - fan:
      - name: "Powder Room Fan"
        unique_id: powder_room_fan
        default_entity_id: fan.powder_room_fan
        state: "{{ states('light.powder_room_fan_switch') }}"
        turn_on:
          - action: light.turn_on
            target:
              entity_id: light.powder_room_fan_switch
        turn_off:
          - action: light.turn_off
            target:
              entity_id: light.powder_room_fan_switch

# Powder Room Lights Off
#
# Turn the lights off when the Powder Room is Off or no longer occupied.
#
automation:
  - id: "powder_room_lights_off"
    alias: "Powder Room lights off"
    triggers:
      # Powder Room not occupied
      - trigger: state
        entity_id: input_boolean.powder_room_occupied
        to: "off"
      # Powder Room is Off
      - trigger: state
        entity_id: input_select.powder_room
        to: "Off"
      # Lighting automations turn on
      - trigger: state
        entity_id: input_boolean.lighting_automations
        to: "on"
    conditions:
      # Lights are currently on
      - condition: state
        entity_id: light.powder_room_main_lights
        state: "on"
      - condition: or
        conditions:
          # Powder Room is Off
          - condition: state
            entity_id: input_select.powder_room
            state: "Off"
          # Powder Room not occupied
          - condition: state
            entity_id: input_boolean.powder_room_occupied
            state: "off"
    actions:
      - action: light.turn_off
        target:
          entity_id: light.powder_room_main_lights

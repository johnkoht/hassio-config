# Bedroom Lights Manually Turned Off
#
automation:
  - id: "main_bedroom_lights_turned_off"
    initial_state: on
    alias: "Main Bedroom lights Manually Turned Off"
    triggers:
      # Lights turned off
      - trigger: state
        entity_id: light.main_bedroom_main_lights
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.main_bedroom_lights_auto
        state: "on"
    actions:
      - action: input_boolean.turn_off
        entity_id: input_boolean.main_bedroom_lights_auto
      # # Deactivate the motion sensors
      # - service: input_boolean.turn_off
      #   entity_id: input_boolean.main_bedroom_lighting_automations

      # If manually toggled off, then turn on the manually toggled boolean
      - if:
          - condition: template
            value_template: "{{ trigger.to_state.context.parent_id == none }}"
        then:
          - action: input_boolean.turn_on
            entity_id: input_boolean.main_bedroom_lights_manually_toggled

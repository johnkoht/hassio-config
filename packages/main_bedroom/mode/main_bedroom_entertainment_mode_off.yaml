# Main Bedroom Entertainment Mode Off
#
# Entertainment mode turns off (or the house empties): resume Adaptive Lighting.
#

automation:
  - id: "main_bedroom_entertainment_mode_off"
    initial_state: on
    alias: "Main Bedroom - Entertainment Mode Off"
    triggers:
      # Entertainment mode turns off
      - trigger: state
        entity_id: input_boolean.entertainment_mode
        from: "on"
        to: "off"
    actions:
      # Resume Adaptive Lighting
      - action: switch.turn_on
        target:
          entity_id: switch.adaptive_lighting_main_bedroom

# Main Bedroom Presence
#
# List of people currently in the room
template:
  - sensor:
      - name: "Main Bedroom Presence"
        unique_id: "main_bedroom_presence"
        default_entity_id: sensor.main_bedroom_presence
        state: >-
          {{ expand('group.room_presence_devices')|selectattr('state', 'in', ['main_bedroom'])|map(attribute='name')|list | join(', ') | regex_replace('Room Presence','') }}
        # state: >-
        #   {{ expand('group.room_presence_devices')|selectattr('state', 'eq', 'main_bedroom')|map(attribute='name')|list | join(', ') | regex_replace('Room Presence','') }}

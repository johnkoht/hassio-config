# Dining Room Presence
#
# Names of the people currently detected in the dining room area,
# derived from BLE room presence (group.room_presence_devices).
#

template:
  - sensor:
      - name: "Dining Room Presence"
        unique_id: dining_room_presence
        default_entity_id: sensor.dining_room_presence
        state: >-
          {{ expand('group.room_presence_devices')|selectattr('state', 'eq', 'dining_room')|map(attribute='name')|list | join(', ') | regex_replace('Room Presence','') }}

automation:
  - id: "dining_room_mode_auto"
    initial_state: on
    alias: "Dining Room mode Auto"
    triggers:
      # Dining Room is occupied
      - trigger: state
        entity_id: input_boolean.dining_room_occupied
        to: "on"
      # House turns to Auto (or Quiet) mode
      - trigger: state
        entity_id: input_select.house
        to:
          - "Auto"
          - "Quiet"
      # House becomes occupied
      - trigger: state
        entity_id: input_boolean.house_occupied
        to: "on"
    conditions:
      # House is occupied
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
      # Dining Room is not already Auto
      - condition: template
        value_template: "{{ not is_state('input_select.dining_room','Auto') }}"
      # It's not bedtime mode
      - condition: state
        entity_id: input_boolean.bedtime
        state: "off"
      # House is in Auto or Quiet mode
      - condition: state
        entity_id: input_select.house
        state:
          - "Auto"
          - "Quiet"
    actions:
      - action: input_select.select_option
        data:
          entity_id: input_select.dining_room
          option: "Auto"

automation:
  - id: "tayta_announce_arrival"
    alias: Tayta Announce Arrival
    mode: queued
    initial_state: on
    triggers:
      - trigger: state
        entity_id: person.sonia_koht
        from: "not_home"
        to: "home"
        # Hold so detect can confirm; a UniFi blip alone never announces
        for:
          minutes: 1
    conditions:
      # A guest is home
      - condition: state
        entity_id: person.sonia_koht
        state: "home"
      # iPhone detect agrees
      - condition: state
        entity_id: device_tracker.sonia_iphone_detect
        state: "home"
      # We've been home for at least 5 minutes
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
        for:
          minutes: 5
    actions:
      # Announcement script
      - action: script.person_announcement
        data:
          person: tayta
          announcement_type: arrival
      # # Announcement
      # - service: script.voice_announcement
      #   data:
      #     media_players: auto
      #     sound: "arabic-intro"
      #     speech_message: >-
      #       {{
      #         [
      #           "Guess who's here? It's Tayta!",
      #           "Anybody smell kibbeh? Tayta must be here!",
      #           "Tayta is in the house!",
      #           "Marhabah! Tayta is here!",
      #           "Pardon the interruption but Tayta is home!",
      #           "Knock knock. Who's there? Tayta is here!"
      #         ] | random
      #       }}

      # If a guest mode has not been announced, then we'll
      # set initiate guest_mode_announced so we the generic
      # guest mode announcement doesn't fire as well
      - condition: state
        entity_id: input_boolean.guest_mode_announced
        state: "off"
      - action: input_boolean.turn_on
        entity_id: input_boolean.guest_mode_announced

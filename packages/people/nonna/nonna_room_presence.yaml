# Mary (Nonna) Room Presence
#
# Bermuda-sourced BLE room presence for Mary/Nonna.
# State: HA area_id (e.g. "kitchen"), "unknown" (home but not in a proxied room), or "not_home".
# Gated on the Bermuda device_tracker so "not_home" means truly away.
# Entity_id (sensor.mary_room_presence) unchanged — she's already in both presence groups.
#
template:
  - sensor:
      - name: "Mary Room Presence"
        unique_id: mary_room_presence
        state: >-
          {% set devices = ['sensor.nonna_s_iphone_area'] %}
          {% set trackers = ['device_tracker.nonna_s_iphone_bermuda_tracker'] %}
          {% set ns = namespace(home=false, area='unknown') %}
          {% for t in trackers %}
            {% if is_state(t, 'home') %}{% set ns.home = true %}{% endif %}
          {% endfor %}
          {% if not ns.home %}
            not_home
          {% else %}
            {% for d in devices %}
              {% set a = states(d) %}
              {% if a not in ['unknown', 'unavailable', 'not_home', 'none', none] %}
                {% set ns.area = area_id(a) or ns.area %}
              {% endif %}
            {% endfor %}
            {{ ns.area }}
          {% endif %}

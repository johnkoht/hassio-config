# Cristina Room Presence
#
# Bermuda-sourced BLE room presence for Cristina.
# State is the HA area_id of the room she's in (e.g. "office"), or "not_home".
# (Replaces ESPresense mqtt_room + normalization; entity_id unchanged.)
#
template:
  - sensor:
      - name: "Cristina Room Presence"
        unique_id: cristina_room_presence
        state: >-
          {% set devices = ['sensor.cristina_s_iphone_area'] %}
          {% set ns = namespace(area='not_home') %}
          {% for d in devices %}
            {% set a = states(d) %}
            {% if a not in ['unknown', 'unavailable', 'not_home', 'none', none] %}
              {% set ns.area = area_id(a) or ns.area %}
            {% endif %}
          {% endfor %}
          {{ ns.area }}

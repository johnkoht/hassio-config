automation:
  - id: cristina_bed_sleep
    alias: "Cristina Bed - Sleep"
    mode: single
    triggers:
      # Cristina's been in bed for 5 minutes
      - trigger: state
        entity_id: input_select.cristina_sleep_state
        to: "Just Laid Down"
        for:
          minutes: 5
    actions:
      - action: input_select.select_option
        data:
          entity_id: input_select.cristina_sleep_state
          option: "Sleep"

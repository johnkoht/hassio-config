# Cristina Commute - Passing Midway Station
#
# Off by default; armed by the morning arrival. Warns the train is close.
#

automation:
  - id: "cristina_commute_passing_midway_station"
    alias: "Cristina Commute - Passing Midway Station"
    initial_state: off
    triggers:
      - trigger: zone
        entity_id: person.cristina_falbo
        zone: !secret commute_midway_station_zone
        event: enter
    conditions:
      # Cristina is not home
      - condition: state
        entity_id: input_boolean.cristina_home
        state: "off"
      # It's after noon
      - condition: time
        after: "12:00:00"
      # Cristina is commuting boolean is ON
      - condition: state
        entity_id: input_boolean.cristina_commuting
        state: "on"
    actions:
      # Announcement
      - action: script.voice_announcement
        data:
          media_players: auto
          priority: normal
          expires_in: 3
          speech_message: >-
            {{
              [
                "Attention! Mamma's train will arrive within five minutes!",
                "Pardon the interruption, but Mamma's train is arriving soon.",
                "Just a friendly note that Mamma's train is arriving shortly."
              ] | random
            }}

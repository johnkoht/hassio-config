# Cristina Commute - Departed City Station
#
# Off by default; armed by the morning arrival. Announces the train home.
#

automation:
  - id: "cristina_commute_departed_city_station"
    alias: "Cristina Commute - Departed City Station"
    initial_state: off
    triggers:
      - trigger: zone
        entity_id: person.cristina_falbo
        zone: !secret commute_city_station_zone
        event: leave
    conditions:
      # Cristina is not home
      - condition: state
        entity_id: input_boolean.cristina_home
        state: "off"
      # It's after noon
      - condition: time
        after: "12:00:00"
      # Cristina is commuting boolean is ON
      - condition: state
        entity_id: input_boolean.cristina_commuting
        state: "on"
    actions:
      # Announcement
      - action: script.voice_announcement
        data:
          media_players: auto
          priority: normal
          speech_message: >-
            {{
              [
                "Attention! Mamma just left " ~ trigger.zone.attributes.friendly_name ~ ".",
                "Pardon the interruption, but Mamma is on the train headed home.",
                "Just a friendly note that Mamma's train has departed."
              ] | random
            }}

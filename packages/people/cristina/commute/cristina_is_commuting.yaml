# Cristina is Commuting
#
# Flags the commute once Cristina has been at a commute station for 90 seconds.
#

automation:
  - id: "cristina_is_commuting"
    alias: "Cristina is Commuting"
    initial_state: on
    triggers:
      # Location state changed and held for 90s (attribute-only updates ignored)
      - trigger: state
        entity_id: person.cristina_falbo
        to: ~
        for:
          seconds: 90
    conditions:
      # Cristina is not home
      - condition: state
        entity_id: input_boolean.cristina_home
        state: "off"
      # Make sure the commuting boolean is OFF
      - condition: state
        entity_id: input_boolean.cristina_commuting
        state: "off"
      # At one of the commute stations
      - condition: zone
        entity_id: person.cristina_falbo
        zone:
          - !secret commute_midway_station_zone
          - !secret commute_city_station_zone
    actions:
      # Turn ON the boolean
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.cristina_commuting
      # Turn ON the automation to turn off commuting
      - action: automation.turn_on
        target:
          entity_id: automation.cristina_is_not_commuting

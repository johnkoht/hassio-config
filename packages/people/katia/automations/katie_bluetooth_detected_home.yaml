automation:
  - id: "katie_bluetooth_detected_home"
    alias: Katia Bluetooth Detected Home
    mode: queued
    initial_state: on
    triggers:
      # If ESPresense detects her in a room (unavailable/unknown on a
      # template reload is not a sighting)
      - trigger: template
        value_template: "{{ states('sensor.katia_room_presence') not in ['not_home', 'unavailable', 'unknown'] }}"
    conditions:
      # Detected in a room by BLE
      - condition: template
        value_template: "{{ states('sensor.katia_room_presence') not in ['not_home', 'unavailable', 'unknown'] }}"
      # Katia's person object is not home
      - condition: state
        entity_id: person.katia
        state: "not_home"
    actions:
      - action: device_tracker.see
        data:
          dev_id: katias_iphone
          location_name: home

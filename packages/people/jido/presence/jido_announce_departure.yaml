automation:
  - id: "jido_announce_departure"
    alias: Jido Presence - Announce Departure
    mode: queued
    initial_state: on
    triggers:
      # The detect-gated boolean, so a UniFi blip ending doesn't announce
      - trigger: state
        entity_id: input_boolean.jido_home
        to: "off"
        # Hold so a zone-edge flap announces once
        for:
          minutes: 1
    conditions:
      # Not home (a Bayesian flap can turn the boolean off while home)
      - condition: state
        entity_id: person.antoun_koht
        state: "not_home"
      # We've been home for at least 5 minutes
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
        for:
          minutes: 5
    actions:
      # Announcement
      - action: script.person_announcement
        data:
          person: jido
          announcement_type: departure

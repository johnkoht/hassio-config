automation:
  - id: "sylvia_is_away"
    alias: "Sylvia is Away"
    initial_state: on
    triggers:
      # Sylvia not home
      - trigger: state
        entity_id: person.sylvia
        to: "not_home"
      # Handle restarts and reloads of HA
      - trigger: event
        event_type: automation_reloaded
      - trigger: homeassistant
        event: start
    conditions:
      # Didn't just leave
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.sylvia_status
            state: "Just Left"
      # Not detected home
      - condition: state
        entity_id: person.sylvia
        state: "not_home"
    actions:
      - action: input_boolean.turn_off
        entity_id: input_boolean.sylvia_home

automation:
  - id: nino_bed_just_got_up
    alias: "Nino Bed - Just Got Up"
    mode: single
    triggers:
      # Nion's bed is NOT occupied
      - trigger: state
        entity_id: binary_sensor.nino_bed_occupied
        to: "off"
    actions:
      - action: input_select.select_option
        data:
          entity_id: input_select.nino_sleep_state
          option: "Just Got Up"

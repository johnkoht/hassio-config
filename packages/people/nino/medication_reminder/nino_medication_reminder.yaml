#
# Nino Two-Dose Medication Reminder
#
# This package reminds us to give Nino his medication, twice a day.
# Each dose (1 and 2) has its own scheduled time, taken/escalated
# booleans, and 15-minute snooze timer, so the two doses track and
# reset completely independently.
#
#
# Per-Dose Taken Booleans
# Tracks whether each dose has been given today.
#
input_boolean:
  nino_medication_1_taken:
    name: Nino Medication 1 Taken
    icon: mdi:pill
  nino_medication_2_taken:
    name: Nino Medication 2 Taken
    icon: mdi:pill

  #
  # Per-Dose Escalation Booleans
  # Once-per-day guard for the late-dose escalation backstop.
  #
  nino_medication_1_escalated:
    name: Nino Medication 1 Escalated
    icon: mdi:alert
  nino_medication_2_escalated:
    name: Nino Medication 2 Escalated
    icon: mdi:alert

#
# Per-Dose Snooze Timers
# Each timer snoozes its dose's reminder for 15 minutes. `restore: true`
# makes the timer survive an HA restart so a dose in flight isn't lost.
#
timer:
  nino_medication_1_timer:
    name: Nino Medication 1 Timer
    duration: "00:15:00"
    restore: true
    icon: mdi:rewind-15
  nino_medication_2_timer:
    name: Nino Medication 2 Timer
    duration: "00:15:00"
    restore: true
    icon: mdi:rewind-15

#
# Per-Dose Scheduled Times
#
input_datetime:
  nino_medication_1_time:
    name: Nino Medication 1 Time
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"
  nino_medication_2_time:
    name: Nino Medication 2 Time
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "19:00:00"

#
# Pending Dose Resolver
#
# Single source of truth for "which dose is outstanding right now?".
# A dose is in play if it is untaken AND (its scheduled time has
# passed today OR its snooze timer is active). Among in-play doses,
# the one with the latest scheduled time wins; a tie goes to the
# higher dose number. If either scheduled time is unavailable
# (e.g. during HA startup) or no dose is in play, this returns the
# literal string "none" — it must never go unknown/unavailable.
#
template:
  - sensor:
      - name: "Nino Medication Pending Dose"
        unique_id: nino_medication_pending_dose
        icon: mdi:pill-multiple
        state: |-
          {% set dose_1_time = states('input_datetime.nino_medication_1_time') %}
          {% set dose_2_time = states('input_datetime.nino_medication_2_time') %}
          {% set dose_1_ok = dose_1_time not in ['unknown', 'unavailable', '', None] %}
          {% set dose_2_ok = dose_2_time not in ['unknown', 'unavailable', '', None] %}
          {% set dose_1_untaken = not is_state('input_boolean.nino_medication_1_taken', 'on') %}
          {% set dose_2_untaken = not is_state('input_boolean.nino_medication_2_taken', 'on') %}
          {% set dose_1_due = dose_1_ok and now() >= today_at(dose_1_time) %}
          {% set dose_2_due = dose_2_ok and now() >= today_at(dose_2_time) %}
          {% set dose_1_snoozing = is_state('timer.nino_medication_1_timer', 'active') %}
          {% set dose_2_snoozing = is_state('timer.nino_medication_2_timer', 'active') %}
          {% set dose_1_in_play = dose_1_ok and dose_1_untaken and (dose_1_due or dose_1_snoozing) %}
          {% set dose_2_in_play = dose_2_ok and dose_2_untaken and (dose_2_due or dose_2_snoozing) %}
          {% if not dose_1_ok or not dose_2_ok %}
          none
          {% elif dose_1_in_play and dose_2_in_play %}
          {{ 2 if today_at(dose_2_time) >= today_at(dose_1_time) else 1 }}
          {% elif dose_2_in_play %}
          2
          {% elif dose_1_in_play %}
          1
          {% else %}
          none
          {% endif %}

  #
  # Per-Dose Due Binary Sensors
  #
  # Drive the notification popup cards (one per dose). Each is "on"
  # when that dose is in play: untaken AND (its scheduled time has
  # passed today OR its snooze timer is active). The timer clause
  # matters — without it, a card would go invisible for a dose that's
  # genuinely mid-snooze if its scheduled time were edited forward.
  # Same `today_at()` unavailable-input guard as the resolver sensor
  # above.
  #
  - binary_sensor:
      - name: "Nino Medication 1 Due"
        unique_id: nino_medication_1_due
        icon: mdi:pill
        state: |-
          {% set dose_1_time = states('input_datetime.nino_medication_1_time') %}
          {% set dose_1_ok = dose_1_time not in ['unknown', 'unavailable', '', None] %}
          {% set dose_1_untaken = not is_state('input_boolean.nino_medication_1_taken', 'on') %}
          {% set dose_1_due = dose_1_ok and now() >= today_at(dose_1_time) %}
          {% set dose_1_snoozing = is_state('timer.nino_medication_1_timer', 'active') %}
          {{ dose_1_ok and dose_1_untaken and (dose_1_due or dose_1_snoozing) }}
      - name: "Nino Medication 2 Due"
        unique_id: nino_medication_2_due
        icon: mdi:pill
        state: |-
          {% set dose_2_time = states('input_datetime.nino_medication_2_time') %}
          {% set dose_2_ok = dose_2_time not in ['unknown', 'unavailable', '', None] %}
          {% set dose_2_untaken = not is_state('input_boolean.nino_medication_2_taken', 'on') %}
          {% set dose_2_due = dose_2_ok and now() >= today_at(dose_2_time) %}
          {% set dose_2_snoozing = is_state('timer.nino_medication_2_timer', 'active') %}
          {{ dose_2_ok and dose_2_untaken and (dose_2_due or dose_2_snoozing) }}

#
# Automations
#
automation:
  #
  # Nino Medication Reminder
  #
  # Dose-aware reminder. Fires on either dose's scheduled time, on
  # either dose's snooze timer finishing, or on Nino waking up (in
  # case a dose was due while he was asleep). `variables:` resolves
  # which dose the current trigger is about, then every condition
  # and action below operates generically on that dose.
  #
  - id: "nino_medication_reminder"
    alias: "Nino Medication Reminder"
    mode: parallel
    max: 4
    triggers:
      # Dose 1 scheduled time
      - trigger: time
        at: input_datetime.nino_medication_1_time
        id: "1"
      # Dose 2 scheduled time
      - trigger: time
        at: input_datetime.nino_medication_2_time
        id: "2"
      # Dose 1 snooze timer finished — re-prompt
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.nino_medication_1_timer
        id: "1"
      # Dose 2 snooze timer finished — re-prompt
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.nino_medication_2_timer
        id: "2"
      # Nino woke up — catch up on whichever dose is outstanding
      - trigger: state
        entity_id: input_select.nino_sleep_state
        to: "Awake"
        for:
          minutes: 5
        id: "awake"
    variables:
      # Resolve which dose this run is about. The "1"/"2" triggers
      # already know their dose from their id; the wake-up trigger
      # asks the resolver sensor instead.
      dose: >-
        {% if trigger.id in ['1', '2'] %}
          {{ trigger.id }}
        {% else %}
          {{ states('sensor.nino_medication_pending_dose') }}
        {% endif %}
      taken_boolean: "input_boolean.nino_medication_{{ dose }}_taken"
      snooze_timer: "timer.nino_medication_{{ dose }}_timer"
      dose_time: "input_datetime.nino_medication_{{ dose }}_time"
      tag: "nino-medication-dose-{{ dose }}"
    conditions:
      # The resolved dose must be a real dose (guards "none" from the
      # resolver, e.g. nothing outstanding when he wakes up)
      - condition: template
        value_template: "{{ dose | string in ['1', '2'] }}"
      # Only run if this dose has not already been taken
      - condition: template
        value_template: "{{ is_state(taken_boolean, 'off') }}"
      # Only run if this dose's snooze timer is not already running
      - condition: template
        value_template: "{{ is_state(snooze_timer, 'idle') }}"
      # Nino is awake
      - condition: state
        entity_id: input_select.nino_sleep_state
        state: "Awake"
    actions:
      #
      # Voice Announcement (dose-neutral wording)
      #
      # Guarded on the taken boolean: if it flipped on between the
      # conditions block passing and this action running, skip the
      # announcement for a dose that's already been given.
      #
      - alias: "Announce only if this dose is still untaken"
        if:
          - condition: template
            value_template: "{{ is_state(taken_boolean, 'off') }}"
        then:
          - action: script.voice_announcement
            data:
              media_players: auto
              sound: chirp
              priority: high
              speech_message: >-
                {{
                  [
                    "It's time for Nino to take his medication.",
                    "Nino, it's time to take your medication.",
                    "Don't forget to give Nino his medication.",
                  ] | random
                }}

      #
      # Start the snooze timer BEFORE the wait, not after.
      #
      # This is the fix for the restart-durability bug: timers are
      # `restore: true`, so once this timer is running, an HA restart
      # or reload during the 15-minute wait below no longer loses the
      # dose silently — the timer survives and still fires
      # `timer.finished` to re-prompt. Guarded on the taken boolean
      # in case it flipped between the conditions above and here.
      #
      - alias: "Start this dose's snooze timer (restart-durability fix)"
        if:
          - condition: template
            value_template: "{{ is_state(taken_boolean, 'off') }}"
        then:
          - action: timer.start
            target:
              entity_id: "{{ snooze_timer }}"

      #
      # Set the action variables
      #
      - variables:
          action_taken: "{{ 'TAKEN_' ~ context.id }}"
          action_snooze: "{{ 'SNOOZE_' ~ context.id }}"

      #
      # Send the notification
      #
      # Same taken-boolean guard as the announcement above: don't push
      # a "time to take it" prompt for a dose that was just marked
      # taken.
      #
      - alias: "Notify only if this dose is still untaken"
        if:
          - condition: template
            value_template: "{{ is_state(taken_boolean, 'off') }}"
        then:
          - action: script.general_notification
            data:
              title: "Nino's Medication Reminder"
              message: "It's time for Nino to take his medication."
              devices: "all"
              priority: "time-sensitive"
              tag: "{{ tag }}"
              actions:
                - action: "{{ action_taken }}"
                  title: "Medication Taken"
                - action: "{{ action_snooze }}"
                  title: "Snooze 15 Minutes"

      #
      # Wait for a response: the taken boolean flipping on (covers
      # the ZHA shortcut button and any other path that marks the
      # dose taken), the push notification's Taken action, or the
      # push notification's Snooze action.
      #
      # The taken-trigger MUST be a template trigger, not a state
      # trigger — a state trigger's entity_id cannot be templated
      # (cv.entity_ids_or_uuids rejects it at config load).
      #
      - wait_for_trigger:
          - trigger: template
            id: "taken"
            value_template: "{{ is_state(taken_boolean, 'on') }}"
          - trigger: event
            id: "taken_push"
            event_type: mobile_app_notification_action
            event_data:
              action: "{{ action_taken }}"
          - trigger: event
            id: "snooze"
            event_type: mobile_app_notification_action
            event_data:
              action: "{{ action_snooze }}"
        timeout:
          minutes: 15

      #
      # Branch on wait.trigger.id (NOT trigger.id — trigger still
      # refers to this automation's original trigger, not the wait's).
      #
      - choose:
          # Marked taken (boolean flipped, or the push Taken action)
          - conditions:
              - condition: template
                value_template: "{{ wait.trigger is not none and wait.trigger.id in ['taken', 'taken_push'] }}"
            sequence:
              - action: script.nino_medication_taken
                data:
                  dose: "{{ dose }}"
          # Snoozed via the push action — restart the full 15 minutes
          - conditions:
              - condition: template
                value_template: "{{ wait.trigger is not none and wait.trigger.id == 'snooze' }}"
            sequence:
              - alias: "Restart the full 15-minute snooze timer"
                if:
                  - condition: template
                    value_template: "{{ is_state(taken_boolean, 'off') }}"
                then:
                  - action: timer.start
                    target:
                      entity_id: "{{ snooze_timer }}"
        # Timed out with no response (not wait.completed). No action
        # needed: the timer started before the wait is already
        # running and owns re-prompting via its own timer.finished
        # trigger, so this run's job is done.
        default: []

  #
  # Nino Medication Reminder Reset
  #
  # Reset both doses at 3:00am — taken booleans, escalation booleans,
  # and timers, so the next day starts clean for both doses
  # independently.
  #
  - id: "nino_medication_reminder_reset"
    alias: "Nino Medication Reminder Reset"
    triggers:
      - trigger: time
        at: "03:00:01"
    actions:
      # Clear both taken booleans
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.nino_medication_1_taken
            - input_boolean.nino_medication_2_taken
      # Clear both escalation booleans
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.nino_medication_1_escalated
            - input_boolean.nino_medication_2_escalated
      # Cancel both snooze timers
      - action: timer.cancel
        target:
          entity_id:
            - timer.nino_medication_1_timer
            - timer.nino_medication_2_timer

  #
  # Nino Medication Reminder Shortcut Button
  #
  # A physical button that we can press to mark whichever dose is
  # currently outstanding as taken. Relies on the pending-dose
  # resolver sensor (via the script's fallback) rather than tracking
  # a dose itself.
  #
  - id: "nino_medication_reminder_shortcut_button"
    alias: "Nino Medication Reminder Shortcut Button"
    initial_state: on
    triggers:
      - trigger: device
        device_id: d98b081e7991a6e9ce1672128dad93ae
        domain: zha
        type: remote_button_short_press
        subtype: turn_on
    conditions:
      # Only run if some dose is actually outstanding
      - condition: template
        value_template: "{{ states('sensor.nino_medication_pending_dose') != 'none' }}"
    actions:
      # Trigger the script to mark the pending dose as taken
      - action: script.nino_medication_taken

script:
  nino_medication_taken:
    alias: "Nino Medication Taken"
    mode: queued
    fields:
      dose:
        name: Dose
        description: >-
          The dose number to mark as taken. Optional — when omitted,
          falls back to the pending-dose resolver sensor.
        example: "1"
        selector:
          select:
            options:
              - "1"
              - "2"
    variables:
      # Resolve the dose: use what was passed in if it's valid,
      # otherwise fall back to the pending-dose resolver. If neither
      # resolves to a real dose, this ends up "none" and the script
      # below no-ops rather than guessing.
      resolved_dose: >-
        {% set requested = dose | default('', true) | string %}
        {% set fallback = states('sensor.nino_medication_pending_dose') %}
        {{ requested if requested in ['1', '2'] else fallback }}
    sequence:
      - if:
          - condition: template
            value_template: "{{ resolved_dose | string in ['1', '2'] }}"
        then:
          #
          # Mark that he took the medication
          #
          - action: input_boolean.turn_on
            target:
              entity_id: "input_boolean.nino_medication_{{ resolved_dose }}_taken"
          #
          # Cancel that dose's timer
          #
          - action: timer.cancel
            target:
              entity_id: "timer.nino_medication_{{ resolved_dose }}_timer"

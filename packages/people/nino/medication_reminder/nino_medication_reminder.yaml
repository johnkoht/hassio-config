#
# Nino Two-Dose Medication Reminder
#
# This package reminds us to give Nino his medication, twice a day.
# Each dose (1 and 2) has its own scheduled time, taken/escalated
# booleans, and 15-minute snooze timer, so the two doses track and
# reset completely independently.
#
# NOTE: this file still contains the pre-migration single-dose
# automations/script referencing nino_daily_medication_* entities.
# They are rewritten to be dose-aware in a follow-up task; until then
# they intentionally point at helpers that no longer exist below.
#
#
# Per-Dose Taken Booleans
# Tracks whether each dose has been given today.
#
input_boolean:
  nino_medication_1_taken:
    name: Nino Medication 1 Taken
    icon: mdi:pill
  nino_medication_2_taken:
    name: Nino Medication 2 Taken
    icon: mdi:pill

  #
  # Per-Dose Escalation Booleans
  # Once-per-day guard for the late-dose escalation backstop.
  #
  nino_medication_1_escalated:
    name: Nino Medication 1 Escalated
    icon: mdi:alert
  nino_medication_2_escalated:
    name: Nino Medication 2 Escalated
    icon: mdi:alert

#
# Per-Dose Snooze Timers
# Each timer snoozes its dose's reminder for 15 minutes. `restore: true`
# makes the timer survive an HA restart so a dose in flight isn't lost.
#
timer:
  nino_medication_1_timer:
    name: Nino Medication 1 Timer
    duration: "00:15:00"
    restore: true
    icon: mdi:rewind-15
  nino_medication_2_timer:
    name: Nino Medication 2 Timer
    duration: "00:15:00"
    restore: true
    icon: mdi:rewind-15

#
# Per-Dose Scheduled Times
#
input_datetime:
  nino_medication_1_time:
    name: Nino Medication 1 Time
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "07:00:00"
  nino_medication_2_time:
    name: Nino Medication 2 Time
    icon: mdi:clock-time-seven
    has_date: false
    has_time: true
    initial: "19:00:00"

#
# Pending Dose Resolver
#
# Single source of truth for "which dose is outstanding right now?".
# A dose is in play if it is untaken AND (its scheduled time has
# passed today OR its snooze timer is active). Among in-play doses,
# the one with the latest scheduled time wins; a tie goes to the
# higher dose number. If either scheduled time is unavailable
# (e.g. during HA startup) or no dose is in play, this returns the
# literal string "none" — it must never go unknown/unavailable.
#
template:
  - sensor:
      - name: "Nino Medication Pending Dose"
        unique_id: nino_medication_pending_dose
        icon: mdi:pill-multiple
        state: |-
          {% set dose_1_time = states('input_datetime.nino_medication_1_time') %}
          {% set dose_2_time = states('input_datetime.nino_medication_2_time') %}
          {% set dose_1_ok = dose_1_time not in ['unknown', 'unavailable', '', None] %}
          {% set dose_2_ok = dose_2_time not in ['unknown', 'unavailable', '', None] %}
          {% set dose_1_untaken = not is_state('input_boolean.nino_medication_1_taken', 'on') %}
          {% set dose_2_untaken = not is_state('input_boolean.nino_medication_2_taken', 'on') %}
          {% set dose_1_due = dose_1_ok and now() >= today_at(dose_1_time) %}
          {% set dose_2_due = dose_2_ok and now() >= today_at(dose_2_time) %}
          {% set dose_1_snoozing = is_state('timer.nino_medication_1_timer', 'active') %}
          {% set dose_2_snoozing = is_state('timer.nino_medication_2_timer', 'active') %}
          {% set dose_1_in_play = dose_1_ok and dose_1_untaken and (dose_1_due or dose_1_snoozing) %}
          {% set dose_2_in_play = dose_2_ok and dose_2_untaken and (dose_2_due or dose_2_snoozing) %}
          {% if not dose_1_ok or not dose_2_ok %}
          none
          {% elif dose_1_in_play and dose_2_in_play %}
          {{ 2 if today_at(dose_2_time) >= today_at(dose_1_time) else 1 }}
          {% elif dose_2_in_play %}
          2
          {% elif dose_1_in_play %}
          1
          {% else %}
          none
          {% endif %}

# 
# Automations
# 
automation:
  # 
  # Nino Daily Medication Reminder
  # 
  # Send him an actionable notification at 6:45pm. He
  # can snooze it for 15 minutes if needed. If he doesn't respond
  # then it will automatically snooze.
  # 
  - id: "nino_daily_medication_reminder"
    alias: "Nino Daily Medication Reminder"
    trigger:
      # Trigger at 7:30am
      - trigger: time
        at: input_datetime.nino_daily_medication_time
      # Trigger when the timer is finished
      - trigger: event
        event_type: timer.finished
        event_data: 
          entity_id: timer.nino_daily_medication_timer
      # # Nino is awake for 1 hour
      # - trigger: state
      #   entity_id: input_select.nino_sleep_state
      #   to: "Awake"
      #   for:
      #     hours: 1
    conditions:
      # Only run if Nino has not taken his morning medication
      - condition: state
        entity_id: input_boolean.nino_daily_medication_taken
        state: "off"
      # Only run if the timer is idle
      - condition: state
        entity_id: timer.nino_daily_medication_timer
        state: "idle"
      # Nino is awake
      - condition: state
        entity_id: input_select.nino_sleep_state
        state: "Awake"
      # # After 7:30am and before 10:30am
      # - condition: time
      #   after: "07:00:00"
      #   before: "10:30:00"
    actions:
      #  
      #  Voice Announcement
      # 
      - action: script.voice_announcement
        data:
          media_players: auto
          sound: chirp
          priority: high
          speech_message: >-
            {{
              [
                "It's time for Nino to take his medication.",
                "Nino, it's time to take your medication.",
                "Don't forget to give Nino his medication.",
              ] | random
            }}
      # 
      # Set the action variables
      # 
      - variables:
          action_taken: "{{ 'TAKEN_' ~ context.id }}"
          action_snooze: "{{ 'SNOOZE_' ~ context.id }}"

      # 
      # Send the notification
      # 
      - action: script.general_notification
        data:
          title: Nino's Daily Medication Reminder
          message: "It's time for Nino to take his morning medication."
          devices: "all"
          priority: "time-sensitive"
          tag: "nino-morning-medication"
          actions:
            - action: "{{ action_taken }}"
              title: "Medication Taken"
            - action: "{{ action_snooze }}"
              title: "Snooze 15 Minutes"            
      # 
      # Wait for somebody to respond to the actionable notification, either
      # by marking that he's taken the meds or by snoozing.
      # 
      - wait_for_trigger:
          - trigger: event
            id: "push_action"
            event_type: mobile_app_notification_action
            event_data:
              action: "{{ action_taken }}"
          - trigger: event
            id: "push_action"
            event_type: mobile_app_notification_action
            event_data:
              action: "{{ action_snooze }}"
          # Or if button pressed!
          - trigger: device
            id: "button_action"
            device_id: d98b081e7991a6e9ce1672128dad93ae
            domain: zha
            type: remote_button_short_press     
            subtype: turn_on
        timeout:
          minutes: 15

      # 
      # Main Actions
      # 
      # IF we DO NOT RESPOND, then automatically snooze the timer
      # IF we DO RESPOND, then mark that he took the medication and
      # cancel the timer.
      # 
      - if:
          - "{{ not wait.completed }}"
        then:
          # We didn't response so automatically snooze
          - action: timer.start
            entity_id: timer.nino_daily_medication_timer
        else:
          - choose:
              # 
              # IF the physical button was pressed to 
              # mark meds were taken
              # 
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'button_action' }}"
                sequence:
                  - action: script.nino_medication_taken
              # 
              # ElSE IF a push action was taken and it was
              # marked as taken
              # 
              - conditions:
                  - condition: template
                    value_template: "{{ wait.trigger.event.data.action == action_taken }}"
                sequence:
                  - action: script.nino_medication_taken
            #
            # ELSE if they snoozed, then start the timer
            # 
            default:
              - action: timer.start
                entity_id: timer.nino_daily_medication_timer

  # 
  # Nino Medication Reminder Reset
  # 
  # Reset the medication reminder at 3:00am
  # 
  - id: "nino_medication_reminder_reset"
    alias: "Nino Medication Reminder Reset"
    trigger:
      - trigger: time
        at: "03:00:01"
    actions:
      # Turn off the input boolean
      - action: input_boolean.turn_off
        entity_id: input_boolean.nino_daily_medication_taken
      # Cancel the timer
      - action: timer.cancel
        entity_id: timer.nino_daily_medication_timer
      # Turn on the automation
      - action: automation.turn_on
        entity_id: automation.nino_daily_medication_reminder

  # 
  # Nino Medication Reminder Shortcut Button
  # 
  # A physical button that we can press to mark that Nino has taken his
  # morning medication.
  # 
  - id: "nino_medication_reminder_shortcut_button"
    alias: "Nino Medication Reminder Shortcut Button"
    initial_state: on
    triggers:
      - trigger: device
        device_id: d98b081e7991a6e9ce1672128dad93ae
        domain: zha
        type: remote_button_short_press     
        subtype: turn_on
    conditions:
      # Only run if he has not taken his morning medication
      - condition: state
        entity_id: input_boolean.nino_daily_medication_taken
        state: "off"
    actions:
      # Trigger the script to mark that he's taken his medication
      - action: script.nino_medication_taken



script:
  nino_medication_taken:
    alias: "Nino Medication Taken"
    mode: "single"
    sequence:
      # 
      # Mark that he took the medication
      - action: input_boolean.turn_on
        entity_id: input_boolean.nino_daily_medication_taken
      # 
      # Cancel the timer
      - action: timer.cancel
        entity_id: timer.nino_daily_medication_timer
      # 
      # Turn off the automation
      - action: automation.turn_off
        entity_id: automation.nino_daily_medication_reminder

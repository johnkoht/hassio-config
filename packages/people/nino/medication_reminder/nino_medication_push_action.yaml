#
# Nino Medication Push Action
#
# Marks a dose taken from the Medication Taken quick action on the
# reminder push and the critical escalation push. The ids are fixed per
# dose, so a tap works until the 03:00 reset. Only acts while that dose
# is outstanding today (pending, or escalated; not taken, not skipped).
# A leftover push from yesterday does nothing until its dose is outstanding
# again today. Clears both pushes after a tap.
#

automation:
  - id: "nino_medication_push_action"
    alias: "Nino Medication Push Action"
    mode: queued
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "NINO_MEDICATION_TAKEN_1"
        id: "1"
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "NINO_MEDICATION_TAKEN_2"
        id: "2"
    conditions:
      - alias: "The dose is outstanding today (pending or escalated, not taken, not skipped)"
        condition: template
        value_template: >-
          {{ not is_state('input_boolean.nino_medication_' ~ trigger.id ~ '_taken', 'on')
             and not is_state('input_boolean.nino_medication_' ~ trigger.id ~ '_skipped', 'on')
             and (states('sensor.nino_medication_pending_dose') | string == trigger.id | string
                  or is_state('input_boolean.nino_medication_' ~ trigger.id ~ '_escalated', 'on')) }}
    actions:
      - action: script.nino_medication_taken
        data:
          dose: "{{ trigger.id }}"
      - alias: "Clear the escalation push"
        continue_on_error: true
        action: script.clear_notifications
        data:
          devices: all
          tag: "nino-medication-escalation-{{ trigger.id }}"
      - alias: "Clear the reminder push"
        continue_on_error: true
        action: script.clear_notifications
        data:
          devices: all
          tag: "nino-medication-dose-{{ trigger.id }}"

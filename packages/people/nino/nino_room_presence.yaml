# Nino Room Presence
#
# Bermuda-sourced BLE room presence for Nino (iPad; Fitbit dropped — no IRK).
# State is the HA area_id of the room he's in (e.g. "nino_room"), or "not_home".
# (Replaces ESPresense mqtt_room Fitbit + iPad sensors; entity_id unchanged.)
#
# NOTE: sensor.nino_room_presence is NOT yet in group.room_presence_devices — decide
# whether to wire it in (a stationary iPad may report his room as permanently occupied).
#
template:
  - sensor:
      - name: "Nino Room Presence"
        unique_id: nino_room_presence
        state: >-
          {% set devices = ['sensor.nino_s_ipad_area'] %}
          {% set ns = namespace(area='not_home') %}
          {% for d in devices %}
            {% set a = states(d) %}
            {% if a not in ['unknown', 'unavailable', 'not_home', 'none', none] %}
              {% set ns.area = area_id(a) or ns.area %}
            {% endif %}
          {% endfor %}
          {{ ns.area }}

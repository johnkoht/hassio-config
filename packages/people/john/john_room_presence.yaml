# John Room Presence
#
# Bermuda-sourced BLE room presence for John.
# State is the HA area_id of the room he's in (e.g. "office"), or "not_home".
# Sourced from Bermuda's per-device area sensor and converted to area_id via area_id().
# (Replaces the old ESPresense mqtt_room + normalization; entity_id unchanged so every
# downstream consumer + group.room_presence_devices keeps working.)
#
template:
  - sensor:
      - name: "John Room Presence"
        unique_id: john_room_presence
        state: >-
          {% set devices = ['sensor.john_s_iphone_area'] %}
          {% set ns = namespace(area='not_home') %}
          {% for d in devices %}
            {% set a = states(d) %}
            {% if a not in ['unknown', 'unavailable', 'not_home', 'none', none] %}
              {% set ns.area = area_id(a) or ns.area %}
            {% endif %}
          {% endfor %}
          {{ ns.area }}

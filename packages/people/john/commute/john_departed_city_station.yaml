# John Departed City Station
#
# Off by default; armed by the morning arrival. Announces the train home.
#

automation:
  - id: "john_departed_city_station"
    alias: "John Departed City Station"
    initial_state: off
    triggers:
      - trigger: zone
        entity_id: person.john_koht
        zone: !secret commute_city_station_zone
        event: leave
    conditions:
      # John is not home
      - condition: state
        entity_id: input_boolean.john_home
        state: "off"
      # It's after noon
      - condition: time
        after: "12:00:00"
      # John is commuting boolean is ON
      - condition: state
        entity_id: input_boolean.john_commuting
        state: "on"
    actions:
      # Announcement
      - action: script.voice_announcement
        data:
          media_players: auto
          sound: "arcade"
          priority: normal
          speech_message: >-
            {{
              [
                "Attention! Baba just left " ~ trigger.zone.attributes.friendly_name ~ ".",
                "Pardon the interruption, but Baba is on the train headed home.",
                "Just a friendly note that Baba's train has departed."
              ] | random
            }}

# John Passing Midway Station
#
# Off by default; armed by the morning arrival. Warns the train is close.
#

automation:
  - id: "john_passing_midway_station"
    alias: "John Passing Midway Station"
    initial_state: off
    triggers:
      - trigger: zone
        entity_id: person.john_koht
        zone: !secret commute_midway_station_zone
        event: enter
    conditions:
      # John is not home
      - condition: state
        entity_id: input_boolean.john_home
        state: "off"
      # It's after noon
      - condition: time
        after: "12:00:00"
      # John is commuting boolean is ON
      - condition: state
        entity_id: input_boolean.john_commuting
        state: "on"
    actions:
      # Announcement
      - action: script.voice_announcement
        data:
          speech_message: >-
            {{
              [
                "Attention! Baba's train will arrive within five minutes!",
                "Pardon the interruption, but Baba's train is arriving soon.",
                "Just a friendly note that Baba's train is arriving shortly."
              ] | random
            }}
          media_players: "auto"
          sound: "arcade"
          priority: normal
          expires_in: 3

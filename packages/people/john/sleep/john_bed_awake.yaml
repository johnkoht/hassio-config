automation:
  - id: john_bed_awake
    alias: "John Bed - Awake"
    mode: single
    triggers:
      # John's been in bed for 5 minutes
      - trigger: state
        entity_id: input_select.john_sleep_state
        to: "Just Got Up"
        for:
          minutes: 5
    actions:
      - action: input_select.select_option
        data:
          entity_id: input_select.john_sleep_state
          option: "Awake"

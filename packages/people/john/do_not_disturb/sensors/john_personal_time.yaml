template:
  - binary_sensor:
      - name: John Personal Time
        unique_id: john_personal_time
        default_entity_id: binary_sensor.john_personal_time
        state: >-
          {{
            states.calendar.john_block.state == "on" or
            states.calendar.john_ooo.state == "on" or
            states.calendar.john_gsd.state == "on"
          }}

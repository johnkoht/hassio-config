template:
  - binary_sensor:
      - name: John Computer Active
        unique_id: john_computer_active
        default_entity_id: binary_sensor.john_computer_active
        state: >-
          {{
            states.binary_sensor.johns_mbp_2026_active.state == "on"
            or
            states.input_boolean.john_work_laptop_active.state == "on"
          }}

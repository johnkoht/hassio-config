# John laptop camera active
#
# Simple binary sensor to check if the camera is
# NOT in the "Inactive" state, which means it's
# probably being used by the laptop or webcam
template:
  - binary_sensor:
      - name: John laptop camera active
        unique_id: john_laptop_camera_active
        default_entity_id: binary_sensor.john_laptop_camera_active
        state: "{{ states.sensor.johns_macbook_pro_active_camera.state != 'Inactive' }}"
        delay_on: "00:00:05"

# Main Bathroom Lights Reset Manual Toggle
#
# Clears the manual latch when the room empties or goes Off, or the house empties.
#

automation:
  - id: "main_bathroom_lights_reset_manual_toggle"
    alias: "Main Bathroom Lights - Reset Manual Toggle"
    triggers:
      - trigger: state
        entity_id: input_boolean.main_bathroom_occupied
        to: "off"
        for:
          seconds: 30
      - trigger: state
        entity_id: input_select.main_bathroom
        to: "Off"
      - trigger: state
        entity_id: input_boolean.house_occupied
        to: "off"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.main_bathroom_lights_manually_toggled

# Main Bathroom Presence
#
# Names of the people currently detected in the main bathroom area,
# derived from BLE room presence (group.room_presence_devices).
#

template:
  - sensor:
      - name: "Main Bathroom Presence"
        unique_id: main_bathroom_presence
        default_entity_id: sensor.main_bathroom_presence
        state: >-
          {{ expand('group.room_presence_devices')|selectattr('state', 'eq', 'main_bathroom')|map(attribute='name')|list | join(', ') | regex_replace('Room Presence','') }}

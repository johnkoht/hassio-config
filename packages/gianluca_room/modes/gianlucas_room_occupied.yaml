# Gianluca's Room Occupied
#
# Mark Gianluca's room as occupied when the door closes, the ceiling
# light switch paddle is pressed, or the bed becomes occupied.
#
# NOTE: The Inovelli VZM31-SN here is in Smart Bulb Mode, so
# light.gianluca_ceiling_light_switch cannot control the load — but a paddle
# press still updates the switch's own on/off state, making it a valid
# presence signal for the trigger below. Only the state CHECK in the
# condition block was retargeted to the bulb group, since that's the entity
# that actually reflects whether the room's lights are lit.
#

automation:
  - id: "gianlucas_room_occupied"
    initial_state: on
    alias: "Gianluca's room occupied"
    mode: single
    triggers:
      # Gianluca's door is closed
      - trigger: state
        entity_id: binary_sensor.gianlucas_door_sensor_status
        to: "off"
      # Lights turned on (paddle press) — intentionally left on the switch;
      # see header note.
      - trigger: state
        entity_id: light.gianluca_ceiling_light_switch
        to: "on"
      # Bed is occupied
      - trigger: state
        entity_id: binary_sensor.gianluca_bed_occupied
        to: "on"
    conditions:
      # Not currently occupied
      - condition: state
        entity_id: input_boolean.gianlucas_room_occupied
        state: "off"
      - condition: or
        conditions:
          # Gianluca's door is closed
          - condition: state
            entity_id: binary_sensor.gianlucas_door_sensor_status
            state: "off"
          # Gianluca's bulbs are ON
          - condition: state
            entity_id: light.gianluca_bedroom_lights
            state: "on"
          # OR his bed is occupied
          - condition: state
            entity_id: binary_sensor.gianluca_bed_occupied
            state: "on"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.gianlucas_room_occupied

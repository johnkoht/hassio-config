# Mudroom Presence
#
# Names of the people currently detected in the mudroom area,
# derived from BLE room presence (group.room_presence_devices).
#

template:
  - sensor:
      - name: "Mudroom Presence"
        unique_id: mudroom_presence
        default_entity_id: sensor.mudroom_presence
        state: >-
          {{ expand('group.room_presence_devices')|selectattr('state', 'eq', 'mudroom')|map(attribute='name')|list | join(', ') | regex_replace('Room Presence','') }}

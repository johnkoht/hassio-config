# Laundry Room Lights Off
#
# Room Off always turns the lights off. Vacancy only does so while the hand flag is on.
#
automation:
  - id: "laundry_room_lights_off"
    initial_state: on
    alias: "Laundry Room lights off"
    triggers:
      # Laundry Room is Off
      - trigger: state
        entity_id: input_select.laundry_room
        to: "Off"
        id: "room_off"
      # Laundry Room is not occupied
      - trigger: state
        entity_id: input_boolean.laundry_room_occupied
        to: "off"
        id: "vacancy"
      # Lighting automations turn on
      - trigger: state
        entity_id: input_boolean.lighting_automations
        to: "on"
        id: "house_flag_on"
    conditions:
      # Lighting automations must be enabled
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      # Lights are currently on
      - condition: state
        entity_id: light.laundry_room_main_lights
        state: "on"
      - condition: or
        conditions:
          # Room Off always wins
          - condition: trigger
            id: "room_off"
          - condition: and
            conditions:
              - condition: state
                entity_id: input_boolean.laundry_room_lighting_automations
                state: "on"
              - condition: state
                entity_id: input_boolean.laundry_room_occupied
                state: "off"
    actions:
      # Turn the lights OFF
      - action: light.turn_off
        target:
          entity_id: light.laundry_room_main_lights
      # Turn OFF the boolean to notify it's been automatically
      # turned on
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.laundry_room_lights_auto

automation:
  - id: "main_level_dryer_to_idle"
    alias: "Main Level Dryer to Idle"
    initial_state: on
    triggers:
      - trigger: state
        entity_id: input_select.main_level_dryer_status
        to: "Clean"
        for:
          minutes: 5
    conditions:
      # Washer is in status Clean or Finishing
      - condition: or
        conditions:
          # The washing machine is clean
          - condition: state
            entity_id: input_select.main_level_dryer_status
            state: "Clean"
          # The washing machine is Finishing
          # Sometimes the person washing is quick to unload
          # while the washer is still in Finishing mode, although
          # its actually finished.
          - condition: state
            entity_id: input_select.main_level_dryer_status
            state: "Finishing"
    actions:
      - action: input_select.select_option
        data:
          entity_id: input_select.main_level_dryer_status
          option: "Idle"

automation:
  - id: "main_level_dryer_complete"
    alias: "Main Level Dryer Complete"
    initial_state: on
    triggers:
      - trigger: state
        entity_id: input_select.main_level_dryer_status
        to: "Clean"
    conditions:
      - condition: state
        entity_id: input_select.main_level_dryer_status
        state: "Clean"
    actions:
      # Voice Announcement
      - action: script.voice_announcement
        data:
          media_players: auto
          sound: "chirp"
          priority: normal
          expires_in: 120
          speech_message: "The main level dryer finished and is ready to be emptied."
      # Notification
      - action: script.general_notification
        data:
          message: "The main level dryer is finished and ready to be emptied."
          title: "Main Level Drying Machine"
          devices: "all"
          priority: "active"
          tag: "main-level-dryer"
      #
      # Display a message on the TV
      - if:
          - alias: "TV is ON"
            condition: state
            entity_id: media_player.sony_bravia_tv
            state: "on"
        then:
          - action: notify.family_room_sony_bravia_tv
            data:
              message: The main level dryer is finished and ready to be emptied.
              title: Laundry is complete!
              data:
                duration: 5
                position: bottom-right
                fontsize: large
                transparency: 25%
                interrupt: false
                color: black

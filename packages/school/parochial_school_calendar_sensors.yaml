# Parochial School Calendar Sensors
#
# Trigger-based template block covering Gianluca's two calendars:
# calendar.gianluca_school (his personal schedule calendar) and
# calendar.olph_school (OLPH's school-wide events feed, currently empty —
# subscribed to the wrong Blackbaud feed, fixed in Track B).
#
# TWO independent calendar.get_events calls, not one call with two
# targets — same zero-entities-raises hazard that split this task into
# three files in the first place. calendar.olph_school resolving to zero
# events (or the entity itself not existing until Track B re-subscribes
# it) must not also take down the Gianluca-schedule half of this file.
# continue_on_error: true and | default({}) sit on both calls.
#
# Classification pipeline (same shape in district_calendar_sensors.yaml
# and primary_school_calendar_sensors.yaml):
#   1. Fetch today 00:00:00 -> tomorrow 23:59:59, per calendar.
#   2. Dedup on (summary, start) — this is the file where it actually
#      matters: an event mirrored on both Gianluca's schedule calendar
#      and the OLPH events feed would otherwise be announced twice.
#   3. Day-match by OVERLAP, not start-date equality. All-day events are
#      end-exclusive (event.end is the day AFTER the closure ends).
#      Verified necessary: 9 of OLPH's 119 all-day events span multiple
#      days, e.g. "NO SCHOOL - Thanksgiving" (2026-11-25 -> 2026-11-28)
#      and an 11-day Easter Vacation. Start-date equality would report
#      school open for all of Thanksgiving break except day one.
#   4. Tier 1 (actionable) is tested before the Tier 3 (ignored/athletics)
#      filter, so a Tier 1 event isn't eaten by a coincidental "- Game"
#      match in its summary.
#   5. Grade-scope guard — REQUIRED here, not just for consistency. OLPH
#      publishes grade-scoped closures ("Grade 2 - No School", "Grade 8 -
#      No School", "Grades 6 & 7 - No School"). Without this guard,
#      Gianluca's school reads closed on three days he is actually
#      attending, since he's Junior Kindergarten, not grades 2/6/7/8.
#      own_band_match here checks for "jk" / "junior kindergarten" in the
#      summary — a closure naming Gianluca's own band still counts.
#      Anything else grade-scoped fails OPEN into Tier 2 rather than
#      flipping closed_today/closed_tomorrow, so an unrecognized scoped
#      closure stays visible instead of silently misclassifying.
#   6. Athletics filter (' - practice' / ' - game') removes 523 of OLPH's
#      710 events — 73% of the feed, once it's re-subscribed in Track B.
#
# unique_id note: no existing sensor uses the "parochial_school_*" prefix
# (verified via grep -rn "unique_id" packages/), so no collision risk.
# Gianluca's still-live entities are input_boolean.gianluca_school_day
# and binary_sensor.gianluca_is_today_school_day (different domain/name),
# untouched here and not deleted until Track C.
#
# binary_sensor.parochial_school_has_event_today / _tomorrow — verified
# 2026-08-26 against the live OLPH events feed: it does NOT reliably mark
# breaks as no-school. Christmas Eve, all of winter break, and all eleven
# days of Easter Vacation (2027-03-29 through 2027-04-08) carry either no
# events at all or an "Easter Vacation" event whose summary contains no
# "no school" string — closed_today/_tomorrow above read false on every
# one of those days. The reliable signal instead is Gianluca's own
# SCHEDULE calendar (calendar.gianluca_school, resp_gianluca below): it
# carries a recurring "Gianluca School" event on exactly the 189 days he
# actually attends and is absent on every break day, so absence-of-event
# is authoritative independent of whether OLPH's feed says anything.
# These two sensors are built from resp_gianluca only (NOT resp_olph,
# NOT the merged `events` list used by the closure pipeline above) and
# match `'gianluca school' in (summary | lower)` on TIMED (non-all-day)
# events only. Two things his calendar also carries that this must NOT
# match: one-off markers like "Gianluca First Day of JK OLPH" / "Gianluca
# OLPH JK Begins" (summary doesn't contain "gianluca school"), and
# all-day "GIANLUCA - NO SCHOOL" entries (excluded by the timed-only
# filter, since only actual attendance is a timed event). Same overlap
# matching as the classification pipeline above (start[:10] <= day <=
# end[:10] for timed events) — no start-date equality.
#

template:
  - triggers:
      - trigger: time_pattern
        hours: /1
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    actions:
      - alias: "Fetch Gianluca's schedule calendar for today and tomorrow"
        action: calendar.get_events
        continue_on_error: true
        target:
          entity_id:
            # TODO(track-b): move to !secret
            - calendar.gianluca_school
        data:
          start_date_time: "{{ now().strftime('%Y-%m-%d 00:00:00') }}"
          end_date_time: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d 23:59:59') }}"
        response_variable: resp_gianluca
      - alias: "Fetch OLPH's school events calendar for today and tomorrow"
        action: calendar.get_events
        continue_on_error: true
        target:
          entity_id:
            # TODO(track-b): move to !secret
            - calendar.olph_school
        data:
          start_date_time: "{{ now().strftime('%Y-%m-%d 00:00:00') }}"
          end_date_time: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d 23:59:59') }}"
        response_variable: resp_olph
      - variables:
          events: >-
            {{ ((resp_gianluca | default({})).values() | map(attribute='events') | sum(start=[]) | list)
               + ((resp_olph | default({})).values() | map(attribute='events') | sum(start=[]) | list) }}
          today: "{{ now().strftime('%Y-%m-%d') }}"
          tomorrow: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') }}"
          classified: >-
            {%- set ns = namespace(seen=[], out=[]) -%}
            {%- for event in events -%}
              {%- set key = event.summary ~ '|' ~ event.start -%}
              {%- if key not in ns.seen -%}
                {%- set ns.seen = ns.seen + [key] -%}
                {%- set summary_lower = event.summary | lower -%}
                {%- set is_all_day = (event.start | length) == 10 -%}
                {%- set start_date = event.start[:10] -%}
                {%- set end_date = event.end[:10] -%}
                {%- set applies_today = (start_date <= today and today < end_date) if is_all_day else (start_date <= today and today <= end_date) -%}
                {%- set applies_tomorrow = (start_date <= tomorrow and tomorrow < end_date) if is_all_day else (start_date <= tomorrow and tomorrow <= end_date) -%}
                {%- if applies_today or applies_tomorrow -%}
                  {%- set is_grade_scoped = event.summary | regex_search('(grade[s]?\s*[K0-9])|(\d(st|nd|rd|th)\s+grade)|(kindergarten)|(preschool)|(\bEC\b)', ignorecase=True) -%}
                  {%- set own_band_match = event.summary | regex_search('(\bjk\b)|(junior kindergarten)', ignorecase=True) -%}
                  {%- set guard_reject = is_grade_scoped and not own_band_match -%}
                  {%- set no_school = ('no school' in summary_lower) and not guard_reject -%}
                  {%- set last_day_ok = ('last day of school' in summary_lower) and ('last day of school: staff' not in summary_lower) -%}
                  {%- set other_tier1 = ('dismissal' in summary_lower) or ('picture day' in summary_lower) or ('picture retake' in summary_lower) or ('school pictures' in summary_lower) or ('vision and hearing' in summary_lower) or ('parent teacher conference' in summary_lower) or ('family teacher conference' in summary_lower) or ('first day of school' in summary_lower) or last_day_ok or ('school resumes' in summary_lower) or ('classes resume' in summary_lower) or ('no bus' in summary_lower) -%}
                  {%- set is_tier1 = no_school or other_tier1 -%}
                  {%- if is_tier1 -%}
                    {%- set tier = 1 -%}
                  {%- else -%}
                    {%- set is_tier3 = ('board of education' in summary_lower) or ('school advisory board' in summary_lower) or ('parent club' in summary_lower) or ('boe ' in summary_lower) or ('curriculum night' in summary_lower) or ('partners in learning' in summary_lower) or ('preschool screening' in summary_lower) or ('last day of school: staff' in summary_lower) or ('dining for dollars' in summary_lower) or ('photo shoot' in summary_lower) or ('shopping event' in summary_lower) or ('food drive' in summary_lower) or ('annual benefit' in summary_lower) or ('pta meeting' in summary_lower) or (' - practice' in summary_lower) or (' - game' in summary_lower) -%}
                    {%- set tier = 3 if is_tier3 else 2 -%}
                  {%- endif -%}
                  {%- if tier != 3 -%}
                    {%- set ns.out = ns.out + [{'summary': event.summary, 'start': event.start, 'tier': tier, 'closure': no_school, 'applies_today': applies_today, 'applies_tomorrow': applies_tomorrow}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.out }}
          closed_today: "{{ classified | selectattr('closure') | selectattr('applies_today') | list | length > 0 }}"
          closed_tomorrow: "{{ classified | selectattr('closure') | selectattr('applies_tomorrow') | list | length > 0 }}"
          tier1_today: "{{ classified | selectattr('tier', 'eq', 1) | selectattr('applies_today') | map(attribute='summary') | list }}"
          tier1_tomorrow: "{{ classified | selectattr('tier', 'eq', 1) | selectattr('applies_tomorrow') | map(attribute='summary') | list }}"
          tier2_today: "{{ classified | selectattr('tier', 'eq', 2) | selectattr('applies_today') | map(attribute='summary') | list }}"
          tier2_tomorrow: "{{ classified | selectattr('tier', 'eq', 2) | selectattr('applies_tomorrow') | map(attribute='summary') | list }}"
          gianluca_schedule_events: >-
            {{ (resp_gianluca | default({})).values() | map(attribute='events') | sum(start=[]) | list }}
          has_event_flags: >-
            {%- set ns = namespace(today=false, tomorrow=false) -%}
            {%- for event in gianluca_schedule_events -%}
              {%- set is_all_day = (event.start | length) == 10 -%}
              {%- if not is_all_day and 'gianluca school' in (event.summary | lower) -%}
                {%- set start_date = event.start[:10] -%}
                {%- set end_date = event.end[:10] -%}
                {%- if start_date <= today <= end_date -%}
                  {%- set ns.today = true -%}
                {%- endif -%}
                {%- if start_date <= tomorrow <= end_date -%}
                  {%- set ns.tomorrow = true -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ {'today': ns.today, 'tomorrow': ns.tomorrow} }}
          has_event_today: "{{ has_event_flags.today }}"
          has_event_tomorrow: "{{ has_event_flags.tomorrow }}"

    binary_sensor:
      - name: Parochial School Closed Today
        unique_id: parochial_school_closed_today
        state: "{{ closed_today }}"
      - name: Parochial School Closed Tomorrow
        unique_id: parochial_school_closed_tomorrow
        state: "{{ closed_tomorrow }}"
      - name: Parochial School Has Event Today
        unique_id: parochial_school_has_event_today
        state: "{{ has_event_today }}"
      - name: Parochial School Has Event Tomorrow
        unique_id: parochial_school_has_event_tomorrow
        state: "{{ has_event_tomorrow }}"

    sensor:
      - name: Parochial School Events Today
        unique_id: parochial_school_events_today
        state: "{{ now().isoformat() }}"
        attributes:
          actionable: "{{ tier1_today }}"
          informational: "{{ tier2_today }}"
      - name: Parochial School Events Tomorrow
        unique_id: parochial_school_events_tomorrow
        state: "{{ now().isoformat() }}"
        attributes:
          actionable: "{{ tier1_tomorrow }}"
          informational: "{{ tier2_tomorrow }}"

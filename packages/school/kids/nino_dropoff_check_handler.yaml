# Nino Dropoff Check - Action Handler
#
# Handles the two dropoff-check push buttons: confirm at school,
# or confirm home today (sick day).
#

automation:
  - id: "nino_dropoff_check_handler"
    alias: "Nino Dropoff Check - Action Handler"
    mode: parallel
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.action in ['NINO_AT_SCHOOL', 'NINO_HOME_TODAY'] }}"
    actions:
      - choose:
          - conditions:
              - alias: "At school"
                condition: template
                value_template: "{{ trigger.event.data.action == 'NINO_AT_SCHOOL' }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.nino_dropped_off
          - conditions:
              - alias: "Home today"
                condition: template
                value_template: "{{ trigger.event.data.action == 'NINO_HOME_TODAY' }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.nino_home_today

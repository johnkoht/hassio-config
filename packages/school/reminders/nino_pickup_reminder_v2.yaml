# Nino Pickup Reminder (v2)
#
# TODO(track-c): rename to nino_pickup_reminder once the original
# packages/school/nino_school/automations/nino_school_pickup_reminder.yaml
# is deleted — the `_v2` suffix here exists only to avoid an id/filename
# collision with that still-live file during the shadow-run week.
#
# Same dual TTS + push shape as the original, but timed off the new
# derived sensor.nino_pickup_time (dismissal minus
# input_number.nino_pickup_lead_minutes) instead of
# input_datetime.primary_school_pickup_reminder, and gated on the new
# binary_sensor.nino_school_day instead of the legacy
# input_boolean.nino_school_day.
#
# Pickup TTS is NOT suppressed the way departure TTS is (see
# nino_departure_reminder.yaml) — pickup is a same-day, time-critical
# heads-up, not a daily-cadence behavior change, so it ships live from
# day one.
#
# Push routes to John (`devices: jk`) — he's the one who does Nino's
# pickup. Tag typo from the original (`nino_school_pikcup`) is fixed to
# `nino_school_pickup`.
#

automation:
  - id: "nino_pickup_reminder_v2"
    alias: "Nino Pickup Reminder"
    mode: single
    triggers:
      - trigger: time
        at: sensor.nino_pickup_time
    conditions:
      - condition: state
        entity_id: binary_sensor.nino_school_day
        state: "on"
    actions:
      # Call the announcement engine
      - action: script.voice_announcement
        data:
          media_players: auto
          sound: "school-bell-chime"
          priority: normal
          speech_message: >-
            {{
              [
                "School is done! Time to pick up Nino!",
                "Hey there! It's time to pickup Nino from school!",
                "Dont forget to pick up Nino from school!",
                "Quick reminder that school is almost over, time to pick Nino up."
              ] | random
            }}

      # Notify John via push — he does Nino's pickup
      - action: script.general_notification
        data:
          title: "Nino's school is ending soon"
          message: "School will be over soon, it's time to pick up Nino from school."
          devices: "jk"
          priority: "time-sensitive"
          tag: "nino_school_pickup"

# School Morning Reminder
#
# Announces breakfast/get-ready time on school mornings, replacing the
# legacy packages/school/school_day_reminder.yaml (still live, still
# reads input_datetime.school_day_breakfast_reminder_time — a distinct
# input from the one declared below, so the two coexist during the
# shadow-run week without colliding).
#
# input_datetime.school_breakfast_reminder_time deliberately carries NO
# `initial` field — see school_year.yaml for why (it disables state
# restoration across restarts, so any dashboard edit would silently
# revert on the next restart). Real value for the 2026-2027 school
# year (set at runtime via the dashboard): 07:15.
#
# Message branching (both kids / Nino only / Gianluca only, each with
# a random line) is ported from the legacy file's speech_message
# template. The late-start clause now reads
# binary_sensor.primary_school_late_start_today (derived, never
# latched — see primary_school_schedule.yaml) instead of the legacy
# input_boolean.district_late_start_wednesday, and every entity read
# uses is_state() rather than states.<domain>.<object>.state — the
# latter raises UndefinedError on a missing entity and kills the
# entire template render, silencing the whole announcement.
#
# Gating already inside script.voice_announcement (speech_notifications,
# 6am-11pm window, bedtime) is intentionally NOT duplicated here.
#

input_datetime:
  school_breakfast_reminder_time:
    name: School Breakfast Reminder Time
    icon: mdi:clock-start
    has_time: true
    has_date: false

automation:
  - id: "school_morning_reminder"
    alias: "School Morning Reminder"
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.school_breakfast_reminder_time
    conditions:
      # House is occupied
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
      # One of the kids has school
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.nino_school_day
            state: "on"
          - condition: state
            entity_id: binary_sensor.gianluca_school_day
            state: "on"
    actions:
      - action: script.voice_announcement
        data:
          media_players: auto
          sound: "school-bell-chime"
          speech_message: >-
            {% set nino_school = is_state('binary_sensor.nino_school_day', 'on') %}
            {% set gl_school = is_state('binary_sensor.gianluca_school_day', 'on') %}
            {% set late_start = is_state('binary_sensor.primary_school_late_start_today', 'on') %}

            {# Both kids have school today #}
            {% if nino_school and gl_school %}
              {% if late_start %}
                {{
                  [
                    "Hey gang, it's time to eat breakfast and get ready for school! As a reminder, Nino has a late start today!",
                    "Hey there, it's time to get the kids breakfast ready. Today's a school day, but remember that Nino has a late start today.",
                    "Just at reminder that there's school today, so it's time for breakfast. Just an FYI, Nino has late start today!"
                  ] | random
                }}
              {% else %}
                {{
                  [
                    "Hey gang, it's time to eat breakfast and get ready for school!",
                    "Hey there, it's time to get the kids breakfast ready. Today's a school day.",
                    "Just at reminder that there's school today, so it's time for breakfast."
                  ] | random
                }}
              {% endif %}

            {# Only Nino has school #}
            {% elif nino_school %}
              {% if late_start %}
                {{
                  [
                    "Hey Nino, today's a school day and it's time to get ready, but guess what, it's a late start!",
                    "Hey there, it's time to get the Nino's breakfast ready. Just a reminder that today's a late start day!",
                    "Hey Nino! There's school today, but lucky for you it's a late start day!"
                  ] | random
                }}
              {% else %}
                {{
                  [
                    "Hey Nino, today's a school day so it's time to get ready!",
                    "Hey there, it's time to get the Nino's breakfast ready. Today is a school day.",
                    "Hey Nino! Just a reminder that today's a school day so it's time to eat breakfast and get ready."
                  ] | random
                }}
              {% endif %}

            {# Only Gianluca has school #}
            {% elif gl_school %}
              {{
                [
                  "Hey Gianluca, it's time to eat breakfast and get ready for school",
                  "Hey there, it's time to get Gianluca's breakfast ready. Today is a school day.",
                  "Hey Gianluca! Just a reminder that today's a school day so it's time to eat breakfast and get ready."
                ] | random
              }}
            {% endif %}

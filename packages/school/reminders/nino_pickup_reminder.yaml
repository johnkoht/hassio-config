# Nino Pickup Reminder (v2)
#
# Pickup reminder timed off sensor.nino_pickup_time, with dual TTS + push.
# Fires only when Nino's drop-off latched today (the at_school evidence).
# Named "v2" to avoid a collision with the still-live original pickup
# reminder in nino_school/automations/.
#

# The internal id: keeps its _v2 suffix on purpose. Automation entity_ids
# derive from alias:, so automation.nino_pickup_reminder is already correct —
# but id: is the registry unique_id, and changing it would orphan the old row
# and force a _2 suffix on the entity. Not worth it for an invisible field.
automation:
  - id: "nino_pickup_reminder_v2"
    alias: "Nino Pickup Reminder"
    mode: single
    triggers:
      - trigger: time
        at: sensor.nino_pickup_time
    conditions:
      - condition: state
        entity_id: binary_sensor.nino_school_day
        state: "on"
      - condition: state
        entity_id: input_boolean.nino_home_today
        state: "off"
      # Only announce when Nino is actually at school (JK-65): his drop-off
      # latched today. Same evidence as binary_sensor.nino_at_school, minus
      # its dismissal cutoff, which would race this trigger when the lead is 0.
      - alias: "Nino was dropped off at school today"
        condition: template
        value_template: >-
          {%- set d = states.input_boolean.nino_dropped_off -%}
          {{ d is not none and d.state == 'on' and d.last_changed >= today_at('00:00') }}
    actions:
      # Call the announcement engine
      - action: script.voice_announcement
        data:
          media_players: auto
          sound: "school-bell-chime"
          priority: normal
          speech_message: >-
            {{
              [
                "School is done! Time to pick up Nino!",
                "Hey there! It's time to pickup Nino from school!",
                "Dont forget to pick up Nino from school!",
                "Quick reminder that school is almost over, time to pick Nino up."
              ] | random
            }}

      # Notify John via push — he does Nino's pickup
      - action: script.general_notification
        data:
          title: "Nino's school is ending soon"
          message: "School will be over soon, it's time to pick up Nino from school."
          devices: "all"
          priority: "time-sensitive"
          tag: "nino_school_pickup"
          url: /dashboard-kohbo/school

# Nino Departure Reminder
#
# Per-kid departure reminder (TTS + push) timed off Nino's derived
# departure sensor. Push goes to both parents.
#
# `trigger: time` only fires if the sensor's timestamp is still in the
# future when HA evaluates it — a reload after today's time has already
# passed silently skips today.
#

automation:
  - id: "nino_departure_reminder"
    alias: "Nino Departure Reminder"
    mode: single
    triggers:
      - trigger: time
        at: sensor.nino_departure_time
    conditions:
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
      - condition: state
        entity_id: binary_sensor.nino_school_day
        state: "on"
    actions:
      - action: script.voice_announcement
        data:
          media_players: auto
          sound: "school-bell"
          speech_message: >-
            {{
              [
                "Nino, it's time to head out for school!",
                "Hey there, time to get Nino out the door for school!",
                "Reminder: it's time to leave for Nino's school!"
              ] | random
            }}

      - action: script.general_notification
        data:
          title: "Time to leave for Nino's school"
          message: "It's time to head out — Nino needs to leave for school."
          devices: "all"
          priority: "time-sensitive"
          tag: "nino_departure_reminder"

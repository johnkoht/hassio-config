# Christmas Lights Groups
#
# Indoor trees and playroom lights. The front yard plugs are separate
# (switch.front_yard_holiday_decorations) so turning these off leaves them alone.
#

switch:
  - platform: group
    name: "Christmas Lights"
    unique_id: christmas_lights
    entities:
      - switch.christmas_trees
      - switch.christmas_playroom_lights

  - platform: group
    name: "Christmas Trees"
    unique_id: christmas_trees
    entities:
      # Family Room Tree
      - switch.smart_plug_4_switch
      # Dining Room Tree
      - switch.smart_plug_9_switch

  - platform: group
    name: "Christmas Playroom Lights"
    unique_id: christmas_playroom_lights
    entities:
      - switch.smart_plug_15_switch
      - switch.smart_plug_16_switch
      - switch.smart_plug_17_switch
      - switch.smart_plug_18_switch

# Christmas Disabled
#
# Turns the season boolean off outside Dec 1 through Jan 7,
# at 2am and on HA start.
#

automation:
  - id: "christmas_disabled"
    alias: Christmas Disabled
    mode: "single"
    triggers:
      - trigger: homeassistant
        event: start
        id: startup
      # At 2am
      - trigger: time
        at: "02:00:00"
    conditions:
      # Christmas Season Active boolean is ON
      - condition: state
        entity_id: input_boolean.christmas_season_active
        state: "on"
      # Outside 12/1 - 1/07
      - condition: template
        value_template: >
          {% set d = now() %}{{ not (d.month == 12 or (d.month == 1 and d.day <= 7)) }}
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.christmas_season_active

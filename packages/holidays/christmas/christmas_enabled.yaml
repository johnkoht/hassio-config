# Christmas Enabled
#
# Turns the season boolean on from Dec 1 through Jan 7,
# at 2am and on HA start.
#

automation:
  - id: "christmas_enabled"
    alias: Christmas Enabled
    mode: "single"
    triggers:
      - trigger: homeassistant
        event: start
        id: startup
      # At 2am
      - trigger: time
        at: "02:00:00"
    conditions:
      # Between 12/1 - 1/07
      - condition: template
        value_template: >
          {% set d = now() %}{{ d.month == 12 or (d.month == 1 and d.day <= 7) }}
      # Boolean is disabled
      - condition: state
        entity_id: input_boolean.christmas_season_active
        state: "off"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.christmas_season_active

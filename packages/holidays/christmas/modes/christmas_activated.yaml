# Christmas Activated
#
# Turn Christmas mode on once it's dark (or after 4pm), the house is
# occupied and it's Christmas season.
#

automation:
  - id: "christmas_activated"
    alias: "Christmas Activated"
    mode: "single"
    triggers:
      # It's dark outside
      - trigger: state
        entity_id: input_boolean.dark_outside
        to: "on"
      # At 4pm
      - trigger: time
        at: "16:00:00"
      # House turn to Auto mode
      - trigger: state
        entity_id: input_select.house
        to: "Auto"
      # House becomes occupied
      - trigger: state
        entity_id: input_boolean.house_occupied
        to: "on"
      # Christmas season begins
      - trigger: state
        entity_id: input_boolean.christmas_season_active
        to: "on"
      # Hassio reloads/starts
      - trigger: event
        event_type: automation_reloaded
      - trigger: homeassistant
        event: start
    conditions:
      # House is occupied
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
      # It's Christmas season
      - condition: state
        entity_id: input_boolean.christmas_season_active
        state: "on"
      # Christmas is not active
      - condition: state
        entity_id: input_boolean.christmas_active
        state: "off"
      - condition: or
        conditions:
          # It's dark outside
          - condition: state
            entity_id: input_boolean.dark_outside
            state: "on"
          # OR it's after 4pm
          - condition: time
            after: "16:00:00"
      # It's after noon at least. This helps prevent times when
      # the house goes into Auto mode in the morning when it's
      # still dark outside
      - condition: time
        after: "12:00:00"
        before: "22:00:00"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.christmas_active

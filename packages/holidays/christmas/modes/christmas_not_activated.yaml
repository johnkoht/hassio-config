# Christmas NOT Activated
#
# Turn Christmas mode off when the house is away, in bedtime or empty,
# and switch every Christmas light off. Not season-gated.
#

automation:
  - id: "christmas_not_activated"
    alias: "Christmas NOT Activated"
    mode: "single"
    triggers:
      # It's no longer dark outside
      - trigger: state
        entity_id: input_boolean.dark_outside
        to: "off"
      # House turn to Away mode
      - trigger: state
        entity_id: input_select.house
        to: "Away"
      # House turn to Bedtime mode
      - trigger: state
        entity_id: input_select.house
        to: "Bedtime"
      # House is NOT occupied
      - trigger: state
        entity_id: input_boolean.house_occupied
        to: "off"
      # Hassio reloads/starts
      - trigger: event
        event_type: automation_reloaded
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.christmas_active
        state: "on"
      - condition: or
        conditions:
          # House is Away
          - condition: state
            entity_id: input_select.house
            state: "Away"
          # OR house is in Bedtime mode
          - condition: state
            entity_id: input_select.house
            state: "Bedtime"
          # House is NOT occupied
          - condition: state
            entity_id: input_boolean.house_occupied
            state: "off"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.christmas_active

      # Safety net: lights may have been switched on without the boolean
      - action: switch.turn_off
        target:
          entity_id:
            - switch.christmas_lights
            - switch.christmas_trees
            - switch.christmas_playroom_lights
            - switch.front_yard_holiday_decorations
      # UI switch_as_x wrapper over switch.christmas_lights
      - action: light.turn_off
        target:
          entity_id: light.christmas_lights

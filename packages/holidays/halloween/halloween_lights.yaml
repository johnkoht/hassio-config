# Halloween Lights
#
# Power the front yard inflatables on in the morning during
# Halloween season, and off at 10pm or bedtime.
#

automation:
  # Halloween Lights - TURN ON
  #
  - id: "halloween_lights_turn_on"
    alias: Halloween Lights - Turn On
    mode: "single"
    triggers:
      - trigger: homeassistant
        event: start
      # At 8am
      - trigger: time
        at: "08:00:00"
    conditions:
      # Halloween season is ACTIVE
      - condition: state
        entity_id: input_boolean.halloween_season_active
        state: "on"
      # Any plug is currently OFF
      - condition: template
        value_template: >
          {{ ['switch.front_door_smart_plug', 'switch.front_door_smart_plug_2',
              'switch.front_left_smart_plug', 'switch.front_left_smart_plug_2']
             | select('is_state', 'off') | list | count > 0 }}
    actions:
      - action: switch.turn_on
        target:
          entity_id:
            - switch.front_door_smart_plug
            - switch.front_door_smart_plug_2
            - switch.front_left_smart_plug
            - switch.front_left_smart_plug_2

  #
  #
  # Halloween Lights - TURN OFF
  #
  - id: "halloween_lights_turn_off"
    alias: Halloween Lights - Turn Off
    mode: "single"
    triggers:
      - trigger: homeassistant
        event: start
      # At 10pm
      - trigger: time
        at: "22:00:00"
      # Bedtime mode is enabled
      - trigger: state
        entity_id: input_boolean.bedtime
        to: "on"
    conditions:
      # Any plug is currently ON
      - condition: template
        value_template: >
          {{ ['switch.front_door_smart_plug', 'switch.front_door_smart_plug_2',
              'switch.front_left_smart_plug', 'switch.front_left_smart_plug_2']
             | select('is_state', 'on') | list | count > 0 }}
    actions:
      - action: switch.turn_off
        target:
          entity_id:
            - switch.front_door_smart_plug
            - switch.front_door_smart_plug_2
            - switch.front_left_smart_plug
            - switch.front_left_smart_plug_2

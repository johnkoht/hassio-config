# Halloween Lights
#
# Power the front yard inflatables on in the morning during
# Halloween season, and off at 10pm or bedtime. A restart
# re-applies whichever state the time of day calls for.
#

automation:
  # Halloween Lights - TURN ON
  #
  - id: "halloween_lights_turn_on"
    alias: Halloween Lights - Turn On
    mode: "single"
    triggers:
      - trigger: homeassistant
        event: start
        id: startup
      # At 8am
      - trigger: time
        at: "08:00:00"
    conditions:
      # Halloween season is ACTIVE
      - condition: state
        entity_id: input_boolean.halloween_season_active
        state: "on"
      - alias: "A restart only turns them on between 8am and 10pm, outside bedtime"
        condition: or
        conditions:
          - condition: not
            conditions:
              - condition: trigger
                id: startup
          - condition: and
            conditions:
              - condition: time
                after: "08:00:00"
                before: "22:00:00"
              - condition: state
                entity_id: input_boolean.bedtime
                state: "off"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.front_yard_holiday_decorations

  #
  #
  # Halloween Lights - TURN OFF
  #
  - id: "halloween_lights_turn_off"
    alias: Halloween Lights - Turn Off
    mode: "single"
    triggers:
      - trigger: homeassistant
        event: start
        id: startup
      # At 10pm
      - trigger: time
        at: "22:00:00"
      # Bedtime mode is enabled
      - trigger: state
        entity_id: input_boolean.bedtime
        to: "on"
    conditions:
      # Any decoration is currently ON
      - condition: state
        entity_id: switch.front_yard_holiday_decorations
        state: "on"
      - alias: "A restart only turns them off between 10pm and 8am, or at bedtime"
        condition: or
        conditions:
          - condition: not
            conditions:
              - condition: trigger
                id: startup
          - condition: time
            after: "22:00:00"
            before: "08:00:00"
          - condition: state
            entity_id: input_boolean.bedtime
            state: "on"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.front_yard_holiday_decorations

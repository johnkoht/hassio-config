# Office Presence
#
# Names of the people currently detected in the office area,
# derived from BLE room presence (group.room_presence_devices).
#

template:
  - sensor:
      - name: "Office Presence"
        unique_id: office_presence
        default_entity_id: sensor.office_presence
        state: >-
          {{ expand('group.room_presence_devices')|selectattr('state', 'eq', 'office')|map(attribute='name')|list | join(', ') | regex_replace('Room Presence','') }}

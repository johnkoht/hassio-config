# john_s_echo_dot_do_not_disturb_switch
automation:
  - id: "office_echo_dnd_on"
    initial_state: on
    alias: "Office Echo DnD On"
    triggers:
      # Office is in DnD Mode
      - trigger: state
        entity_id: input_select.office
        to: "DnD"
      # Office becomes occupied
      - trigger: state
        entity_id: input_boolean.office_occupied
        to: "on"
    conditions:
      # Office is occupied
      - condition: state
        entity_id: input_boolean.office_occupied
        state: "on"
      # Office is in DnD mode
      - condition: state
        entity_id: input_select.office
        state: "DnD"
      # Computer is ON
      - condition: state
        entity_id: binary_sensor.john_computer_active
        state: "on"
    actions:
      - action: switch.turn_on
        entity_id: switch.john_s_echo_dot_do_not_disturb_switch

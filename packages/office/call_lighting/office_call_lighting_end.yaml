# Office Call Lighting - End
#
# When the call is over (DnD cleared or office vacated), resume
# Adaptive Lighting, then clear the latch flag. No light commands.
#

automation:
  - id: "office_call_lighting_end"
    alias: "Office Call Lighting - End"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_select.office
        to:
          - "Auto"
          - "Off"
        for:
          minutes: 1
        id: left_dnd
      - trigger: state
        entity_id: input_boolean.office_occupied
        to: "off"
        id: vacated
    conditions:
      - alias: "AL is paused for a call"
        condition: state
        entity_id: input_boolean.office_call_al_paused
        state: "on"
    actions:
      - alias: "Resume Adaptive Lighting unless entertainment mode owns the lights"
        if:
          - condition: state
            entity_id: input_boolean.entertainment_mode
            state: "off"
        then:
          - action: switch.turn_on
            target:
              entity_id: switch.adaptive_lighting_office
      - alias: "Clear the latch flag last"
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.office_call_al_paused

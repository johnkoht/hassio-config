# Is John's office currently occupied?
#
binary_sensor:
  - platform: bayesian
    prior: 0.42
    name: "Office Presence"
    probability_threshold: 0.9
    observations:
      # iOS companion app device
      #
      # John's home
      - platform: state
        entity_id: device_tracker.jk_iphone_14
        prob_given_true: 0.30
        prob_given_false: 0.50
        to_state: "home"
      # # John's NOT home
      # - platform: state
      #   entity_id: device_tracker.jk_iphone_14
      #   prob_given_true: 0.05
      #   prob_given_false: 0.21
      #   to_state: "not_home"

      # MacOS app device
      #
      # Computer active
      - platform: state
        entity_id: binary_sensor.john_computer_active
        prob_given_true: 0.80
        prob_given_false: 0.10
        to_state: "on"
      # # Computer NOT active
      # - platform: state
      #   entity_id: binary_sensor.john_computer_active
      #   prob_given_true: 0.15
      #   prob_given_false: 0.86
      #   to_state: "off"

      # Door Status
      #
      # Doors are closed
      - platform: state
        entity_id: binary_sensor.office_doors
        prob_given_true: 0.70
        prob_given_false: 0.40
        to_state: "off"
      # # Doors are open
      # - platform: state
      #   entity_id: binary_sensor.office_doors
      #   prob_given_true: 0.30
      #   prob_given_false: 0.11
      #   to_state: "on"

      # ESPresence
      #
      # Somebody in the room
      - platform: template
        value_template: "{{ expand('group.room_presence_devices')|selectattr('state', 'eq', 'office')|map(attribute='name')|list | length > 0 }}"
        prob_given_true: 0.85
        prob_given_false: 0.10
      # # Nobody detected in the room
      # - platform: template
      #   value_template: "{{ expand('group.room_presence_devices')|selectattr('state', 'eq', 'office')|map(attribute='name')|list | length == 0 }}"
      #   prob_given_true: 0.05
      #   prob_given_false: 0.96

      # Aqara Occupancy
      #
      # Occupany ON
      - platform: state
        entity_id: binary_sensor.office_aqara_occupancy
        prob_given_true: 0.75
        prob_given_false: 0.30
        to_state: "on"
      # # Occupancy OFF
      # - platform: state
      #   entity_id: binary_sensor.office_aqara_occupancy
      #   prob_given_true: 0.30
      #   prob_given_false: 0.79
      #   to_state: "off"

      # Aqara Motion
      #
      # Occupancy ON
      # NOTE: was binary_sensor.office_aqara_motion, which does not exist —
      # this 0.85-weight observation had been contributing nothing.
      - platform: state
        entity_id: binary_sensor.office_aqara_motion_sensor
        prob_given_true: 0.85
        prob_given_false: 0.15
        to_state: "on"

      # Work Hours
      #
      # Work Hours hours is ON
      - platform: state
        entity_id: binary_sensor.work_hours
        prob_given_true: 0.70
        prob_given_false: 0.25
        to_state: "on"
      # # Work Hours hours is OFF
      # - platform: state
      #   entity_id: binary_sensor.work_hours
      #   prob_given_true: 0.30
      #   prob_given_false: 0.86
      #   to_state: "off"

      # Sonos Music
      #
      # Music ON
      - platform: template
        value_template: "{{ states.media_player.sonos_office.state == 'playing' }}"
        prob_given_true: 0.25
        prob_given_false: 0.1
      # # Music OFF
      # - platform: template
      #   value_template: "{{ states.media_player.sonos_office.state != 'playing' }}"
      #   prob_given_true: 0.80
      #   prob_given_false: 0.96

      # Office Lights
      #
      # REMOVED — this was a feedback loop. The lighting automations turn the
      # lights on, "lights on" pushed this sensor toward occupied, occupied
      # kept the lights on, and the room could never go unoccupied. With the
      # computer-active (0.80) and work-hours (0.70) observations that was
      # enough on its own to hold the sensor above the 0.9 threshold all day.
      #
      # - platform: state
      #   entity_id: light.office_ceiling_bulbs
      #   prob_given_true: 0.55
      #   prob_given_false: 0.2
      #   to_state: "on"

      # Office Guest Mode
      #
      # Guest Mode ON
      - platform: state
        entity_id: input_boolean.office_guest_mode
        prob_given_true: 0.15
        prob_given_false: 0.95
        to_state: "on"
      # # Guest Mode OFF
      # - platform: state
      #   entity_id: input_boolean.office_guest_mode
      #   prob_given_true: 0.05
      #   prob_given_false: 0.96
      #   to_state: "off"

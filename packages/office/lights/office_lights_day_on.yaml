# Office Lights Day On
#
# Automatically turn the lights on when it gets too dark
# in the room, or from bad weather.
#
# Targets the Hue bulbs, not the Inovelli — see office_lights_on.yaml.
#

automation:
  - id: "office_lights_day_on"
    alias: "Office lights Day On"
    mode: single
    triggers:
      # Lighting is low in the office
      - trigger: numeric_state
        entity_id: sensor.office_aqara_illuminance
        below: 150
        for:
          minutes: 3
      - trigger: numeric_state
        entity_id: sensor.office_aqara_illuminance
        below: 125
        for:
          minutes: 3
      - trigger: numeric_state
        entity_id: sensor.office_aqara_illuminance
        below: 100
        for:
          minutes: 5
      # The weather is bad outside
      - trigger: state
        entity_id: input_boolean.bad_weather
        to: "on"
      # Lighting automations enabled
      - trigger: state
        entity_id: input_boolean.lighting_automations
        to: "on"
      - trigger: state
        entity_id: input_boolean.office_lighting_automations
        to: "on"
    conditions:
      # Lighting automations must be enabled
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      - condition: state
        entity_id: input_boolean.office_lighting_automations
        state: "on"
      # Office is occupied
      - condition: state
        entity_id: input_boolean.office_occupied
        state: "on"
      # Office is Auto or DnD
      - condition: or
        conditions:
          - condition: state
            entity_id: input_select.office
            state: "Auto"
          - condition: state
            entity_id: input_select.office
            state: "DnD"
      # Light is low
      - condition: numeric_state
        entity_id: sensor.office_aqara_illuminance
        below: 150
      # Lights are currently off
      - condition: state
        entity_id: light.office_ceiling_bulbs
        state: "off"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.office_ceiling_bulbs

      # Flag that this was an automatic turn-on
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.office_lights_auto

# Office Camera Light Off
#
#
automation:
  - id: "office_camera_light_off"
    initial_state: on
    alias: "Office Camera Light Off"
    triggers:
      # Mac camera goes off
      - trigger: state
        entity_id: binary_sensor.johns_mbp_2026_camera_in_use
        to: "off"
        for:
          seconds: 4
      # Office no longer occupied
      - trigger: state
        entity_id: input_boolean.office_occupied
        to: "off"
      # Laptop is turned off
      - trigger: state
        entity_id: binary_sensor.john_computer_active
        to: "off"
    conditions:
      # Mac camera is not on (unavailable counts as off)
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.johns_mbp_2026_camera_in_use
            state: "on"
      # Camera light is ON
      - condition: state
        entity_id: light.office_el_gato_light
        state: "on"
    actions:
      - action: light.turn_off
        entity_id: light.office_el_gato_light

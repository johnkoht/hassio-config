# Office Camera Light On
#
# When I'm in my office and my camera comes on,
# turn the El Gato light on
#
automation:
  - id: "office_camera_light_on"
    initial_state: on
    alias: "Office Camera Light On"
    triggers:
      # Mac camera goes on
      - trigger: state
        entity_id: binary_sensor.johns_mbp_2026_camera_in_use
        to: "on"
        for:
          seconds: 2
      # John's room presence is the office
      - trigger: state
        entity_id: sensor.john_room_presence
        to: "office"
    conditions:
      # Office is occupied
      - condition: state
        entity_id: input_boolean.office_occupied
        state: "on"
      # Mac camera is on
      - condition: state
        entity_id: binary_sensor.johns_mbp_2026_camera_in_use
        state: "on"
      # John's in the office
      - condition: state
        entity_id: sensor.john_room_presence
        state: "office"
      # Camera light is off
      - condition: state
        entity_id: light.office_el_gato_light
        state: "off"
    actions:
      - action: light.turn_on
        entity_id: light.office_el_gato_light

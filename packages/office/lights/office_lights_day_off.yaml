# Office Lights Day Off
#
# If the lights turned on due to poor lighting or bad weather,
# turn them off again when the lighting or weather improves.
#

automation:
  - id: "office_lights_day_off"
    alias: "Office lights day off"
    mode: single
    triggers:
      # Light is bright enough
      - trigger: numeric_state
        entity_id: sensor.office_aqara_illuminance
        above: 151
        for:
          minutes: 10
      - trigger: numeric_state
        entity_id: sensor.office_aqara_illuminance
        above: 250
        for:
          minutes: 5
      # The weather isn't bad anymore
      - trigger: state
        entity_id: input_boolean.bad_weather
        to: "off"
    conditions:
      # Lighting automations are enabled
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      - condition: state
        entity_id: input_boolean.office_lighting_automations
        state: "on"
      # Office is not in DnD mode
      - condition: template
        value_template: "{{ not is_state('input_select.office','DnD') }}"
      # The weather isn't bad anymore
      - condition: state
        entity_id: input_boolean.bad_weather
        state: "off"
      # Room is bright enough
      - condition: numeric_state
        entity_id: sensor.office_aqara_illuminance
        above: 151
    actions:
      - action: light.turn_off
        target:
          entity_id: light.office_ceiling_bulbs

      # Clear the auto flag
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.office_lights_auto

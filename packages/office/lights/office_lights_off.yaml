# Office Lights Off
#
# Automatically turn the lights off when the Office
# goes Off or becomes unoccupied.
#
# NOTE: office_all_lights now contains the ceiling BULBS rather than the
# Inovelli. In Smart Bulb Mode turning the switch "off" leaves the bulbs lit,
# which is why this used to leave the room on.
#

automation:
  - id: "office_lights_off"
    alias: "Office lights off"
    mode: single
    triggers:
      # Office is Off
      - trigger: state
        entity_id: input_select.office
        to: "Off"
      # Office is not occupied
      - trigger: state
        entity_id: input_boolean.office_occupied
        to: "off"
      # Lighting automations turn on
      - trigger: state
        entity_id: input_boolean.lighting_automations
        to: "on"
    conditions:
      # Office lighting automations must be enabled
      - condition: state
        entity_id: input_boolean.office_lighting_automations
        state: "on"
      # Office is Off, or nobody is in it
      # (brightness-based turn-off is office_lights_day_off's job)
      - condition: or
        conditions:
          - condition: state
            entity_id: input_select.office
            state: "Off"
          - condition: state
            entity_id: input_boolean.office_occupied
            state: "off"
    actions:
      # Turn off the lights
      - action: light.turn_off
        target:
          entity_id: light.office_all_lights

      # Clear the auto flag
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.office_lights_auto

# Office Lights On
#
# Turn the lights on when the Office becomes occupied,
# or 15 mins after sunset, if it's dull in the room.
#
# Targets light.office_ceiling_bulbs (the Hue bulbs) rather than the Inovelli.
# In Smart Bulb Mode the switch cannot control the load, and Adaptive Lighting
# only intercepts turn_on calls aimed at the bulbs themselves.
#

automation:
  - id: "office_lights_on"
    alias: "Office lights On"
    mode: single
    triggers:
      # Office becomes occupied
      - trigger: state
        entity_id: input_boolean.office_occupied
        to: "on"
      # 15 mins after sunset
      - trigger: sun
        event: sunset
        offset: "00:15:00"
    conditions:
      # Lighting automations must be enabled
      - condition: state
        entity_id: input_boolean.lighting_automations
        state: "on"
      - condition: state
        entity_id: input_boolean.office_lighting_automations
        state: "on"
      # Office is occupied
      - condition: state
        entity_id: input_boolean.office_occupied
        state: "on"
      # Office is Auto or DnD
      - condition: or
        conditions:
          - condition: state
            entity_id: input_select.office
            state: "Auto"
          - condition: state
            entity_id: input_select.office
            state: "DnD"
      # Light is low
      - condition: numeric_state
        entity_id: sensor.office_aqara_illuminance
        below: 150
      # Lights are currently off
      - condition: state
        entity_id: light.office_ceiling_bulbs
        state: "off"
    actions:
      # Bare turn_on so Adaptive Lighting sets brightness/colour temp
      - action: light.turn_on
        target:
          entity_id: light.office_ceiling_bulbs

      # Flag that this was an automatic turn-on
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.office_lights_auto

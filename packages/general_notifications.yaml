# General Notification
#
#
# USAGE:
# action: script.general_notification
# data:
#   title: "Home Assistant"
#   message: "Hello, world!"
#   devices: ["notify.mobile_app_jk_2"] or "all"
#   priority: "active"
#   tag: ""
#   group: "example-notification-group"
#   actions:  # Optional - for actionable notifications
#     - action: "ACTION_ID_1"
#       title: "Action 1"
#     - action: "ACTION_ID_2"
#       title: "Action 2"
#   url: "/dashboard-kohbo/security-cameras#front_door_camera"  # Optional - tap target
#
# url is sent as `url` (iOS) and `clickAction` (Android) from one value, and
# both keys are left out when it is empty. A popup hash only opens on the view
# that includes it. tests/test_notification_deep_links.py checks every link and
# fails on a push with no url unless its file is in
# tests/fixtures/notification_url_exempt.yaml (with a reason).
#

#
# Priority options:
# - active: general notification default
# - passive: logging purposes
# - time-sensitive: time sensitive
# - critical: critical iOS alert (always sent, even when notification_level is None)
#
# important: true lets a push through the Important level without raising its
# priority, so it stays a normal iOS interruption. None still blocks it.
#

input_select:
  notification_level:
    name: Notification Level
    options:
      # All priority option levels
      - "All"
      # Only time sensitive, critical, or important: true
      - "Important"
      # Turn off push notifications
      - "None"

script:
  #
  #
  # Clear Notifications
  #
  clear_notifications:
    alias: "Clear Notifications"
    mode: "queued"
    sequence:
      - action: >
          {% if devices == "all"  %}
            notify.ios_family
          {% elif devices == "jk" %}
            notify.mobile_app_jk_2
          {% elif devices == "cfalb" %}
            notify.mobile_app_cfalb
          {% endif %}
        data:
          message: "clear_notification"
          data:
            tag: "{{ tag }}"

  #
  #
  # General Notification
  #
  general_notification:
    alias: General Notification
    # Parallel so a burst of camera pushes can't queue (and drop) a critical alert
    mode: "parallel"
    max: 25
    icon: mdi:message-alert

    fields:
      #
      #
      # Devices
      #
      devices:
        name: Devices
        description: The devices to send the notification to
        example: "all"
        default: "all"
        required: true
        selector:
          select:
            options:
              - all
              - jk
              - cfalb
      #
      #
      # Title
      #
      title:
        name: Title
        description: The title of the push notification
        example: "Home Assistant"
        default: "Home Assistant"
        required: true
        selector:
          text:
            type: text
      #
      #
      # Message
      #
      message:
        name: Message
        description: The message of the push notification
        example: "Hello, world!"
        default: "Hello, world!"
        required: true
        selector:
          text:
            type: text
      #
      #
      # Priority
      #
      priority:
        name: Priority
        description: The priority of the push notification
        example: "active"
        default: "active"
        selector:
          select:
            options:
              - active
              - passive
              - time-sensitive
              - critical
      #
      #
      # Important
      #
      important:
        name: Important
        description: Let this push through the Important level without changing its priority
        example: false
        default: false
        selector:
          boolean:
      #
      #
      # Tag
      #
      tag:
        name: Tag
        description: The tag of the push notification
        example: "front_door_person_alert"
        default: "push_1234567890"
        selector:
          text:
            type: text
      #
      #
      # Image
      #
      image:
        name: Image
        description: An image to display in the push notification, typically used for camera alerts
        example: "https://example.com/image.png"
        default: "https://example.com/image.png"
        selector:
          text:
            type: text
      #
      #
      # Entity ID
      #
      entity_id:
        name: Camera Entity ID
        description: Provide the entity ID of a camera that can be used to stream directly from the notification
        example: "camera.camera_proxy_camera_front_door_camera_high_resolution_channel"
        default: "camera.camera_proxy_camera_front_door_camera_high_resolution_channel"
        selector:
          text:
            type: text
      #
      #
      # Actions
      #
      actions:
        name: Actionable Notification Actions
        description: Actions to display in the push notification
        example: "{{ actions }}"
        default: "{{ actions }}"
      #
      #
      # URL
      #
      url:
        name: URL
        description: If provided, the notification will route to this URL
        example: /dashboard-kohbo/home
        default: /dashboard-kohbo/home
        selector:
          text:
            type: text


    #
    # Sequence
    #
    sequence:
      - alias: "Set up variables"
        variables:
          tag: "{{ tag | default('push_' ~ now().timestamp() | int) }}"
          image: "{{ image | default('') }}"
          entity_id: "{{ entity_id | default('') }}"
          url: "{{ url | default('') }}"
          # Link keys, only when a url was given: iOS reads url, Android clickAction
          link: "{{ {'url': url, 'clickAction': url} if url | length > 0 else {} }}"
          priority: "{{ priority if priority is defined and priority | length else 'active' }}"

      # Make sure notifications are not disabled. A critical push always goes
      # out: an alarm or fire must reach everyone whatever the level is.
      - alias: "Notifications are on, or the push is critical"
        condition: template
        value_template: "{{ priority == 'critical' or states.input_select.notification_level.state != 'None' }}"

      - condition: or
        conditions:
          # Critical always passes
          - condition: template
            value_template: "{{ priority == 'critical' }}"
          # If notification level is all
          - condition: state
            entity_id: input_select.notification_level
            state: "All"
          # OR important notifications only is enabled and the
          # priority is time sensitive or critical, or important is true
          - condition: template
            value_template: >-
              {%
                if states.input_select.notification_level.state == 'Important'
                and (priority == "critical" or priority == "time-sensitive"
                     or (important is defined and important))
              %}
                true
              {% else %}
                false
              {% endif %}

      #
      # Send the push notification
      #
      - action: >
          {% if devices == "all"  %}
            notify.ios_family
          {% elif devices == "jk" %}
            notify.mobile_app_jk_2
          {% elif devices == "cfalb" %}
            notify.mobile_app_cfalb
          {% endif %}
        data:
          message: "{{ message }}"
          title: "{{ title }}"
          data: >-
            {{ {
              'tag': tag,
              'image': image,
              'entity_id': entity_id,
              'push': {'interruption-level': priority},
              'actions': actions | default('')
            } | combine(link) }}


automation:
  #
  - id: "notifications_activate_important_only"
    alias: "Notifications - Activate Important Only"
    mode: "single"
    triggers:
      # Bedtime mode is ON
      - trigger: state
        entity_id: input_boolean.bedtime
        to: "on"
      # Entertainment mode is ON
      - trigger: state
        entity_id: input_boolean.entertainment_mode
        to: "on"
      # House is no longer occupied
      - trigger: state
        entity_id: input_boolean.house_occupied
        to: "off"
    conditions:
      # Notification level is ALL
      - condition: state
        entity_id: input_select.notification_level
        state: "All"
    actions:
      # Set the notification level to "Important"
      - action: input_select.select_option
        data:
          entity_id: input_select.notification_level
          option: "Important"

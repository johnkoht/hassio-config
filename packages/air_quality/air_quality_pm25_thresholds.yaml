# PM2.5 AQI Thresholds
#
# Set variables to track threshold breaches
# to set AQI state and automate purifiers.
# No initial: so dashboard edits survive restarts (README.md).
#
input_number:
  #
  # PM2.5 Acceptable Range
  #
  pm25_acceptable:
    name: PM2.5 Acceptable
    min: 0
    max: 34
    unit_of_measurement: µg/m³
    mode: box
    icon: phu:pm2-5

  #
  # PM2.5 Moderate Range
  #
  pm25_moderate:
    name: PM2.5 Moderate
    min: 0
    max: 54
    unit_of_measurement: µg/m³
    mode: box
    icon: phu:pm2-5

  #
  # PM2.5 Poor Range
  #
  pm25_poor:
    name: PM2.5 Poor
    min: 0
    max: 149
    unit_of_measurement: µg/m³
    mode: box
    icon: phu:pm2-5

  #
  # PM2.5 Hazardous Range
  #
  pm25_hazardous:
    name: PM2.5 Hazardous
    min: 0
    max: 5500
    unit_of_measurement: µg/m³
    mode: box
    icon: phu:pm2-5

# Toxic Chemicals AQI Thresholds
#
# Set variables to track threshold breaches
# to set AQI state and automate purifiers
#
input_number:
  #
  # TVOCs Acceptable Range
  #
  tvoc_acceptable:
    name: TVOCs Acceptable
    min: 0
    max: 499
    unit_of_measurement: ppb
    mode: box
    icon: phu:voc

  #
  # TVOCs Moderate Range
  #
  tvoc_moderate:
    name: TVOCs Moderate
    min: 0
    max: 2999
    unit_of_measurement: ppb
    mode: box
    icon: phu:voc

  #
  # TVOCs Poor Range
  #
  tvoc_poor:
    name: TVOCs Poor
    min: 0
    max: 24999
    unit_of_measurement: ppb
    mode: box
    icon: phu:voc

  #
  # TVOCs Hazardous Range
  #
  tvoc_hazardous:
    name: TVOCs Hazardous
    min: 0
    max: 55000
    unit_of_measurement: ppb
    mode: box
    icon: phu:voc

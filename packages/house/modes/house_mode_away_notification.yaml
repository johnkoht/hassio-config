# House Mode Away Notification
#
# When the house goes to Away, wait for the alarm to arm, then send one
# normal-priority push saying whether it did. Skipped if someone is back.
#
automation:
  - id: "house_mode_away_notification"
    alias: "House Mode - Away Notification"
    initial_state: on
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.house
        to: "Away"
        not_from:
          - "unknown"
          - "unavailable"
    actions:
      - alias: "Wait for the alarm to arm (it arms 1 min into Away)"
        wait_template: "{{ states('alarm_control_panel.alarmo').startswith('armed') }}"
        timeout: "00:03:00"
        continue_on_timeout: true
      - alias: "Still Away"
        condition: state
        entity_id: input_select.house
        state: "Away"
      - action: script.general_notification
        data:
          title: "House is empty"
          message: >
            {% if states('alarm_control_panel.alarmo').startswith('armed') %}
              Everyone's out and the alarm is armed.
            {% else %}
              Everyone's out, but the alarm isn't armed.
            {% endif %}
          devices: "jk"
          priority: "active"
          tag: "house-mode-away"
          url: /dashboard-kohbo/security-alarm-panel

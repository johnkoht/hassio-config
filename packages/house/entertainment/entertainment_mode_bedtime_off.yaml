# Entertainment Mode Bedtime Off
#
# End entertainment mode when bedtime starts. The boolean survives a restart,
# so a forgotten mode would otherwise last until the house empties.
#

automation:
  - id: "entertainment_mode_bedtime_off"
    initial_state: on
    alias: "Entertainment Mode - Bedtime Off"
    triggers:
      # Bedtime starts
      - trigger: state
        entity_id: input_boolean.bedtime
        to: "on"
    conditions:
      # Entertainment mode is on
      - condition: state
        entity_id: input_boolean.entertainment_mode
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.entertainment_mode

#
# Powder Room Room Sensor
#
template:
  - sensor:
      - name: "Powder Room"
        unique_id: powder_room_room
        default_entity_id: sensor.powder_room_room
        state: "{{ states('input_boolean.powder_room_occupied') }}"
        attributes:
          mode: "{{ states('input_select.powder_room') | default('Auto') }}"
          icon: "mdi:toilet"
          permalink: "/dashboard-kohbo/rooms-powder-room"
          temperature: ""
          humidity: ""
          aqi: ""
          last_changed: >
            {% if states.input_boolean.powder_room_occupied.last_changed %}
              {{ states.input_boolean.powder_room_occupied.last_changed.isoformat() }}
            {% else %}
              {{ now().isoformat() }}
            {% endif %}
          occupied_duration_seconds: >
            {% if is_state('input_boolean.powder_room_occupied', 'on') %}
              {{ (as_timestamp(now()) - as_timestamp(states.input_boolean.powder_room_occupied.last_changed)) | int }}
            {% else %}
              0
            {% endif %}
          occupied_duration_minutes: >
            {% if is_state('input_boolean.powder_room_occupied', 'on') %}
              {{ ((as_timestamp(now()) - as_timestamp(states.input_boolean.powder_room_occupied.last_changed)) / 60) | int }}
            {% else %}
              0
            {% endif %}
          people: "{{ [] }}"
          people_count: "0"

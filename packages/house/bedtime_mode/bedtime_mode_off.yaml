# Bedtime Mode Off
#
# End bedtime in the morning once an adult at home is up, or when no
# adult is home. Only between 05:00 and 12:00.
#
automation:
  - id: "bedtime_mode_off"
    alias: "Bedtime Mode - Off"
    initial_state: on
    triggers:
      # An adult got out of bed
      - trigger: state
        entity_id:
          - input_boolean.john_is_in_bed
          - input_boolean.cristina_in_bed
        to: "off"
      # An adult is marked awake
      - trigger: state
        entity_id:
          - input_boolean.cristina_is_awake
          - input_boolean.john_is_awake
        to: "on"
      # At 6:30am
      - trigger: time
        at: "06:30:00"
      # At sunrise
      - trigger: sun
        event: sunrise
    conditions:
      - condition: time
        after: "05:00:00"
        before: "12:00:00"
      - alias: "An adult at home is awake, or no adult is home"
        condition: template
        value_template: >-
          {% set john = states('person.john_koht') %}
          {% set cristina = states('person.cristina_falbo') %}
          {% set unsure = ['unknown', 'unavailable'] %}
          {% set nobody_home = john not in unsure + ['home']
                               and cristina not in unsure + ['home'] %}
          {% set awake = (john == 'home' and is_state('input_boolean.john_is_awake', 'on'))
                         or (cristina == 'home' and is_state('input_boolean.cristina_is_awake', 'on')) %}
          {{ nobody_home or awake }}
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedtime

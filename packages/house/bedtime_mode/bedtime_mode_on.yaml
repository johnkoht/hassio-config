# Bedtime Mode On
#
# When everybody home is in bed, because the last person
# got into bed or an adult left, turn bedtime mode on.
#
automation:
  - id: "bedtime_mode_on"
    initial_state: on
    alias: "Bedtime Mode - On"
    triggers:
      # Someone got into bed
      - trigger: state
        entity_id:
          - input_boolean.john_is_in_bed
          - input_boolean.cristina_in_bed
          - input_boolean.gianluca_in_bed
          - input_boolean.nino_in_bed
        to: "on"
        for:
          seconds: 10
      # An adult left and everybody still home is in bed
      - trigger: state
        entity_id:
          - person.john_koht
          - person.cristina_falbo
        from: "home"
        not_to:
          - "unknown"
          - "unavailable"
        for:
          minutes: 2
    conditions:
      # House is occupied
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
      # Everybody home is in bed, or the adults are
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.everybody_in_bed
            state: "on"
          - condition: state
            entity_id: binary_sensor.adults_in_bed
            state: "on"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedtime

# Crazy Mode - Cleanup On Start
#
# A restart mid-run leaves the phase set and Adaptive Lighting off. Reset
# the phase, turn the active zone's Adaptive Lighting back on, clear what we
# latched. Sonos and lights stay as they are: the snapshot did not survive.
#

automation:
  - id: "crazy_mode_cleanup_on_start"
    alias: "Crazy Mode - Cleanup On Start"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - alias: "A run was interrupted"
        condition: not
        conditions:
          - condition: state
            entity_id: input_select.crazy_mode_phase
            state: "Off"
    actions:
      - alias: "Template entities load late after a start; give the zone config a minute"
        wait_template: >-
          {{ state_attr('sensor.crazy_mode_zone_config',
             'basement' if is_state('input_text.crazy_mode_active_zone', 'Basement') else 'main_floor') is mapping }}
        timeout: 60
        continue_on_timeout: true
      - variables:
          cfg: >-
            {{ state_attr('sensor.crazy_mode_zone_config',
               'basement' if is_state('input_text.crazy_mode_active_zone', 'Basement') else 'main_floor') }}
      - alias: "Without a config the zone's switches are unknown; say so"
        if:
          - condition: template
            value_template: "{{ cfg is not mapping }}"
        then:
          - action: system_log.write
            data:
              level: warning
              logger: crazy_mode
              message: "Crazy Mode cleanup ran without a zone config; Adaptive Lighting was not turned back on"
      - alias: "Adaptive Lighting back on (a zone with none has nothing to turn on)"
        if:
          - condition: template
            value_template: "{{ cfg is mapping and cfg.al_switches | length > 0 }}"
        then:
          - action: switch.turn_on
            continue_on_error: true
            target:
              entity_id: "{{ cfg.al_switches }}"
      - alias: "Clear the kitchen latch only if the run set it"
        if:
          - condition: state
            entity_id: input_boolean.crazy_mode_kitchen_latch_set
            state: "on"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.kitchen_lights_manually_toggled
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.crazy_mode_kitchen_latch_set
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.crazy_mode_stop_requested
            - input_boolean.crazy_mode_paused
      - action: timer.cancel
        target:
          entity_id: timer.crazy_mode_phase
      - action: input_select.select_option
        target:
          entity_id: input_select.crazy_mode_phase
        data:
          option: "Off"

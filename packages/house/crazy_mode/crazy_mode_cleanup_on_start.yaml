# Crazy Mode - Cleanup On Start
#
# A restart mid-run leaves the phase set and Adaptive Lighting off. Reset
# the phase, turn Adaptive Lighting back on, clear what we latched.
# Sonos and lights stay as they are: the snapshot did not survive.
#

automation:
  - id: "crazy_mode_cleanup_on_start"
    alias: "Crazy Mode - Cleanup On Start"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - alias: "A run was interrupted"
        condition: not
        conditions:
          - condition: state
            entity_id: input_select.crazy_mode_phase
            state: "Off"
    actions:
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id:
            - switch.adaptive_lighting_kitchen
            - switch.adaptive_lighting_family_room
            - switch.adaptive_lighting_foyer
      - alias: "Clear the kitchen latch only if the run set it"
        if:
          - condition: state
            entity_id: input_boolean.crazy_mode_kitchen_latch_set
            state: "on"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.kitchen_lights_manually_toggled
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.crazy_mode_kitchen_latch_set
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.crazy_mode_stop_requested
      - action: timer.cancel
        target:
          entity_id: timer.crazy_mode_phase
      - action: input_select.select_option
        target:
          entity_id: input_select.crazy_mode_phase
        data:
          option: "Off"

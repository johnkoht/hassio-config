# Crazy Mode - Start
#
# The one entry point (dashboard, Alexa). One optional field, `zone`; with
# none it uses the picker. Checks the allowed rule for that zone, snapshots
# its Sonos, lights and Adaptive Lighting, groups the speakers, then hands off
# to the run script. Refusals speak only for the window reasons, on the
# zone's coordinator; house mode and emergency stay silent.
#

script:
  crazy_mode_start:
    alias: "Crazy Mode"
    icon: mdi:run-fast
    mode: single
    fields:
      zone:
        name: Zone
        description: Main floor or Basement; empty uses the picker
        required: false
        selector:
          select:
            options:
              - "Main floor"
              - "Basement"
    variables:
      # Anything but Basement is Main floor, so a stray value never empties a list
      zone_name: >-
        {% set z = zone if zone is defined else states('input_select.crazy_mode_zone') %}
        {{ 'Basement' if z == 'Basement' else 'Main floor' }}
      zone_key: "{{ 'basement' if zone_name == 'Basement' else 'main_floor' }}"
      cfg: "{{ state_attr('sensor.crazy_mode_zone_config', zone_key) }}"
      # The allowed sensor judges the picked zone; the favorites are judged for this one
      reason: >-
        {% set r = states('sensor.crazy_mode_reason') %}
        {% if r in ['ok', 'favorite_missing'] %}{{ 'ok' if zone_key in (state_attr('sensor.crazy_mode_favorites', 'ok_zones') or []) else 'favorite_missing' }}{% else %}{{ r }}{% endif %}
    sequence:
      - alias: "Refuse unless the rule is met for this zone"
        if:
          - condition: template
            value_template: "{{ reason != 'ok' }}"
        then:
          - alias: "Say so for the window reasons only, on the zone's coordinator"
            if:
              - condition: template
                value_template: >-
                  {{ reason in ['outside_window', 'already_ran'] and cfg is mapping }}
            then:
              - action: script.turn_on
                target:
                  entity_id: script.announcement_engine
                data:
                  variables:
                    sound_file: "/local/sounds/Notification-sound.mp3"
                    sound_length: 2
                    speech_message: "Crazy Mode is recharging — back {{ state_attr('sensor.crazy_mode_reason', 'retry') }}"
                    speech_volume: 45
                    media_players: "{{ [cfg.coordinator] }}"
          - alias: "A missing zone config is a fault, not a refusal to hide"
            if:
              - condition: template
                value_template: "{{ cfg is not mapping }}"
            then:
              - action: system_log.write
                data:
                  level: warning
                  logger: crazy_mode
                  message: "Crazy Mode start refused: no zone config for {{ zone_key }}"
          - stop: "Crazy Mode not allowed"
      - alias: "Record the start and take the phase first (blocks a second tap)"
        action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.crazy_mode_last_run
        data:
          timestamp: "{{ now().timestamp() | int }}"
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.crazy_mode_stop_requested
            - input_boolean.crazy_mode_paused
      - alias: "Copy the zone so a later pick can't change what this run restores"
        action: input_text.set_value
        target:
          entity_id: input_text.crazy_mode_active_zone
        data:
          value: "{{ zone_name }}"
      - alias: "Read the length once; the slider can move mid-run without effect"
        variables:
          speakers: "{{ cfg.speakers }}"
          coordinator: "{{ cfg.coordinator }}"
          lights: "{{ cfg.lights }}"
          al_switches: "{{ cfg.al_switches }}"
          crazy_minutes: "{{ [[states('input_number.crazy_mode_crazy_minutes') | float(5), 2] | max, 15] | min | int }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.crazy_mode_phase
        data:
          option: "Crazy"
      #
      # Snapshots come before anything is changed
      #
      - alias: "Snapshot the speakers with their groups"
        action: sonos.snapshot
        continue_on_error: true
        data:
          entity_id: "{{ speakers }}"
          with_group: true
      - alias: "Snapshot the lights and which Adaptive Lighting switches are on (a zone with no lights has none)"
        if:
          - condition: template
            value_template: "{{ lights | length > 0 }}"
        then:
          - action: scene.create
            data:
              scene_id: "{{ cfg.snapshot_scene }}"
              snapshot_entities: "{{ lights + al_switches }}"
      #
      # Keep the kitchen's motion lighting out of the run. Only clear what we set.
      #
      - alias: "Set the kitchen latch if this zone uses it and nobody had"
        if:
          - condition: template
            value_template: "{{ cfg.kitchen_latch }}"
          - condition: state
            entity_id: input_boolean.kitchen_lights_manually_toggled
            state: "off"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.crazy_mode_kitchen_latch_set
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.kitchen_lights_manually_toggled
        else:
          - alias: "Somebody else holds the latch, or the zone has none; make sure we do not clear it later"
            action: input_boolean.turn_off
            target:
              entity_id: input_boolean.crazy_mode_kitchen_latch_set
      - alias: "Pause Adaptive Lighting in the zone"
        if:
          - condition: template
            value_template: "{{ al_switches | length > 0 }}"
        then:
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: "{{ al_switches }}"
      #
      # Group the speakers under the coordinator. Always unjoin: a lone speaker
      # may still sit in another group.
      #
      - alias: "Take each speaker out of its old group"
        repeat:
          for_each: "{{ speakers }}"
          sequence:
            - action: media_player.unjoin
              continue_on_error: true
              target:
                entity_id: "{{ repeat.item }}"
      - alias: "Join the rest to the coordinator, only when the zone has more than one speaker"
        if:
          - condition: template
            value_template: "{{ speakers | length > 1 }}"
        then:
          - action: media_player.join
            continue_on_error: true
            target:
              entity_id: "{{ coordinator }}"
            data:
              group_members: "{{ speakers | reject('eq', coordinator) | list }}"
      - alias: "Hand off to the run script (not blocking, so the abort can cancel it)"
        action: script.turn_on
        target:
          entity_id: script.crazy_mode_run
        data:
          variables:
            crazy_minutes: "{{ crazy_minutes }}"

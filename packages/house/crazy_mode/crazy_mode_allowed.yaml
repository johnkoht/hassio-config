# Crazy Mode Allowed
#
# One rule for the start script, the refusal line and the dashboard.
# `sensor.crazy_mode_reason` holds the answer; the binary sensor is its "ok".
#

template:
  - sensor:
      - name: Crazy Mode Reason
        unique_id: crazy_mode_reason
        default_entity_id: sensor.crazy_mode_reason
        icon: mdi:run-fast
        state: >-
          {% set mid = today_at('00:00').timestamp() %}
          {% set n = now().timestamp() %}
          {% set ms = mid + state_attr('input_datetime.crazy_mode_morning_start', 'timestamp') | float(0) %}
          {% set me = mid + state_attr('input_datetime.crazy_mode_morning_end', 'timestamp') | float(0) %}
          {% set es = mid + state_attr('input_datetime.crazy_mode_evening_start', 'timestamp') | float(0) %}
          {% set ee = mid + state_attr('input_datetime.crazy_mode_evening_end', 'timestamp') | float(0) %}
          {% set last = state_attr('input_datetime.crazy_mode_last_run', 'timestamp') | float(0) %}
          {% set m_ok = ms < me %}
          {% set e_ok = es < ee %}
          {% set in_m = m_ok and ms <= n < me %}
          {% set in_e = e_ok and es <= n < ee %}
          {% set ran = (in_m and ms <= last < me) or (in_e and es <= last < ee) %}
          {% set favs = [states('input_text.crazy_mode_favorite_crazy'), states('input_text.crazy_mode_favorite_slowmo'), states('input_text.crazy_mode_favorite_cooldown')] %}
          {% set ns = namespace(missing=false) %}
          {% for sp in ['media_player.sonos_kitchen', 'media_player.sonos_family_room', 'media_player.sonos_living_room', 'media_player.sonos_playroom'] %}
            {% set sl = state_attr(sp, 'source_list') %}
            {% if sl is none or sl is string %}
              {% set ns.missing = true %}
            {% else %}
              {% for f in favs %}{% if f not in sl %}{% set ns.missing = true %}{% endif %}{% endfor %}
            {% endif %}
          {% endfor %}
          {% if not is_state('input_select.crazy_mode_phase', 'Off') %}running
          {%- elif is_state('binary_sensor.emergency_active', 'on') %}emergency
          {%- elif states('input_select.house') in ['Bedtime', 'Quiet', 'Away', 'Vacation'] %}house_mode
          {%- elif not is_state('input_boolean.house_occupied', 'on') %}not_occupied
          {%- elif not (m_ok or e_ok) %}window_unset
          {%- elif not (in_m or in_e) %}outside_window
          {%- elif ran %}already_ran
          {%- elif ns.missing %}favorite_missing
          {%- else %}ok{% endif %}
        attributes:
          # When the next run opens, for the spoken refusal.
          retry: >-
            {% set mid = today_at('00:00').timestamp() %}
            {% set n = now().timestamp() %}
            {% set ms = mid + state_attr('input_datetime.crazy_mode_morning_start', 'timestamp') | float(0) %}
            {% set me = mid + state_attr('input_datetime.crazy_mode_morning_end', 'timestamp') | float(0) %}
            {% set es = mid + state_attr('input_datetime.crazy_mode_evening_start', 'timestamp') | float(0) %}
            {% set ee = mid + state_attr('input_datetime.crazy_mode_evening_end', 'timestamp') | float(0) %}
            {% if ms < me and n < ms %}this morning
            {%- elif es < ee and n < es %}tonight
            {%- else %}tomorrow morning{% endif %}

  - binary_sensor:
      - name: Crazy Mode Allowed
        unique_id: crazy_mode_allowed
        default_entity_id: binary_sensor.crazy_mode_allowed
        icon: mdi:run-fast
        state: "{{ is_state('sensor.crazy_mode_reason', 'ok') }}"
        attributes:
          reason: "{{ states('sensor.crazy_mode_reason') }}"

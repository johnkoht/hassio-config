# Crazy Mode - Run
#
# Owns the phases: Crazy (the slider's length), Slow-mo 1 min, Cool-down 1 min,
# then the restore. Started by start or restart with `crazy_minutes`; never run
# it by hand. Crazy and Slow-mo run on timer.crazy_mode_phase, so a pause
# freezes the clock and every effect worked out from its progress. Cool-down
# can't be paused or stopped and keeps its own 60 s count.
#

script:
  crazy_mode_run:
    alias: "Crazy Mode - Run"
    icon: mdi:run-fast
    mode: single
    variables:
      # Two distinct picks per run. No jumping, spinning, hopping or one-foot moves.
      heavy_work:
        - "Wall pushes! Push the wall like a mountain."
        - "Big wall push. Hold it and stay strong."
        - "Carry a couch cushion across the room."
        - "Carry a stack of books, nice and slow."
        - "Chair push-ups. Lift your body up."
        - "Slow bear crawl to the next room."
        - "Give someone a big squeeze hug."
        - "Turtle shell! Curl up tight and breathe."
      pick_a: "{{ range(8) | random }}"
      pick_b: "{{ (pick_a + 1 + (range(7) | random)) % 8 }}"
      # Seconds between wakes of the tick loops
      tick: 5
      zone_key: "{{ 'basement' if is_state('input_text.crazy_mode_active_zone', 'Basement') else 'main_floor' }}"
    sequence:
      - alias: "Only run when start or restart handed over a length"
        condition: template
        value_template: "{{ crazy_minutes is defined }}"
      - alias: "Start left the phase at Crazy (an abort in between sets it Off)"
        condition: state
        entity_id: input_select.crazy_mode_phase
        state: "Crazy"
      - alias: "The zone config can be missing while templates reload; give it a minute"
        wait_template: "{{ state_attr('sensor.crazy_mode_zone_config', zone_key) is mapping }}"
        timeout: 60
        continue_on_timeout: true
      - variables:
          cfg: "{{ state_attr('sensor.crazy_mode_zone_config', zone_key) }}"
      - alias: "No config: say so and put the house back rather than run on empty lists"
        if:
          - condition: template
            value_template: "{{ cfg is not mapping }}"
        then:
          - action: system_log.write
            data:
              level: warning
              logger: crazy_mode
              message: "Crazy Mode run ended: no zone config for {{ zone_key }}"
          - action: script.crazy_mode_restore
          - stop: "No zone config"
      - variables:
          speakers: "{{ cfg.speakers }}"
          coordinator: "{{ cfg.coordinator }}"
          lights: "{{ cfg.lights }}"
          has_lights: "{{ cfg.lights | length > 0 }}"
          crazy_s: "{{ ([[crazy_minutes | float(5), 2] | max, 15] | min | int) * 60 }}"
          base: "{{ states('input_number.crazy_mode_base_volume') | float(40) / 100 }}"
          speech_vol: "{{ [states('input_number.crazy_mode_base_volume') | float(40) + 10, 75] | min | int }}"
          fav_crazy: "{{ states('input_text.crazy_mode_favorite_crazy') }}"
          fav_slowmo: "{{ states('input_text.crazy_mode_favorite_slowmo') }}"
          fav_cooldown: "{{ states('input_text.crazy_mode_favorite_cooldown') }}"
          # Declared here so the loops can update them (outer scope)
          was_paused: false
          one_min_fired: false
          prompt_b_fired: false
          now_paused: false
          left: 0
          dur: 0
          elapsed: 0
          progress: 0
      #
      # CRAZY
      #
      - action: timer.start
        target:
          entity_id: timer.crazy_mode_phase
        data:
          duration: "{{ crazy_s }}"
      - action: media_player.volume_set
        continue_on_error: true
        target:
          entity_id: "{{ speakers }}"
        data:
          volume_level: "{{ base }}"
      - alias: "Lights up (a zone with no lights makes no light calls)"
        if:
          - condition: template
            value_template: "{{ has_lights }}"
        then:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: "{{ lights }}"
            data:
              brightness_pct: 100
              transition: 2
      - action: media_player.select_source
        continue_on_error: true
        target:
          entity_id: "{{ coordinator }}"
        data:
          source: "{{ fav_crazy }}"
      - alias: "Shuffle has to be set after the source starts"
        delay: 3
      - action: media_player.shuffle_set
        continue_on_error: true
        target:
          entity_id: "{{ coordinator }}"
        data:
          shuffle: true
      - action: script.turn_on
        target:
          entity_id: script.announcement_engine
        data:
          variables:
            sound_file: "/local/sounds/Notification-sound.mp3"
            sound_length: 2
            speech_message: "Crazy Mode! Crazy, then slow-mo, then cool-down. Socks off!"
            speech_volume: "{{ speech_vol }}"
            media_players: "{{ speakers }}"
      - alias: "Crazy ticks: wake on stop, on the timer ending or on a pause change"
        repeat:
          while:
            - condition: state
              entity_id: input_boolean.crazy_mode_stop_requested
              state: "off"
            - condition: template
              value_template: "{{ states('timer.crazy_mode_phase') in ['active', 'paused'] }}"
          sequence:
            - wait_template: >-
                {{ is_state('input_boolean.crazy_mode_stop_requested', 'on')
                   or is_state('timer.crazy_mode_phase', 'idle')
                   or is_state('input_boolean.crazy_mode_paused', 'on') != was_paused }}
              timeout: "{{ tick }}"
              continue_on_timeout: true
            - alias: "Progress comes from the timer: finishes_at while active, remaining while paused"
              variables:
                now_paused: "{{ is_state('input_boolean.crazy_mode_paused', 'on') }}"
                was_paused: "{{ is_state('input_boolean.crazy_mode_paused', 'on') }}"
                left: >-
                  {% set t = 'timer.crazy_mode_phase' %}
                  {% set st = states(t) %}
                  {% if st == 'active' %}{{ [as_timestamp(state_attr(t, 'finishes_at'), 0) - now().timestamp(), 0] | max }}
                  {%- elif st == 'paused' %}{% set p = (state_attr(t, 'remaining') | string).split(':') %}{{ (p[0] | int(0) * 3600 + p[1] | int(0) * 60 + p[2] | float(0)) if p | length == 3 else 0 }}
                  {%- else %}0{% endif %}
                dur: >-
                  {% set p = (state_attr('timer.crazy_mode_phase', 'duration') | string).split(':') %}
                  {{ (p[0] | int(0) * 3600 + p[1] | int(0) * 60 + p[2] | float(0)) if p | length == 3 else 0 }}
            - variables:
                elapsed: "{{ [dur - left, 0] | max }}"
                progress: "{{ [elapsed / dur, 1] | min if dur > 0 else 1 }}"
            - alias: "Stopped, or the phase just ended: nothing more to do this tick"
              if:
                - condition: state
                  entity_id: input_boolean.crazy_mode_stop_requested
                  state: "off"
                - condition: template
                  value_template: "{{ left > 0 }}"
              then:
                - alias: "Re-assert the lights, paused or not; the kitchen vacancy automation ignores the latch"
                  if:
                    - condition: template
                      value_template: "{{ has_lights }}"
                  then:
                    - action: light.turn_on
                      continue_on_error: true
                      target:
                        entity_id: "{{ lights }}"
                      data:
                        brightness_pct: 100
                - alias: "Paused: keep the music paused. Running: the one-minute line"
                  if:
                    - condition: template
                      value_template: "{{ now_paused }}"
                  then:
                    - alias: "A phase start-up can restart playback after the pause"
                      if:
                        - condition: template
                          value_template: "{{ is_state(coordinator, 'playing') }}"
                      then:
                        - action: media_player.media_pause
                          continue_on_error: true
                          target:
                            entity_id: "{{ coordinator }}"
                  else:
                    - alias: "A minute left, once"
                      if:
                        - condition: template
                          value_template: "{{ not one_min_fired and left <= 60 }}"
                      then:
                        - variables:
                            one_min_fired: true
                        - action: script.turn_on
                          target:
                            entity_id: script.announcement_engine
                          data:
                            variables:
                              sound_file: "/local/sounds/Notification-sound.mp3"
                              sound_length: 2
                              speech_message: "One more minute of Crazy Mode!"
                              speech_volume: "{{ speech_vol }}"
                              media_players: "{{ speakers }}"
      #
      # SLOW-MO. A stop in Crazy skips straight to Cool-down.
      #
      - alias: "Slow-mo unless the stop button was pressed"
        if:
          - condition: state
            entity_id: input_boolean.crazy_mode_stop_requested
            state: "off"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.crazy_mode_phase
            data:
              option: "Slow-mo"
          - alias: "A pause between phases holds the next one back; a stop releases it"
            wait_template: >-
              {{ is_state('input_boolean.crazy_mode_paused', 'off')
                 or is_state('input_boolean.crazy_mode_stop_requested', 'on') }}
          - alias: "Still no stop"
            if:
              - condition: state
                entity_id: input_boolean.crazy_mode_stop_requested
                state: "off"
            then:
              - action: timer.start
                target:
                  entity_id: timer.crazy_mode_phase
                data:
                  duration: "00:01:00"
              - action: script.turn_on
                target:
                  entity_id: script.announcement_engine
                data:
                  variables:
                    sound_file: "/local/sounds/Notification-sound.mp3"
                    sound_length: 2
                    speech_message: "SLOW MOTION MODE!"
                    speech_volume: "{{ speech_vol }}"
                    media_players: "{{ speakers }}"
              - action: media_player.select_source
                continue_on_error: true
                target:
                  entity_id: "{{ coordinator }}"
                data:
                  source: "{{ fav_slowmo }}"
              - alias: "Slow-mo ticks: lights dim from 100% to 50%, music fades to about 70% in the first 10 s"
                repeat:
                  while:
                    - condition: state
                      entity_id: input_boolean.crazy_mode_stop_requested
                      state: "off"
                    - condition: template
                      value_template: "{{ states('timer.crazy_mode_phase') in ['active', 'paused'] }}"
                  sequence:
                    - wait_template: >-
                        {{ is_state('input_boolean.crazy_mode_stop_requested', 'on')
                           or is_state('timer.crazy_mode_phase', 'idle')
                           or is_state('input_boolean.crazy_mode_paused', 'on') != was_paused }}
                      timeout: "{{ tick }}"
                      continue_on_timeout: true
                    - alias: "Progress comes from the timer: finishes_at while active, remaining while paused"
                      variables:
                        now_paused: "{{ is_state('input_boolean.crazy_mode_paused', 'on') }}"
                        was_paused: "{{ is_state('input_boolean.crazy_mode_paused', 'on') }}"
                        left: >-
                          {% set t = 'timer.crazy_mode_phase' %}
                          {% set st = states(t) %}
                          {% if st == 'active' %}{{ [as_timestamp(state_attr(t, 'finishes_at'), 0) - now().timestamp(), 0] | max }}
                          {%- elif st == 'paused' %}{% set p = (state_attr(t, 'remaining') | string).split(':') %}{{ (p[0] | int(0) * 3600 + p[1] | int(0) * 60 + p[2] | float(0)) if p | length == 3 else 0 }}
                          {%- else %}0{% endif %}
                        dur: >-
                          {% set p = (state_attr('timer.crazy_mode_phase', 'duration') | string).split(':') %}
                          {{ (p[0] | int(0) * 3600 + p[1] | int(0) * 60 + p[2] | float(0)) if p | length == 3 else 0 }}
                    - variables:
                        elapsed: "{{ [dur - left, 0] | max }}"
                        progress: "{{ [elapsed / dur, 1] | min if dur > 0 else 1 }}"
                    - alias: "Stopped, or the phase just ended: nothing more to do this tick"
                      if:
                        - condition: state
                          entity_id: input_boolean.crazy_mode_stop_requested
                          state: "off"
                        - condition: template
                          value_template: "{{ left > 0 }}"
                      then:
                        - alias: "The frozen level is re-asserted while paused, without a ramp"
                          if:
                            - condition: template
                              value_template: "{{ has_lights }}"
                          then:
                            - action: light.turn_on
                              continue_on_error: true
                              target:
                                entity_id: "{{ lights }}"
                              data:
                                brightness_pct: "{{ (100 - 50 * progress) | round(0) | int }}"
                                transition: "{{ 0 if now_paused else tick }}"
                        - alias: "Paused: keep the music paused. Running: the volume fade"
                          if:
                            - condition: template
                              value_template: "{{ now_paused }}"
                          then:
                            - if:
                                - condition: template
                                  value_template: "{{ is_state(coordinator, 'playing') }}"
                              then:
                                - action: media_player.media_pause
                                  continue_on_error: true
                                  target:
                                    entity_id: "{{ coordinator }}"
                          else:
                            - if:
                                - condition: template
                                  value_template: "{{ elapsed < 16 }}"
                              then:
                                - action: media_player.volume_set
                                  continue_on_error: true
                                  target:
                                    entity_id: "{{ speakers }}"
                                  data:
                                    volume_level: "{{ base * (1 - 0.3 * ([elapsed / 10, 1] | min)) }}"
      #
      # COOL-DOWN (always 60 s). Nothing below reads the stop button.
      #
      - variables:
          c0: "{{ now().timestamp() }}"
          v0: "{{ state_attr(coordinator, 'volume_level') | float(base) }}"
          cool_vol: "{{ base * 0.45 }}"
          e: 0
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.crazy_mode_stop_requested
      - alias: "Entering Cool-down always clears a pause and resumes playback (a stop while paused)"
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.crazy_mode_paused
      - alias: "Music paused by a pause starts again"
        if:
          - condition: template
            value_template: "{{ is_state(coordinator, 'paused') }}"
        then:
          - action: media_player.media_play
            continue_on_error: true
            target:
              entity_id: "{{ coordinator }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.crazy_mode_phase
        data:
          option: "Cool-down"
      - action: timer.start
        target:
          entity_id: timer.crazy_mode_phase
        data:
          duration: "00:01:00"
      - alias: "Lights down (a zone with no lights makes no light calls)"
        if:
          - condition: template
            value_template: "{{ has_lights }}"
        then:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: "{{ lights }}"
            data:
              brightness_pct: 30
              transition: 3
      - alias: "Heavy-work prompt, first pick"
        action: script.turn_on
        target:
          entity_id: script.announcement_engine
        data:
          variables:
            sound_file: "/local/sounds/Notification-sound.mp3"
            sound_length: 2
            speech_message: "{{ heavy_work[pick_a | int] }}"
            speech_volume: "{{ speech_vol }}"
            media_players: "{{ speakers }}"
      - action: media_player.select_source
        continue_on_error: true
        target:
          entity_id: "{{ coordinator }}"
        data:
          source: "{{ fav_cooldown }}"
      - alias: "Cool-down ticks on its own 60 s count: fade in, the second prompt half way, fade out"
        repeat:
          while: "{{ now().timestamp() - c0 < 60 }}"
          sequence:
            - delay: "{{ [[tick, 60 - (now().timestamp() - c0)] | min, 0] | max }}"
            - variables:
                e: "{{ [now().timestamp() - c0, 60] | min }}"
            - alias: "Nobody pauses Cool-down; undo a pause that slipped in at the boundary"
              if:
                - condition: state
                  entity_id: input_boolean.crazy_mode_paused
                  state: "on"
              then:
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.crazy_mode_paused
                - action: media_player.media_play
                  continue_on_error: true
                  target:
                    entity_id: "{{ coordinator }}"
            - alias: "Lights stay at 30 (a zone with no lights makes no light calls)"
              if:
                - condition: template
                  value_template: "{{ has_lights }}"
              then:
                - action: light.turn_on
                  continue_on_error: true
                  target:
                    entity_id: "{{ lights }}"
                  data:
                    brightness_pct: 30
            - alias: "Second prompt at half way, once"
              if:
                - condition: template
                  value_template: "{{ not prompt_b_fired and e >= 30 }}"
              then:
                - variables:
                    prompt_b_fired: true
                - action: script.turn_on
                  target:
                    entity_id: script.announcement_engine
                  data:
                    variables:
                      sound_file: "/local/sounds/Notification-sound.mp3"
                      sound_length: 2
                      speech_message: "{{ heavy_work[pick_b | int] }}"
                      speech_volume: "{{ speech_vol }}"
                      media_players: "{{ speakers }}"
            - alias: "Music: a fade to about 45% over the first 10 s, a fade out over the last 10 s, never a hard cut"
              if:
                - condition: template
                  value_template: "{{ e <= 12 or e >= 48 }}"
              then:
                - action: media_player.volume_set
                  continue_on_error: true
                  target:
                    entity_id: "{{ speakers }}"
                  data:
                    volume_level: >-
                      {% if e <= 10 %}{{ v0 + (cool_vol - v0) * e / 10 }}
                      {%- elif e >= 50 %}{{ cool_vol * (1 - (e - 50) / 10) }}
                      {%- else %}{{ cool_vol }}{% endif %}
      #
      # END: closing line, then put the house back
      #
      - alias: "Closing line (the only blocking call, after the clock is done)"
        action: script.announcement_engine
        continue_on_error: true
        data:
          sound_file: "/local/sounds/Notification-sound.mp3"
          sound_length: 2
          speech_message: "Crazy Mode is over. Take a big breath. Save your world."
          speech_volume: "{{ speech_vol }}"
          media_players: "{{ speakers }}"
      - action: script.crazy_mode_restore

# Gianluca Heater - Turn On Upon Arrival
#
# Either parent arriving after 18:30 turns the heater on, even if the
# house is already occupied.
#

id: "gianluca_heater_turn_on_upon_arrival"
alias: "Gianluca Heater - Turn On Upon Arrival"
initial_state: on
triggers:
  - trigger: state
    id: john_arrived
    entity_id: input_select.john_status
    to: "Just Arrived"
  - trigger: state
    id: cristina_arrived
    entity_id: input_select.cristina_status_dropdown
    to: "Just Arrived"
  - trigger: state
    id: house_occupied
    entity_id: input_boolean.house_occupied
    to: "on"
conditions:
  - alias: "A parent just arrived, or the house just became occupied"
    condition: or
    conditions:
      - condition: trigger
        id:
          - john_arrived
          - cristina_arrived
      - condition: template
        value_template: >
          {{ (now() - states.input_boolean.house_occupied.last_changed).total_seconds() < 300 }}
  - alias: "Not that warm in his room (false if unavailable)"
    condition: numeric_state
    entity_id: sensor.gianluca_bedroom_awair_temperature
    below: 69
  - condition: time
    after: "18:30:00"
  - condition: state
    entity_id: switch.hue_smart_plug_1
    state: "off"
actions:
  - action: switch.turn_on
    target:
      entity_id: switch.hue_smart_plug_1

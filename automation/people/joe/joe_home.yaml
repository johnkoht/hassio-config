# Automation to detect and initiate home for Joe
#
# This automation will detect if Joe's home based on
# a bunch of triggers and conditions and then run a
# script to handle home actions.
#
# iPhone Detect must agree, so a UniFi tracker blip alone can't mark him home.
#
id: "joe_home"
initial_state: "on"
alias: "Joe Home"
trigger:
  - platform: state
    entity_id: binary_sensor.joe_presence
    to: "on"
  - platform: state
    entity_id: person.joe_falbo
    to: "home"
  # iPhone detect tracker is detected home
  - platform: state
    entity_id: device_tracker.joe_iphone_detect
    to: "home"
  - platform: event
    event_type: automation_reloaded
  - platform: homeassistant
    event: start
condition:
  # iPhone detect agrees he's home
  - condition: state
    entity_id: device_tracker.joe_iphone_detect
    state: "home"
  # - condition: state
  #   entity_id: binary_sensor.joe_presence
  #   state: "on"
  # Not currently home
  - condition: state
    entity_id: input_boolean.joe_home
    state: "off"
  - condition: or
    conditions:
      # Make sure the bayesian sensor is marked as home
      - condition: state
        entity_id: binary_sensor.joe_presence
        state: "on"
      # Person state is home
      - condition: state
        entity_id: person.joe_falbo
        state: "home"
action:
  - service: script.turn_on
    entity_id: script.joe_home

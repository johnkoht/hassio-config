id: "john_announce_departure"
alias: John Announce Departure
mode: parallel
initial_state: "on"
trigger:
  - platform: state
    entity_id: input_boolean.john_home
    to: "off"
    # Hold so a zone-edge flap announces once
    for:
      minutes: 1
condition:
  # Somebody has been home for 5 minutes
  - condition: state
    entity_id: input_boolean.house_occupied
    state: "on"
    for:
      minutes: 5
action:
  # Announcement script
  - action: script.person_announcement
    data:
      person: john
      announcement_type: departure

  condition: []
  action:
  - type: turn_on
    device_id: cdddd3246291229c09cb7cc75ff1feb1
    entity_id: light.hue_play_1
    domain: light
  - service: hue.hue_activate_scene
    data:
      group_name: Office Signal
      scene_name: John DnD
  - repeat:
      count: '3'
      sequence:

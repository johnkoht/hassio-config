---
name: Home Assistant CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  secrets-scan:
    name: Secrets & PII Scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          f=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks

      # Only the commits being added — history predates this check.
      - name: Scan new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD~1..$HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          ./gitleaks git --config .gitleaks.toml --redact --verbose --no-banner \
            --log-opts="$RANGE" .

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint

  ha-check:
    name: Home Assistant Config Check
    runs-on: ubuntu-latest
    needs: yamllint
    steps:
      - uses: actions/checkout@v4

      - name: Create fake secrets
        run: cp secrets.fake.yaml secrets.yaml

      - uses: frenck/action-home-assistant@v2
        with:
          path: "."
          secrets: "secrets.yaml"
          version: stable

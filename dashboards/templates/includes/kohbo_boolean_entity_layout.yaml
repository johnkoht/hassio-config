style:
  .: |
    hui-generic-entity-row {
      padding: 4px 0px !important;
    }

    hui-generic-entity-row:first-child {
      padding-top: 0px !important;
    }

    hui-generic-entity-row:last-child {
      padding-bottom: 0px !important;
    }

    ha-icon {
      fill: white !important;
    }
  hui-generic-entity-row$: |
      state-badge {
        flex: 0 0 30px !important;
      }
      .info {
        margin-left: 0 !important;
        padding-left: 10px !important;
        font-weight: 700 !important;
        font-size: 15px !important;
        line-height: 15px !important;
        padding-top: 2px !important;

        .secondary {
          font-weight: 400 !important;
          font-size: 12px !important;
          color: #ADB5BD !important;
          margin-top: 3px !important;
          line-height: 12px !important;
        }
      }

  hui-generic-entity-row:
    ha-entity-toggle:
      $:
        ha-switch:
          $: |
            /* HA 2025+ frontend replaced the Material switch with a Web Awesome
               component. Old .mdc-switch__* classes no longer exist. New DOM:
               label[part=base].checked > input.input
                 + span[part=control].switch > span[part=thumb].thumb */

            [part="control"] {
              width: 50px !important;
              height: 32px !important;
              border-radius: 16px !important;
              background: #484C51 !important;
              border: none !important;
              opacity: 1 !important;
              padding: 0 !important;
              box-sizing: border-box !important;
              position: relative !important;
            }

            [part="thumb"] {
              position: absolute !important;
              top: 50% !important;
              left: 2px !important;
              height: 28px !important;
              width: 28px !important;
              border-radius: 14px !important;
              background: #FFFFFF !important;
              border: none !important;
              box-shadow: 0px 0px 0px 1px rgba(0, 0, 0, 0.04),
                          0px 3px 8px rgba(0, 0, 0, 0.15),
                          0px 3px 1px rgba(0, 0, 0, 0.06) !important;
              transform: translateY(-50%) !important;
              transition: left 0.15s ease, background 0.15s ease !important;
            }

            .checked [part="control"] {
              background: #59A5D8 !important;
            }

            .checked [part="thumb"] {
              left: 20px !important;
            }
          

  ha-entity-toggle$: |
    ha-switch {
      padding: 6px 0px 6px 5px!important;
    }

#
# Plant Overview: 7-day moisture graph plus a Moisture / Temperature / Battery row; an Offline tile replaces both when there's no reading.
#
plant_overview:
  card:
    type: vertical-stack
    cards:
      - type: custom:stack-in-card
        card_mod: !include /config/dashboards/templates/includes/card_mod/climate_card/kohbo_climate_card_stack_styles.yaml
        visibility:
          - condition: numeric_state
            entity: '[[moisture_sensor]]'
            above: 0
        cards:
          - type: custom:mini-graph-card
            hours_to_show: 168
            points_per_hour: 1
            line_width: 4
            decimals: 0
            smoothing: true
            color_thresholds_transition: hard
            color_thresholds:
              # Red
              - color: "#ED4747"
                value: 0
              # Yellow
              - color: "#FFD166"
                value: 10
              # Green
              - color: "#06D6A0"
                value: 20
            entities:
              - entity: '[[moisture_sensor]]'
            name: '[[name]]'
            icon: mdi:flower
            card_mod: !include /config/dashboards/templates/includes/card_mod/climate_card/kohbo_climate_card_graph_styles.yaml

          - type: custom:stack-in-card
            mode: horizontal
            card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_horizontal_stack_bg.yaml
            cards:
              - type: custom:button-card
                entity: '[[moisture_sensor]]'
                template: kohbo_plant_moisture_item

              - type: custom:button-card
                entity: '[[temperature_sensor]]'
                template: kohbo_plant_temperature_item

              - type: custom:button-card
                entity: '[[battery_sensor]]'
                template: kohbo_plant_battery_item

      - type: custom:button-card
        template: kohbo_device_soil_offline_entity
        entity: '[[moisture_sensor]]'
        name: '[[name]]'
        icon: mdi:flower
        visibility:
          - condition: not
            conditions:
              - condition: numeric_state
                entity: '[[moisture_sensor]]'
                above: 0

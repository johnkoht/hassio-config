type: custom:bubble-card
card_type: pop-up
hash: "#nino"
styles: !include /config/dashboards/templates/includes/kohbo_popup_styles.yaml

cards:
  #
  # Profile Picture
  #
  - type: custom:button-card
    entity: person.nino
    template: people_profile_picture
    variables:
      status: |
        [[[
          if (states['input_select.nino_sleep_state'].state == "Sleep") {
            return "sleeping";
          }
        ]]]

  #
  # Heading
  #
  - type: custom:button-card
    name: "Nino"
    template: kohbo_person_heading
    custom_fields:
      location: '[[[ return states["input_select.nino_sleep_state"].state ]]]'

  #
  # Details
  #
  - type: entities
    card_mod: !include /config/dashboards/templates/includes/people/kohbo_person_entities_layout.yaml
    entities:
      #
      # Status
      #
      - type: custom:template-entity-row
        icon: kohbo:kohbo-person-status
        name: Status
        entity: input_select.nino_sleep_state
        secondary: "{{ states[config.entity].last_changed | relative_time }} ago"
        color: >
          {% set status = states[config.entity].state %}
          {% if status == "Awake" or status == "Just Got Up" %}
            var(--success-color)
          {% else %}
            var(--orange-color)
          {% endif %}
        card_mod: !include /config/dashboards/templates/includes/kohbo_entity_item_layout.yaml

      #
      # Bed Occupancy
      #
      - type: custom:template-entity-row
        icon: kohbo:kohbo-bed
        name: Bed Occupancy
        entity: binary_sensor.nino_bed_occupied
        state: "{{ 'Detected' if states[config.entity].state == 'on' else 'Clear' }}"
        secondary: "{{ states[config.entity].last_changed | relative_time }} ago"
        color: >
          {% if states[config.entity].state == "on" %}
            var(--orange-color)
          {% else %}
            var(--light-grey-color)
          {% endif %}
        card_mod: !include /config/dashboards/templates/includes/kohbo_entity_item_layout.yaml

  #
  # Medications
  #
  - type: custom:stack-in-card
    mode: vertical
    card_mod:
      style: |
        :host {
          --stack-card-gap: 0;
          --vertical-stack-card-gap: 0 !important;
        }
    cards:
      - type: entities
        card_mod: !include /config/dashboards/templates/includes/people/kohbo_person_entities_layout.yaml
        entities:
          - entity: input_boolean.nino_medication_1_taken
            icon: kohbo:kohbo-medication
            name: Dose 1
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            secondary_info: last-changed
            state_color: true

          - type: custom:template-entity-row
            icon: kohbo:kohbo-timer
            name: Dose 1 Reminder
            entity: timer.nino_medication_1_timer
            state: "{{ states[config.entity].state | title }}"
            secondary: "{{ states[config.entity].last_changed | relative_time }} ago"
            card_mod: !include /config/dashboards/templates/includes/kohbo_entity_item_layout.yaml

          - entity: input_boolean.nino_medication_2_taken
            icon: kohbo:kohbo-medication
            name: Dose 2
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            secondary_info: last-changed
            state_color: true

          - type: custom:template-entity-row
            icon: kohbo:kohbo-timer
            name: Dose 2 Reminder
            entity: timer.nino_medication_2_timer
            state: "{{ states[config.entity].state | title }}"
            secondary: "{{ states[config.entity].last_changed | relative_time }} ago"
            card_mod: !include /config/dashboards/templates/includes/kohbo_entity_item_layout.yaml

      - type: custom:stack-in-card
        mode: vertical
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_vertical_stack_bg.yaml
        cards:
          - type: custom:button-card
            name: Medication Reminder Time
            template: kohbo_card_section_title

          - type: entities
            card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_entities_container.yaml
            entities:
              - entity: input_datetime.nino_medication_1_time
                name: First dose at
                card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
              - entity: input_datetime.nino_medication_2_time
                name: Second dose at
                card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml

      - type: custom:stack-in-card
        mode: vertical
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_vertical_stack_bg.yaml
        cards:
          - type: custom:button-card
            name: Medication Supply
            template: kohbo_card_section_title

          - type: entities
            card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_entities_container.yaml
            entities:
              - type: custom:template-entity-row
                name: Days left
                icon: mdi:pill
                entity: sensor.nino_medication_days_remaining
                state: >-
                  {%- set s = states('sensor.nino_medication_days_remaining') -%}
                  {%- if s in ['unavailable', 'unknown', 'none', ''] -%}Not set
                  {%- else -%}{%- set d = s | int(0) -%}{{ d }} {{ 'day' if d == 1 else 'days' }}{%- endif -%}
                color: >-
                  {%- set d = states('sensor.nino_medication_days_remaining') | int(-1) -%}
                  {%- set t = states('input_number.medication_refill_threshold_days') | float(0) -%}
                  {%- set c = states('input_number.medication_refill_critical_days') | float(0) -%}
                  {%- if d >= 0 and c > 0 and d < c -%}var(--error-color)
                  {%- elif d >= 0 and t > 0 and d < t -%}var(--orange-color)
                  {%- else -%}var(--light-grey-color){%- endif -%}
                card_mod: !include /config/dashboards/templates/includes/kohbo_entity_item_layout.yaml
              - entity: input_number.nino_medication_refill_days
                name: Days to enter
                card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
              - type: custom:template-entity-row
                name: Add days to supply
                icon: mdi:plus-circle-outline
                state: Tap
                secondary: Adds the days above
                tap_action:
                  action: perform-action
                  perform_action: script.medication_refilled
                  data:
                    medication: nino
                card_mod: !include /config/dashboards/templates/includes/kohbo_entity_item_layout.yaml
              - type: custom:template-entity-row
                name: Set days left
                icon: mdi:pencil-outline
                state: Tap
                secondary: Replaces the count with the days above
                tap_action:
                  action: perform-action
                  perform_action: script.medication_stock_set
                  data:
                    medication: nino
                card_mod: !include /config/dashboards/templates/includes/kohbo_entity_item_layout.yaml

      - type: custom:stack-in-card
        mode: vertical
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_vertical_stack_bg.yaml
        cards:
          - type: custom:button-card
            name: Refill Alerts
            template: kohbo_card_section_title

          - type: entities
            card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_entities_container.yaml
            entities:
              - entity: input_number.medication_refill_threshold_days
                name: Alert below (days)
                card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
              - entity: input_number.medication_refill_critical_days
                name: Critical below (days)
                card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml

      - type: custom:stack-in-card
        mode: vertical
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_vertical_stack_bg.yaml
        cards:
          - type: custom:button-card
            name: Reminder Settings
            template: kohbo_card_section_title

          - type: entities
            card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_entities_container.yaml
            entities:
              - entity: input_boolean.nino_medication_reminders
                name: Reminders
                icon: mdi:pill
                card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
                state_color: true
              - entity: input_boolean.nino_medication_voice
                name: Voice
                icon: mdi:account-voice
                card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
                state_color: true
              - entity: input_boolean.nino_medication_push
                name: Push
                icon: mdi:cellphone-message
                card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
                state_color: true

#
# Quick Action Row
#
# Compact list row for the Quick Actions pop-up. Shows On/Off on the right,
# or variables.hint when set (a chevron for links, Start/Stop for scripts).
#
kohbo_quick_action_row:
  template: kohbo_device_entity_horizontal
  show_last_changed: false
  variables:
    hint: null
  state_display: |
    [[[
      if (variables.hint !== null) return variables.hint;
      return entity.state === 'on' ? 'On' : 'Off';
    ]]]
  styles:
    icon:
      - color: |
          [[[
            return ['on', 'playing'].includes(entity.state)
              ? 'var(--accent-color)' : 'var(--light-grey-color)';
          ]]]

kohbo_device_smart_plug_entity:
  template: kohbo_device_entity
  icon: mdi:power-plug
  state_display: >
    [[[
      if (entity.state == "on") {
        const sensor = variables.power_sensor ? states[variables.power_sensor] : null;
        if (sensor && sensor.state !== "" && Number.isFinite(Number(sensor.state))) {
          return `On - ${sensor.state} Watts`;
        }
        return `On - ${variables.last_changed}`;
      }
      if (entity.state == "off") {
        return `Off - ${variables.last_changed}`;
      }
      if (entity.state == "unavailable") {
        return "Unavailable";
      }
      if (entity.state == "unknown") {
        return "Unknown";
      }
      return entity.state;
    ]]]
  confirmation: >
    [[[
      if (variables.confirmation)
        return `Are you sure you want to toggle ${entity.attributes.friendly_name}?`;
      else
        return null;
    ]]]

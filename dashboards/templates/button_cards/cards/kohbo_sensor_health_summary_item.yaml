#
# Sensor Health Summary Item
#
# A kohbo_security_item tile for a count sensor: red with the count (plus variables.unit) when
# above 0, green with variables.zero_label at 0, grey when the sensor has no number.
#
kohbo_sensor_health_summary_item:
  template: kohbo_security_item
  variables:
    zero_label: None
    unit: ''
  state_display: |
    [[[
      const n = Number(entity.state);
      if (entity.state === '' || !Number.isFinite(n)) return '—';
      if (n === 0) return variables.zero_label;
      return variables.unit ? `${n} ${variables.unit}${n === 1 ? '' : 's'}` : `${n}`;
    ]]]
  tap_action:
    action: none
  hold_action:
    action: none
  styles:
    icon:
      - color: |
          [[[
            const n = Number(entity.state);
            if (entity.state === '' || !Number.isFinite(n)) return 'var(--secondary-text-color)';
            return n > 0 ? 'var(--error-color)' : 'var(--success-color)';
          ]]]

#
# Climate Settings Popup
#
# Shared popup used by the Climate header chip across all climate tabs
# (Overview, HVAC, Air Quality).
#
type: custom:bubble-card
card_type: pop-up
hash: '#climate_settings_popup'
close_by_clicking_outside: true
styles: !include /config/dashboards/templates/includes/kohbo_popup_styles.yaml

cards:
  #
  # Title
  #
  - type: custom:button-card
    template: kohbo_popup_page_title
    name: Settings

  #
  # General Automations
  #
  - type: custom:button-card
    template: section_title
    name: General Automations
  - type: entities
    entities:
      - entity: automation.main_floor_climate_morning_start
        name: Pre-Heat/Cool in Morning
        icon: mdi:weather-lightning-rainy
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

      - entity: automation.main_floor_climate_resume_when_nearly_home
        name: Activate Climate When Nearly Home
        icon: mdi:weather-lightning-rainy
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

      - entity: input_boolean.climate_energy_price_automations
        name: High Energy Price Automations
        icon: kohbo:kohbo-light-2
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

  #
  # Auto Resume Climate Automations
  #
  - type: custom:button-card
    template: section_title
    name: Automatically Resume Climate
  - type: entities
    entities:
      - entity: automation.main_floor_climate_resume
        name: Main Floor Climate Resume Automation
        icon: mdi:weather-lightning-rainy
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

      - entity: automation.second_floor_climate_resume
        name: Second Floor Climate Resume Automation
        icon: mdi:weather-lightning-rainy
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

  - type: custom:button-card
    name: Automatically resume thermostats when the house is occupied. The upper floor will resume if any room is occupied during the day.
    template: kohbo_card_section_description

  #
  # Auto-Eco Climate Automations
  #
  - type: custom:button-card
    template: section_title
    name: Eco-Mode Automations
  - type: entities
    entities:
      - entity: automation.main_floor_climate_to_eco
        name: Main Floor Auto Eco Mode
        icon: mdi:weather-lightning-rainy
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

      - entity: automation.second_floor_climate_off
        name: Second Floor Auto Eco Mode
        icon: mdi:weather-lightning-rainy
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

  - type: custom:button-card
    name: Automatically enable eco mode for the thermostats if the house is unoccupied. The main floor will turn to eco if the house enters bedtime mode (and there are not guests).
    template: kohbo_card_section_description

  #
  # Air Quality Automations
  #
  - type: custom:button-card
    template: section_title
    name: Air Quality
  - type: entities
    entities:
      - entity: input_boolean.construction_mode
        name: Construction Mode
        icon: mdi:hammer-wrench
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

  - type: custom:button-card
    name: Construction mode locks all air purifiers at 100% (Manual). Disable to resume normal AQI-driven automation.
    template: kohbo_card_section_description

  #
  # Weather Automations
  #
  - type: custom:button-card
    template: section_title
    name: Severe Weather
  - type: entities
    entities:
      - entity: automation.severe_weather_warning
        name: Severe Weather Warning
        icon: mdi:weather-lightning-rainy
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

      - entity: automation.severe_rain_incoming
        name: Severe Rain Incoming
        icon: mdi:weather-pouring
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

  #
  # Smart Climate (dry run)
  #
  - type: custom:button-card
    template: section_title
    name: Smart Climate (dry run)
  - type: entities
    entities:
      - entity: input_boolean.climate_automations
        name: Smart Climate
        icon: mdi:thermostat-auto
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

      - type: button
        name: Reset Smart Climate Defaults
        icon: mdi:backup-restore
        action_name: Reset
        tap_action:
          action: perform-action
          perform_action: script.climate_seed_defaults
          confirmation:
            text: Reset every smart climate setting to its default?

      - entity: input_select.climate_season
        name: Season Override
        icon: mdi:sun-snowflake-variant

      - entity: sensor.climate_active_season
        name: Active Season
        icon: mdi:sun-snowflake-variant
      - entity: input_select.climate_mode_main_floor
        name: Main Floor Mode
        icon: mdi:home-thermometer
      - entity: input_select.climate_mode_second_floor
        name: 2nd Floor Mode
        icon: mdi:home-thermometer
      - entity: input_select.climate_mode_jr_suite
        name: Jr Suite Mode
        icon: mdi:home-thermometer
      - entity: input_select.climate_mode_main_bedroom
        name: Main Bedroom Mode
        icon: mdi:home-thermometer
      - entity: input_select.climate_mode_ninos_bedroom
        name: Ninos Bedroom Mode
        icon: mdi:home-thermometer
      - entity: input_select.climate_mode_basement
        name: Basement Mode
        icon: mdi:home-thermometer

  - type: custom:button-card
    name: Each zone stays a dry run (the logbook shows what Smart Climate would do) unless its live switch is on. Trial the radiant zones and the garage only until the old Eco automations are retired.
    template: kohbo_card_section_description

  - type: custom:button-card
    template: section_title
    name: Smart Climate Live
  - type: entities
    entities:
      - entity: input_boolean.climate_live_main_floor
        name: "Live: Main Floor (clashes with Eco)"
        icon: mdi:home-thermometer
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

      - entity: input_boolean.climate_live_second_floor
        name: "Live: 2nd Floor (clashes with Eco)"
        icon: mdi:home-thermometer
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

      - entity: input_boolean.climate_live_jr_suite
        name: "Live: Jr Suite"
        icon: mdi:bed
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

      - entity: input_boolean.climate_live_main_bedroom
        name: "Live: Main Bedroom"
        icon: mdi:bed-king
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

      - entity: input_boolean.climate_live_ninos_bedroom
        name: "Live: Ninos Bedroom"
        icon: mdi:bed-double
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

      - entity: input_boolean.climate_live_basement
        name: "Live: Basement"
        icon: mdi:stairs-down
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

      - entity: input_boolean.climate_live_garage
        name: "Live: Garage"
        icon: mdi:garage
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true


  #
  # Smart Climate Setpoints
  #
  - type: custom:button-card
    template: section_title
    name: Smart Climate Setpoints
  - type: entities
    entities:
      - entity: input_number.climate_main_floor_comfort_heat
        name: Main Floor Comfort Heat
        icon: mdi:thermometer
      - entity: input_number.climate_main_floor_comfort_cool
        name: Main Floor Comfort Cool
        icon: mdi:thermometer
      - entity: input_number.climate_main_floor_sleep_heat
        name: Main Floor Sleep Heat
        icon: mdi:thermometer
      - entity: input_number.climate_main_floor_sleep_cool
        name: Main Floor Sleep Cool
        icon: mdi:thermometer
      - entity: input_number.climate_second_floor_comfort_heat
        name: 2nd Floor Comfort Heat
        icon: mdi:thermometer
      - entity: input_number.climate_second_floor_comfort_cool
        name: 2nd Floor Comfort Cool
        icon: mdi:thermometer
      - entity: input_number.climate_second_floor_sleep_heat
        name: 2nd Floor Sleep Heat
        icon: mdi:thermometer
      - entity: input_number.climate_second_floor_sleep_cool
        name: 2nd Floor Sleep Cool
        icon: mdi:thermometer
      - entity: input_number.climate_away_heat
        name: Away Heat
        icon: mdi:thermometer
      - entity: input_number.climate_away_cool
        name: Away Cool
        icon: mdi:thermometer
      - entity: input_number.climate_radiant_comfort_heat
        name: Radiant Comfort Heat
        icon: mdi:heating-coil
      - entity: input_number.climate_radiant_sleep_heat
        name: Radiant Sleep Heat
        icon: mdi:heating-coil
      - entity: input_number.climate_radiant_cold_heat
        name: Radiant Cold Weather Heat
        icon: mdi:heating-coil
      - entity: input_number.climate_radiant_away_heat
        name: Radiant Away Heat
        icon: mdi:heating-coil

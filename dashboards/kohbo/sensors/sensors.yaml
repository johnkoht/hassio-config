#
# Sensors — Overview Tab: device health score, network health, UPS power, and the tracked sensors that are online, by type.
# Offline and low-battery sensors have their own tabs. Data: packages/system/sensor_health/.
#
type: custom:vertical-layout
title: Sensors
path: sensors
theme: kohbo
subview: true
layout: !include /config/dashboards/templates/includes/layouts/kohbo_page_layout_tabbed_nav.yaml
cards:
  #
  # Page Header (with tab navbar)
  #
  - !include /config/dashboards/templates/includes/sensors/sensors_header.yaml


  #===========================================================================
  # DEVICE HEALTH
  #
  # Status, score ring and the Networks / Sensors / Batteries counts
  # (these replace the old summary row).
  #===========================================================================
  - !include /config/dashboards/templates/includes/sensors/device_health_overview.yaml


  #===========================================================================
  # NETWORK
  #
  # Static rows: the router row opens the routers popup (names and LQI); the
  # Hue row opens its group's more-info, which lists every spot with its state.
  #===========================================================================
  - type: custom:button-card
    template: section_title
    name: Network

  - type: vertical-stack
    cards:
      - type: custom:button-card
        template: kohbo_device_sensor_health_entity
        entity: binary_sensor.zigbee_coordinator_online
        name: Zigbee Coordinator

      - type: custom:button-card
        template: kohbo_device_sensor_health_entity
        entity: sensor.zigbee_routers_online
        name: Zigbee Routers
        tap_action:
          action: navigate
          navigation_path: '#zigbee_routers_popup'

      - type: custom:button-card
        template: kohbo_device_sensor_health_entity
        entity: binary_sensor.zwave_controller_online
        name: Z-Wave Controller

      - type: custom:button-card
        template: kohbo_device_sensor_health_entity
        entity: sensor.hue_spots_online
        name: Hue Spots
        tap_action:
          action: more-info
          entity: group.key_sensors_hue_spots

      - type: custom:button-card
        template: kohbo_device_sensor_health_entity
        entity: sensor.ble_proxies_online
        name: BLE Proxies


  #===========================================================================
  # POWER
  #
  # The APC UPS over NUT: status (human-readable, e.g. "Online", "On Battery"),
  # charge, runtime left and load. Alerts live in packages/system/ups/.
  #===========================================================================
  - type: custom:button-card
    template: section_title
    name: Power

  - type: vertical-stack
    cards:
      - type: custom:button-card
        template: kohbo_device_entity_horizontal
        entity: sensor.apc_ups_status
        name: UPS
        icon: mdi:power-plug-battery
        variables:
          # NUT status is compound ("OL CHRG"); green when on line power with no fault flag
          ups_ok: |
            [[[
              const t = (states['sensor.apc_ups_status_data']?.state ?? '').split(' ');
              return t.includes('OL') && !t.some(f => ['RB', 'OVER', 'BYPASS'].includes(f));
            ]]]
        state_display: |
          [[[ return entity.state; ]]]
        show_label: true
        label: |
          [[[ return `Input ${states['sensor.apc_ups_input_voltage']?.state ?? '?'} V`; ]]]
        styles:
          grid:
            - grid-template-columns: 24px auto 100px;
          state:
            - color: |
                [[[ return variables.ups_ok ? 'var(--success-color)' : 'var(--warning-color)'; ]]]
          icon:
            - color: |
                [[[ return variables.ups_ok ? 'var(--success-color)' : 'var(--warning-color)'; ]]]

      - type: custom:button-card
        template: kohbo_device_entity_horizontal
        entity: sensor.apc_ups_battery_charge
        name: Battery
        icon: mdi:battery
        show_last_changed: false
        state_display: |
          [[[ const n = Number(entity.state); return isNaN(n) ? 'Offline' : `${Math.round(n)}%`; ]]]

      - type: custom:button-card
        template: kohbo_device_entity_horizontal
        entity: sensor.apc_ups_battery_runtime
        name: Runtime Left
        icon: mdi:timer-outline
        show_last_changed: false
        state_display: |
          [[[ const n = Number(entity.state); return isNaN(n) ? 'Offline' : `${Math.round(n / 60)} min`; ]]]

      - type: custom:button-card
        template: kohbo_device_entity_horizontal
        entity: sensor.apc_ups_load
        name: Load
        icon: mdi:gauge
        show_last_changed: false
        show_label: true
        label: |
          [[[ return `${states['sensor.apc_ups_real_power']?.state ?? '?'} W`; ]]]
        state_display: |
          [[[ const n = Number(entity.state); return isNaN(n) ? 'Offline' : `${Math.round(n)}%`; ]]]


  #===========================================================================
  # TYPE SECTIONS
  #
  # Online sensors only: offline ones are on the Offline tab until they
  # recover. A section with nothing online hides, title included.
  #===========================================================================
  - type: custom:auto-entities
    show_empty: false
    card:
      type: entities
      title: Safety & Security
      card_mod: !include /config/dashboards/templates/includes/card_mod/entities/kohbo_auto_entities_section.yaml
    filter:
      include:
        - group: group.key_sensors_safety
          options:
            type: custom:button-card
            template: kohbo_device_sensor_health_entity
      exclude:
        - state: unavailable
        - state: unknown
    sort:
      method: entity_id

  - type: custom:auto-entities
    show_empty: false
    card:
      type: entities
      title: Motion & Occupancy
      card_mod: !include /config/dashboards/templates/includes/card_mod/entities/kohbo_auto_entities_section.yaml
    filter:
      include:
        - group: group.key_sensors_motion
          options:
            type: custom:button-card
            template: kohbo_device_sensor_health_entity
            variables:
              strip: ' ?(Motion Sensor|Motion Detector|Motion)'
      exclude:
        - state: unavailable
        - state: unknown
    sort:
      method: entity_id

  - type: custom:auto-entities
    show_empty: false
    card:
      type: entities
      title: Doors & Windows
      card_mod: !include /config/dashboards/templates/includes/card_mod/entities/kohbo_auto_entities_section.yaml
    filter:
      include:
        - group: group.key_sensors_doors
          options:
            type: custom:button-card
            template: kohbo_device_sensor_health_entity
            variables:
              strip: ' Sensor$'
      exclude:
        - state: unavailable
        - state: unknown
    sort:
      method: entity_id

  - type: custom:auto-entities
    show_empty: false
    card:
      type: entities
      title: Leak
      card_mod: !include /config/dashboards/templates/includes/card_mod/entities/kohbo_auto_entities_section.yaml
    filter:
      include:
        - group: group.leak_sensors
          options:
            type: custom:button-card
            template: kohbo_device_sensor_health_entity
            variables:
              strip: ' ?Leak Sensor( - )?'
      exclude:
        - state: unavailable
        - state: unknown
    sort:
      method: entity_id

  - type: custom:auto-entities
    show_empty: false
    card:
      type: entities
      title: Climate & Air
      card_mod: !include /config/dashboards/templates/includes/card_mod/entities/kohbo_auto_entities_section.yaml
    filter:
      include:
        - group: group.key_sensors_climate
          options:
            type: custom:button-card
            template: kohbo_device_sensor_health_entity
            variables:
              strip: ' (Climate|Weather Sensor|AQI)$'
      exclude:
        - state: unavailable
        - state: unknown
    sort:
      method: entity_id

  - type: custom:auto-entities
    show_empty: false
    card:
      type: entities
      title: Presence
      card_mod: !include /config/dashboards/templates/includes/card_mod/entities/kohbo_auto_entities_section.yaml
    filter:
      include:
        - group: group.key_sensors_presence
          options:
            type: custom:button-card
            template: kohbo_device_sensor_health_entity
            variables:
              strip: ' (Presence Sensor|Sensor)$'
      exclude:
        - state: unavailable
        - state: unknown
    sort:
      method: entity_id


  #
  # Zigbee Routers Popup
  #
  - !include /config/dashboards/kohbo/sensors/zigbee_routers_popup.yaml

  #
  # UPS & Power, Radio Health Popups
  #
  - !include /config/dashboards/kohbo/sensors/ups_power_popup.yaml
  - !include /config/dashboards/kohbo/sensors/radio_health_popup.yaml


  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

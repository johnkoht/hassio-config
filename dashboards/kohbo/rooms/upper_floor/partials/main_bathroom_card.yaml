#
# Main Bathroom
#
type: custom:decluttering-card
template: room_card
variables:
  - mode: input_select.main_bathroom
  - occupancy: input_boolean.main_bathroom_occupied
  - room: "main_bathroom"
  - room_name: Main Bathroom
  - navigation_path: '/dashboard-kohbo/rooms-main-bathroom'
  - temperature: "[[[ return states['sensor.main_bathroom_temperature'].state ]]]"
  - humidity: "[[[ return states['sensor.main_bathroom_humidity'].state ]]]"
  # Air quality from the adjacent main bedroom Awair
  - aqi: "[[[ return states['sensor.main_bedroom_air_quality'].state ]]]"
  - icon: mdi:shower
  - room_devices:
      # Lights
      - type: custom:button-card
        entity: light.main_bathroom_lights
        name: Lights
        template: kohbo_room_card_device
        icon: kohbo:kohbo-device-lights
        color: auto
      # Door
      - type: custom:button-card
        entity: binary_sensor.main_bathroom_door_sensor_status
        name: Door
        template: kohbo_room_card_device
      # Shower
      - type: custom:button-card
        entity: input_boolean.main_bathroom_shower_occupied
        name: Shower
        template: kohbo_room_card_device
        icon: mdi:shower

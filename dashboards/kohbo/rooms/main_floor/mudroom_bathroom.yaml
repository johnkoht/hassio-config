# Mudroom Bathroom
#
# Room page for the mudroom bathroom: light, fan, door and a settings popup.
#
type: custom:vertical-layout
title: Mudroom Bathroom
path: rooms-mudroom-bathroom
theme: kohbo
subview: true
layout: !include /config/dashboards/templates/includes/layouts/kohbo_page_layout.yaml
cards:
  #
  # Page Header
  #
  - type: custom:decluttering-card
    template: room_page_top_toolbar
    variables:
      - name: Mudroom Bathroom
      - navigation_path: /dashboard-kohbo/rooms-main-floor
      - settings_path: '#mudroom_bathroom_settings_popup'


  #
  # Room Overview
  #
  - type: custom:decluttering-card
    template: room_overview
    variables:
      - occupancy: input_boolean.mudroom_bathroom_occupied
      - mode: input_select.mudroom_bathroom


  #
  # Lights
  #
  - type: custom:button-card
    template: section_title
    name: Lights

  # Main Light (on/off only, no brightness)
  - type: tile
    entity: light.mudroom_bathroom_main_lights
    name: Main Light
    icon: mdi:ceiling-light
    show_entity_picture: false
    hide_state: false
    vertical: false


  #
  # Devices
  #
  - type: custom:button-card
    template: section_title
    name: Devices

  - type: grid
    columns: 2
    square: false
    cards:
      # Fan
      - type: custom:button-card
        entity: fan.mudroom_bathroom_fan
        name: Fan
        template: kohbo_device_smart_plug_entity
        icon: mdi:fan
        variables:
          power_sensor: sensor.mudroom_bathroom_fan_instantaneous_demand_2

      # Door
      - type: custom:button-card
        entity: binary_sensor.mudroom_bathroom_door
        name: Door
        template: kohbo_device_door_entity


  #
  # Mudroom Bathroom Settings Popup
  #
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#mudroom_bathroom_settings_popup'
    close_by_clicking_outside: true
    styles: !include /config/dashboards/templates/includes/kohbo_popup_styles.yaml
    margin_top_mobile: calc(100vh - 650px)
    margin_top_desktop: calc(100vh - 650px)

    cards:
      #
      # Title
      #
      - type: custom:button-card
        template: kohbo_popup_page_title
        name: Settings

      #
      # Automations
      #
      - type: custom:button-card
        template: section_title
        name: Automations
      - type: entities
        entities:
          - entity: automation.mudroom_bathroom_lights_motion_on
            name: Motion Lights
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            secondary_info: last-changed
            state_color: true
          - entity: automation.mudroom_bathroom_lights_off
            name: Lights Off When Empty
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            secondary_info: last-changed
            state_color: true
          - entity: automation.mudroom_bathroom_fan_fan_off
            name: Fan Off When Empty
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            secondary_info: last-changed
            state_color: true
          - entity: input_boolean.vacuum_mudroom_bathroom_at_night
            name: Clean at Night
            icon: mdi:robot-vacuum
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            secondary_info: last-changed
            state_color: true

      #
      # Sensors
      #
      - type: custom:button-card
        template: section_title
        name: Sensors
      - type: entities
        entities:
          - entity: binary_sensor.mudroom_bathroom_motion
            name: Motion Sensor
            icon: mdi:motion-sensor
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
            secondary_info: last-changed
            state_color: true
          - entity: binary_sensor.mudroom_bathroom_occupancy
            name: Occupancy Sensor
            icon: kohbo:kohbo-room-occupancy
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
            secondary_info: last-changed
            state_color: true
          - entity: sensor.mudroom_bathroom_illuminance
            name: Illuminance
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
            secondary_info: last-changed
            state_color: true

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

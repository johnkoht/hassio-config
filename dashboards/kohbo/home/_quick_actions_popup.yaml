        - type: conditional
          conditions:
            - condition: state
              entity: binary_sensor.quick_action_nino_music
              state: "on"
            - condition: state
              entity: media_player.ninos_room
              state: "playing"
          card:
            type: custom:button-card
            name: "Stop Nino's sleep music"
            icon: mdi:music-off
            tap_action:
              action: perform-action
              perform_action: script.nino_sleep_music_stop
              haptic: light
        - type: conditional
          conditions:
            - condition: state
              entity: binary_sensor.quick_action_nino_music
              state: "on"
            - condition: state
              entity: media_player.ninos_room
              state_not: "playing"
          card:
            type: custom:button-card
            name: "Start Nino's sleep music"
            icon: mdi:music
            tap_action:
              action: perform-action
              perform_action: script.nino_sleep_music_start
              haptic: light
        - type: custom:button-card
          entity: input_boolean.john_dnd
          name: "Do not disturb"
          icon: mdi:minus-circle
          show_state: true
          state_display: >
            [[[
              if (entity.state === 'on') return 'On';
              if (states['binary_sensor.john_dnd_active'].state === 'on') return 'Off (Mac camera/mic is holding it)';
              return 'Off';
            ]]]
          tap_action:
            action: toggle
            haptic: light
        - type: custom:button-card
          entity: input_boolean.camera_notifications
          name: "Camera alerts"
          icon: mdi:cctv
          show_state: true
          state_display: >
            [[[
              return entity.state === 'on' ? 'On' : 'Off';
            ]]]
          tap_action:
            action: toggle
            haptic: light
        - type: conditional
          conditions:
            - condition: state
              entity: binary_sensor.quick_action_nino_home_today

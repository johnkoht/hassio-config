              navigation_path: '/dashboard-kohbo/rooms-upstairs-hallway'
              haptic: light
        - type: conditional
          conditions:
            - condition: state
              entity: binary_sensor.quick_action_john_bedside_lamp
              state: "on"
          card:
            type: custom:button-card
            entity: light.hue_ambiance_lamp_1
            name: "Bedside lamp off"
            icon: mdi:lamp
            show_state: true
            state_display: >
              [[[
                return entity.state === 'on' ? 'On' : 'Off';
              ]]]
            tap_action:
              action: perform-action
              perform_action: light.turn_off
              haptic: light
              target:
                entity_id: light.hue_ambiance_lamp_1
        - type: conditional
          conditions:
            - condition: state
              entity: binary_sensor.quick_action_nino_nightlight
              state: "on"
          card:
            type: custom:button-card
            entity: light.nino_bedroom_lamp
            name: "Nino's nightlight"
            icon: mdi:lightbulb-night
            show_state: true
            state_display: >
              [[[
                return entity.state === 'on' ? 'On' : 'Off';
              ]]]
            tap_action:
              action: perform-action
              perform_action: light.toggle
              haptic: light
              target:
                entity_id: light.nino_bedroom_lamp
        - type: conditional

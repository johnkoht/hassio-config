#
# Quick Actions Popup
#
# Per-person pop-up: only the actions that apply right now. Rows are Bubble
# buttons, like the Notifications pop-up. Each person's
# block is gated by a `condition: user` (ids come from secrets.yaml); every
# row is a `conditional` on a quick_action_* sensor (state/user only, never
# template). Room links must match packages/house/quick_actions/quick_action_*_room.yaml.
#
type: custom:bubble-card
card_type: pop-up
hash: '#quick_actions'
close_by_clicking_outside: true
styles: !include /config/dashboards/templates/includes/kohbo_popup_styles.yaml

cards:
  - type: custom:button-card
    template: kohbo_popup_page_title
    name: Quick Actions

  #
  # John rows
  #
  - type: conditional
    conditions:
      - condition: user
        users:
          - !secret john_ha_user_id
    card:
      type: vertical-stack
      cards:
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.quick_actions_john_count
              state: "0"
          card:
            type: custom:bubble-card
            card_type: button
            button_type: name
            name: No suggestions right now
            icon: mdi:check-circle-outline
            tap_action:
              action: none
            button_action:
              tap_action:
                action: none
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.john_room_presence
              state: "dining_room"
          card:
            type: custom:bubble-card
            card_type: button
            button_type: name
            name: Go to Dining Room
            icon: mdi:door-open
            tap_action:
              action: navigate
              navigation_path: /dashboard-kohbo/rooms-dining-room
            button_action:
              tap_action:
                action: navigate
                navigation_path: /dashboard-kohbo/rooms-dining-room
            sub_button:

#
# Safety Device Notification
#
# Red header chip, shown while any leak sensor or safety device is offline or low on battery.
# Conditional cards reject condition: template, so it reads a template binary sensor.
#
type: conditional
conditions:
  - condition: state
    entity: binary_sensor.safety_devices_need_attention
    state: "on"
card:
  type: custom:button-card
  template: kohbo_header_chip_card
  entity: binary_sensor.safety_devices_need_attention
  icon: mdi:shield-alert
  show_state: false
  tap_action:
    action: navigate
    navigation_path: '/dashboard-kohbo/sensors-offline'
  styles:
    card:
      - background-color: var(--error-color)
    icon:
      - color: white

#
# Nino Medication Reminder — Dose 1
#
# Shown only while dose 1 is untaken AND its scheduled time has
# passed today, so this card doesn't sit in the notifications
# popup before the dose is even due.
#
type: conditional
conditions:
  - condition: state
    entity: input_boolean.nino_medication_1_taken
    state: "off"
  - condition: template
    value_template: >-
      {% set t = states('input_datetime.nino_medication_1_time') %}
      {% set ok = t not in ['unknown', 'unavailable', '', 'none', None] %}
      {{ ok and now() >= today_at(t) }}
card:
  type: custom:bubble-card
  card_type: button
  button_type: switch
  entity: input_boolean.nino_medication_1_taken
  name: Nino's Medication - Dose 1
  show_state: false
  show_last_changed: true
  show_last_updated: false
  sub_button:
    # Snooze
    - entity: timer.nino_medication_1_timer
      icon: mdi:rewind-15
      show_background: false
      tap_action:
        action: perform-action
        perform_action: timer.start
        target:
          entity_id: timer.nino_medication_1_timer
    # Mark taken
    - entity: script.nino_medication_taken
      icon: mdi:check-circle
      state_background: false
      show_background: false
      tap_action:
        action: perform-action
        perform_action: script.nino_medication_taken
        target: {}
        data:
          dose: "1"
  tap_action:
    action: none
  button_action:
    tap_action:
      action: none

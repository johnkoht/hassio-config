#
# Nino Medication Reminder — Dose 1
#
# Shown in the notifications popup whenever dose 1 is untaken.
# Cleared as soon as it's marked taken.
#
type: conditional
conditions:
  - condition: state
    entity: input_boolean.nino_medication_1_taken
    state: "off"
card:
  type: custom:bubble-card
  card_type: button
  button_type: switch
  entity: input_boolean.nino_medication_1_taken
  name: Nino's Medication - Dose 1
  show_state: false
  show_last_changed: true
  show_last_updated: false
  sub_button:
    # Snooze
    - entity: timer.nino_medication_1_timer
      icon: mdi:rewind-15
      show_background: false
      tap_action:
        action: perform-action
        perform_action: timer.start
        target:
          entity_id: timer.nino_medication_1_timer
    # Mark taken
    - entity: script.nino_medication_taken
      icon: mdi:check-circle
      state_background: false
      show_background: false
      tap_action:
        action: perform-action
        perform_action: script.nino_medication_taken
        target: {}
        data:
          dose: "1"
  tap_action:
    action: none
  button_action:
    tap_action:
      action: none

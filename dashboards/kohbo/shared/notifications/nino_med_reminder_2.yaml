#
# Nino Medication Reminder — Dose 2
#
# Shown only while dose 2 is in play (untaken AND its scheduled time
# has passed today or its snooze timer is active), so this card
# doesn't sit in the notifications popup before the dose is even due.
#
# The Lovelace conditional card only supports state, numeric_state,
# screen, user, location, time, and/or/not — no free-form Jinja
# templating — so this keys off the per-dose due binary sensor
# instead, which already encodes the untaken check.
#
type: conditional
conditions:
  - condition: state
    entity: binary_sensor.nino_medication_2_due
    state: "on"
card:
  type: custom:bubble-card
  card_type: button
  button_type: switch
  entity: input_boolean.nino_medication_2_taken
  name: Nino's Medication - Dose 2
  show_state: false
  show_last_changed: true
  show_last_updated: false
  sub_button:
    # Snooze
    - entity: timer.nino_medication_2_timer
      icon: mdi:rewind-15
      show_background: false
      tap_action:
        action: perform-action
        perform_action: timer.start
        target:
          entity_id: timer.nino_medication_2_timer
    # Mark taken
    - entity: script.nino_medication_taken
      icon: mdi:check-circle
      state_background: false
      show_background: false
      tap_action:
        action: perform-action
        perform_action: script.nino_medication_taken
        target: {}
        data:
          dose: "2"
  tap_action:
    action: none
  button_action:
    tap_action:
      action: none

# School Dashboard
#
# Glanceable view of today: status pills, a card per kid, then calendar
# and lunch. Every schedule value lives behind the gear
# (#school_settings_popup) — those input_datetime/input_number entities are
# declared in YAML (editable: false), so the popup is their only edit surface.
#
# Grade bands are labeled generically (no real school names — this repo is
# public).
#
type: custom:vertical-layout
title: School
path: school
theme: kohbo
layout: !include /config/dashboards/templates/includes/layouts/kohbo_page_layout.yaml
cards:
  #
  # Page Header
  #
  - type: custom:decluttering-card
    template: top_toolbar
    variables:
      - cards:
        - type: custom:button-card
          template: empty_column

        # Page Title
        - type: custom:button-card
          template: kohbo_header_page_title
          name: School

        # Settings button
        - type: custom:button-card
          template: kohbo_header_chip_card
          icon: mdi:dots-horizontal
          icon_color: var(--secondary-text-color)
          tap_action:
            action: navigate
            navigation_path: '#school_settings_popup'

  #===========================================================================
  # STATUS PILLS
  #===========================================================================
  # Wrapping variant: the shared page_chip_layout pins height to 45px, which
  # clips the second row once the conditional chips light up.
  - type: custom:mod-card
    style: !include /config/dashboards/templates/includes/card_mod/chips/page_chip_layout_wrap.yaml
    card:
      type: horizontal-stack
      cards:
        # Is it a school day — and for whom
        - type: custom:button-card
          template: kohbo_chip_card
          entity: binary_sensor.nino_school_day
          name: School Day
          icon: mdi:school
          tap_action:
            action: none
          state_display: >
            [[[
              const n = states['binary_sensor.nino_school_day']?.state === 'on';
              const g = states['binary_sensor.gianluca_school_day']?.state === 'on';
              if (n && g) return "School Today";
              if (n) return "Nino Only";
              if (g) return "Gianluca Only";
              return "No School";
            ]]]
          styles:
            icon:
              - color: >
                  [[[
                    const n = states['binary_sensor.nino_school_day']?.state === 'on';
                    const g = states['binary_sensor.gianluca_school_day']?.state === 'on';
                    return (n || g) ? "var(--success-color)" : "var(--light-grey-color)";
                  ]]]

        # Late start — primary band only, so effectively Nino
        - type: conditional
          conditions:
            - condition: state
              entity_id: binary_sensor.primary_school_late_start_today
              state: 'on'
          card:
            type: custom:button-card
            template: kohbo_chip_card
            entity: binary_sensor.primary_school_late_start_today
            name: Late Start
            icon: mdi:clock-alert-outline
            state_display: Late Start
            tap_action:
              action: none
            styles:
              icon:
                - color: var(--warning-color)

        # No-school override — silently changes every kid's schedule
        #
        # No early-dismissal chip: input_boolean.early_dismissal_today is
        # read by nothing in the package, so a chip would advertise an
        # effect that doesn't exist.
        - type: conditional
          conditions:
            - condition: state
              entity_id: input_boolean.school_day_override_off
              state: 'on'
          card:
            type: custom:button-card
            template: kohbo_chip_card
            entity: input_boolean.school_day_override_off
            name: Override
            icon: mdi:school-off-outline
            state_display: Override
            tap_action:
              action: none
            styles:
              icon:
                - color: var(--error-color)

        # Sick-day toggle. Tap to mark Nino home before the drop-off ping
        # asks; the medication voice gate and the ping both read it.
        - type: custom:button-card
          template: kohbo_chip_card
          entity: input_boolean.nino_home_today
          name: Nino Home
          icon: mdi:home-heart
          tap_action:
            action: toggle
          state_display: >
            [[[ return entity.state === 'on' ? 'Home' : 'School'; ]]]
          styles:
            icon:
              - color: >
                  [[[ return entity.state === 'on' ? 'var(--warning-color)' : 'var(--secondary-text-color)'; ]]]

  #===========================================================================
  # THE KIDS
  #===========================================================================
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        template: kohbo_school_kid_card
        entity: person.nino
        name: Nino
        variables:
          school_day: binary_sensor.nino_school_day
          started: binary_sensor.nino_school_started
          start_time: sensor.primary_school_start_time_today
          departure_time: sensor.nino_departure_time
          dismissal_time: sensor.primary_school_dismissal_time_today
          pickup_time: sensor.nino_pickup_time

      - type: custom:button-card
        template: kohbo_school_kid_card
        entity: person.gianluca
        name: Gianluca
        variables:
          school_day: binary_sensor.gianluca_school_day
          started: binary_sensor.gianluca_school_started
          start_time: sensor.parochial_school_start_time_today
          departure_time: sensor.gianluca_departure_time
          dismissal_time: sensor.parochial_school_dismissal_time_today
          pickup_time: sensor.gianluca_pickup_time

  #===========================================================================
  # TODAY'S EVENTS — each card hidden unless that school actually has events
  #===========================================================================
  - type: conditional
    conditions:
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.nino_school_events_today
            state: 'on'
          - condition: state
            entity_id: binary_sensor.gianluca_school_events_today
            state: 'on'
          - condition: state
            entity_id: binary_sensor.district_school_events_today
            state: 'on'
    card:
      type: custom:button-card
      template: section_title
      name: Today's Events

  - type: conditional
    conditions:
      - condition: state
        entity_id: binary_sensor.nino_school_events_today
        state: 'on'
    card:
      type: custom:button-card
      template: kohbo_school_list_card
      name: Nino — Primary (K-2)
      variables:
        flagged: >
          [[[
            return states['sensor.primary_school_events_today']?.attributes?.actionable || [];
          ]]]
        items: >
          [[[
            return states['sensor.primary_school_events_today']?.attributes?.informational || [];
          ]]]

  - type: conditional
    conditions:
      - condition: state
        entity_id: binary_sensor.gianluca_school_events_today
        state: 'on'
    card:
      type: custom:button-card
      template: kohbo_school_list_card
      name: Gianluca — Junior Kindergarten
      variables:
        flagged: >
          [[[
            return states['sensor.parochial_school_events_today']?.attributes?.actionable || [];
          ]]]
        items: >
          [[[
            return states['sensor.parochial_school_events_today']?.attributes?.informational || [];
          ]]]

  # District feed — the band-enabled check is baked into the sensor
  - type: conditional
    conditions:
      - condition: state
        entity_id: binary_sensor.district_school_events_today
        state: 'on'
    card:
      type: custom:button-card
      template: kohbo_school_list_card
      name: Intermediate / Middle (District)
      variables:
        flagged: >
          [[[
            return states['sensor.district_events_today']?.attributes?.actionable || [];
          ]]]
        items: >
          [[[
            return states['sensor.district_events_today']?.attributes?.informational || [];
          ]]]

  #===========================================================================
  # LUNCH — primary band only; there is no Junior Kindergarten menu feed
  #===========================================================================
  - type: conditional
    conditions:
      - condition: state
        entity_id: binary_sensor.nino_lunch_menu_today
        state: 'on'
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: section_title
          name: Lunch

        - type: custom:button-card
          template: kohbo_school_list_card
          name: Nino — Today's Entrees
          variables:
            items: >
              [[[
                return states['sensor.primary_school_lunch_menu']?.attributes?.entrees || [];
              ]]]
            empty_text: No menu published for today

  #===========================================================================
  # TOMORROW — closures, plus Nino's late start (so this shows every Tuesday)
  #===========================================================================
  - type: conditional
    conditions:
      - condition: state
        entity_id: binary_sensor.school_notable_tomorrow
        state: 'on'
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: section_title
          name: Tomorrow

        - type: custom:button-card
          template: kohbo_school_list_card
          name: Heads Up
          variables:
            flagged: >
              [[[
                const out = [];
                if (states['binary_sensor.primary_school_closed_tomorrow']?.state === 'on') {
                  out.push("Nino — no school tomorrow");
                }
                if (states['binary_sensor.primary_school_late_start_tomorrow']?.state === 'on') {
                  out.push("Nino — late start tomorrow");
                }
                if (states['binary_sensor.parochial_school_closed_tomorrow']?.state === 'on') {
                  out.push("Gianluca — no school tomorrow");
                }
                const bandOn = states['input_boolean.intermediate_school_enabled']?.state === 'on'
                            || states['input_boolean.middle_school_enabled']?.state === 'on';
                if (bandOn && states['binary_sensor.district_closed_tomorrow']?.state === 'on') {
                  out.push("District — no school tomorrow");
                }
                return out;
              ]]]

  #===========================================================================
  # OVERRIDES — the only two manual controls in the school system
  #===========================================================================
  - type: custom:button-card
    template: section_title
    name: Overrides

  - type: custom:button-card
    name: "No School Today cancels every kid's schedule for today. Early Dismissal is not wired up yet — nothing in the school package reads it. Both reset automatically at 23:58."
    template: kohbo_card_section_description
    styles:
      card:
        - margin-bottom: 14px

  - type: entities
    entities:
      - entity: input_boolean.school_day_override_off
        name: No School Today
        icon: mdi:school-off-outline
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true
      - entity: input_boolean.early_dismissal_today
        name: Early Dismissal Today (inactive)
        icon: mdi:clock-fast
        card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

  #
  # School Settings
  #
  - !include /config/dashboards/kohbo/school/components/school_settings_popup.yaml

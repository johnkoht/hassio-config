          style: |
            ha-card {
              background: transparent;
              box-shadow: none;
              border: none;
              padding: 0 16px 16px;
            }
        content: >-
          {%- set actionable = state_attr('sensor.district_events_today', 'actionable') | default([], true) -%}
          {%- set informational = state_attr('sensor.district_events_today', 'informational') | default([], true) -%}
          {%- if (actionable | length) == 0 and (informational | length) == 0 -%}
          No events today.
          {%- else -%}
          {%- for e in actionable %}
          - ⚠️ {{ e }}
          {% endfor -%}
          {%- for e in informational %}
          - {{ e }}
          {% endfor -%}
          {%- endif -%}

  # Junior Kindergarten
  - type: custom:stack-in-card
    mode: vertical
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_vertical_stack_bg.yaml
    cards:
      - type: custom:button-card
        template: kohbo_card_header
        name: Junior Kindergarten
      - type: entities
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_entities_container.yaml
        entities:
          - entity: binary_sensor.parochial_school_closed_today
            name: Closed Today
            icon: mdi:school-off
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            state_color: true
          - entity: binary_sensor.parochial_school_closed_tomorrow
            name: Closed Tomorrow
            icon: mdi:school-off
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            state_color: true
      - type: markdown
        card_mod:
          style: |
            ha-card {
              background: transparent;
              box-shadow: none;
              border: none;
              padding: 0 16px 16px;
            }
        content: >-
          {%- set actionable = state_attr('sensor.parochial_school_events_today', 'actionable') | default([], true) -%}
          {%- set informational = state_attr('sensor.parochial_school_events_today', 'informational') | default([], true) -%}
          {%- if (actionable | length) == 0 and (informational | length) == 0 -%}
          No events today.
          {%- else -%}
          {%- for e in actionable %}
          - ⚠️ {{ e }}
          {% endfor -%}
          {%- for e in informational %}
          - {{ e }}
          {% endfor -%}
          {%- endif -%}

  #===========================================================================
  # LUNCH
  #===========================================================================
  - type: custom:button-card
    template: section_title
    name: Lunch

  - type: custom:stack-in-card
    mode: vertical
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_vertical_stack_bg.yaml
    cards:
      - type: custom:button-card
        template: kohbo_card_header
        name: Primary (K-2) Lunch Menu
      - type: markdown
        card_mod:
          style: |
            ha-card {
              background: transparent;
              box-shadow: none;
              border: none;
              padding: 0 16px 16px;
            }
        content: >-
          {%- set entrees = state_attr('sensor.primary_school_lunch_menu', 'entrees') | default([], true) -%}
          {%- if (entrees | length) == 0 -%}
          No menu available for today.
          {%- else -%}
          {%- for item in entrees %}
          - {{ item }}
          {% endfor -%}
          {%- endif -%}

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

        entities:
          - entity: input_datetime.school_year_first_day
            name: First Day
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_datetime.school_year_last_day
            name: Last Day
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: binary_sensor.school_year_active
            name: School Year Active
            icon: mdi:school
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            state_color: true

  #===========================================================================
  # SCHOOLS (District 34 grade bands)
  #===========================================================================
  - type: custom:button-card
    template: section_title
    name: Schools

  # Primary (K-2)
  - type: custom:stack-in-card

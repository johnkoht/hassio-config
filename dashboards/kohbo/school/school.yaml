        entities:
          - entity: input_datetime.primary_school_start_time
            name: Start Time
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_datetime.primary_school_late_start_time
            name: Late Start Time (Wednesdays)
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_datetime.primary_school_dismissal_time
            name: Dismissal Time
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: binary_sensor.primary_school_in_session_today
            name: In Session Today
            icon: mdi:school
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            state_color: true
          - entity: binary_sensor.primary_school_late_start_today
            name: Late Start Today
            icon: mdi:clock-alert
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            state_color: true

  # Intermediate (3-5)
  - type: custom:stack-in-card
    mode: vertical
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_vertical_stack_bg.yaml
    cards:
      - type: custom:button-card
        template: kohbo_card_header
        name: Intermediate (3-5)
      - type: entities
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_entities_container.yaml
        entities:
          - entity: input_datetime.intermediate_school_start_time
            name: Start Time
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_datetime.intermediate_school_late_start_time
            name: Late Start Time (Wednesdays)
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_datetime.intermediate_school_dismissal_time
            name: Dismissal Time
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: binary_sensor.intermediate_school_in_session_today
            name: In Session Today
            icon: mdi:school
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            state_color: true
          - entity: binary_sensor.intermediate_school_late_start_today
            name: Late Start Today
            icon: mdi:clock-alert
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            state_color: true

  # Middle (6-8)
  - type: custom:stack-in-card
    mode: vertical
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_vertical_stack_bg.yaml
    cards:
      - type: custom:button-card
        template: kohbo_card_header
        name: Middle (6-8)
      - type: entities
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_entities_container.yaml
        entities:
          - entity: input_datetime.middle_school_start_time
            name: Start Time
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_datetime.middle_school_late_start_time
            name: Late Start Time (Wednesdays)
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_datetime.middle_school_dismissal_time
            name: Dismissal Time
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: binary_sensor.middle_school_in_session_today
            name: In Session Today
            icon: mdi:school
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            state_color: true
          - entity: binary_sensor.middle_school_late_start_today
            name: Late Start Today
            icon: mdi:clock-alert
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            state_color: true

  #===========================================================================
  # JUNIOR KINDERGARTEN
  #===========================================================================
  - type: custom:button-card
    template: section_title
    name: Junior Kindergarten

  - type: custom:stack-in-card
    mode: vertical
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_vertical_stack_bg.yaml
    cards:
      - type: entities
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_entities_container.yaml
        entities:
          - entity: input_datetime.parochial_school_start_time
            name: Start Time
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_datetime.parochial_school_departure_time
            name: Departure Time
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_datetime.parochial_school_monday_dismissal
            name: Monday Dismissal
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_datetime.parochial_school_tuesday_dismissal
            name: Tuesday Dismissal
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_datetime.parochial_school_wednesday_dismissal
            name: Wednesday Dismissal
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_datetime.parochial_school_thursday_dismissal
            name: Thursday Dismissal
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_datetime.parochial_school_friday_dismissal
            name: Friday Dismissal
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml

  #===========================================================================
  # REMINDERS
  #===========================================================================
  - type: custom:button-card
    template: section_title
    name: Reminders

  - type: custom:stack-in-card
    mode: vertical
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_vertical_stack_bg.yaml
    cards:
      - type: entities
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_entities_container.yaml
        entities:
          - entity: input_datetime.school_breakfast_reminder_time
            name: Breakfast Reminder Time
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_number.nino_departure_lead_minutes
            name: Nino Departure Lead
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_number.nino_pickup_lead_minutes
            name: Nino Pickup Lead
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml
          - entity: input_number.gianluca_pickup_lead_minutes
            name: Gianluca Pickup Lead
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_no_icon.yaml

  #===========================================================================
  # CALENDAR
  #===========================================================================
  - type: custom:button-card
    template: section_title
    name: Calendar

  # Primary (K-2)
  - type: custom:stack-in-card
    mode: vertical
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_vertical_stack_bg.yaml
    cards:
      - type: custom:button-card
        template: kohbo_card_header
        name: Primary (K-2)
      - type: entities
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_entities_container.yaml
        entities:
          - entity: binary_sensor.primary_school_closed_today
            name: Closed Today
            icon: mdi:school-off
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            state_color: true
          - entity: binary_sensor.primary_school_closed_tomorrow_v2
            name: Closed Tomorrow
            icon: mdi:school-off
            card_mod: !include /config/dashboards/templates/includes/kohbo_boolean_entity_layout.yaml
            state_color: true
      - type: markdown
        card_mod:
          style: |
            ha-card {
              background: transparent;
              box-shadow: none;
              border: none;
              padding: 0 16px 16px;
            }
        content: >-
          {%- set actionable = state_attr('sensor.primary_school_events_today', 'actionable') | default([], true) -%}
          {%- set informational = state_attr('sensor.primary_school_events_today', 'informational') | default([], true) -%}
          {%- if (actionable | length) == 0 and (informational | length) == 0 -%}
          No events today.
          {%- else -%}
          {%- for e in actionable %}
          - ⚠️ {{ e }}
          {% endfor -%}
          {%- for e in informational %}
          - {{ e }}
          {% endfor -%}
          {%- endif -%}

  # Intermediate / Middle (district feed)
  - type: custom:stack-in-card
    mode: vertical
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_vertical_stack_bg.yaml
    cards:
      - type: custom:button-card
        template: kohbo_card_header
        name: Intermediate / Middle (District)
      - type: entities
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/kohbo_entities_container.yaml
        entities:
